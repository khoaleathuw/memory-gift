<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Gift</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f5f5f5;}
.card-box{max-width:700px;margin:40px auto;background:white;padding:30px;border-radius:20px;}
.img-item img{width:100%;height:120px;object-fit:cover;border-radius:12px;}
</style>
</head>

<body>

<div class="card-box">

<h3>Edit Gift</h3>

<form id="giftForm">

<input type="hidden" id="giftId" th:value="${gift.id}">

<!-- ================= IMAGES ================= -->
<input type="file" id="imageInput" multiple hidden>

<div class="row g-2" id="previewContainer">

    <div class="col-4" id="addBox">
        <div style="border:2px dashed #ccc;height:120px;display:flex;align-items:center;justify-content:center;cursor:pointer"
             onclick="imageInput.click()">
            +
        </div>
    </div>

</div>

<!-- MESSAGE -->
<textarea id="messageBox" class="form-control mt-3" rows="4"
          th:text="${gift.message}"></textarea>

<!-- AUDIO -->
<input type="file" id="audioInput" accept="audio/*" class="mt-3">

<audio id="audioPreview" controls style="width:100%;margin-top:10px;">
    <source th:if="${gift.voiceUrl != null}"
            th:src="@{'/uploads/' + ${gift.voiceUrl}}">
</audio>

<button class="btn btn-success mt-3">Save</button>

</form>

</div>

<script th:inline="javascript">

/* ================= SAFE DATA ================= */
let giftId = [[{$gift,id}]];

/* SAFE IMAGE ARRAY */
let existingImages = /*[[${gift.images}]]*/ [];

const previewContainer = document.getElementById("previewContainer");
const addBox = document.getElementById("addBox");

/* render old images */
if(existingImages != null){
    existingImages.forEach(img => {

        const col = document.createElement("div");
        col.className = "col-4 img-item";

        col.innerHTML = `<img src="/uploads/${img.imageUrl}">`;

        previewContainer.insertBefore(col, addBox);
    });
}

/* ADD NEW IMAGE */
let selectedImages = [];

document.getElementById("imageInput").addEventListener("change", function(){

    Array.from(this.files).forEach(file => {

        selectedImages.push(file);

        const reader = new FileReader();

        reader.onload = e => {

            const col = document.createElement("div");
            col.className = "col-4 img-item";

            col.innerHTML = `<img src="${e.target.result}">`;

            previewContainer.insertBefore(col, addBox);
        };

        reader.readAsDataURL(file);
    });
});

/* AUDIO PREVIEW */
document.getElementById("audioInput").addEventListener("change", function(){
    document.getElementById("audioPreview").src =
        URL.createObjectURL(this.files[0]);
});

/* SAVE */
document.getElementById("giftForm").addEventListener("submit", function(e){

    e.preventDefault();

    const formData = new FormData();

    formData.append("message", document.getElementById("messageBox").value);

    selectedImages.forEach(f=>{
        formData.append("images", f);
    });

    if(document.getElementById("audioInput").files[0]){
        formData.append("audio",
            document.getElementById("audioInput").files[0]);
    }

    fetch("/api/gift/update/" + giftId, {
        method: "POST",
        body: formData
    }).then(r => r.text())
      .then(d => alert("OK update"));
});

</script>

</body>
</html>

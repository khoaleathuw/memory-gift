<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Gift</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f5f5f5;}
.card-box{
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.img-item img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:12px;
}

.section-title{
    font-weight:bold;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="card-box">

<h3>Edit Gift</h3>

<form id="giftForm">

<!-- ID -->
<input type="hidden" id="giftId" th:value="${gift.id}">

<!-- ================= MESSAGE ================= -->
<div class="section-title">Message</div>
<textarea id="message" class="form-control"
          rows="4"
          th:text="${gift.message}"></textarea>

<!-- ================= IMAGES ================= -->
<div class="section-title">Images</div>

<input type="file" id="imageInput" multiple accept="image/*" class="form-control">

<div class="row g-2 mt-2" id="previewContainer">

    <!-- OLD IMAGES -->
    <div class="col-4 img-item"
         th:each="img : ${gift.images}">
        <img th:src="@{${img.imageUrl}}">
    </div>

</div>

<!-- ================= AUDIO ================= -->
<div class="section-title">Voice</div>

<div th:if="${gift.voiceUrl != null}">
    <audio controls style="width:100%">
        <source th:src="@{${gift.voiceUrl}}">
    </audio>
</div>

<input type="file" id="audioInput" accept="audio/*" class="form-control mt-2">

<audio id="audioPreview" controls style="width:100%;margin-top:10px;"></audio>

<!-- SAVE -->
<button class="btn btn-success mt-3">Save</button>

</form>

</div>

<script>

const giftId = document.getElementById("giftId").value;

let newImages = [];
let newAudio = null;

/* ================= IMAGE ================= */
document.getElementById("imageInput").addEventListener("change", function(){

    Array.from(this.files).forEach(file => {

        newImages.push(file);

        const reader = new FileReader();

        reader.onload = e => {

            const div = document.createElement("div");
            div.className = "col-4 img-item";

            div.innerHTML = `<img src="${e.target.result}">`;

            document.getElementById("previewContainer").appendChild(div);
        };

        reader.readAsDataURL(file);
    });
});

/* ================= AUDIO ================= */
document.getElementById("audioInput").addEventListener("change", function(){

    if(this.files.length > 0){
        newAudio = this.files[0];
        document.getElementById("audioPreview").src =
            URL.createObjectURL(newAudio);
    }
});

/* ================= SUBMIT ================= */
document.getElementById("giftForm").addEventListener("submit", async (e) => {

    e.preventDefault();

    const formData = new FormData();

    formData.append("message",
        document.getElementById("message").value
    );

    newImages.forEach(img => {
        formData.append("images", img);
    });

    if(newAudio){
        formData.append("audio", newAudio);
    }

    const res = await fetch("/api/gift/update/" + giftId, {
        method: "POST",
        body: formData
    });

    const text = await res.text();

    if(res.ok){
        alert("Update success");
        window.location.href = "/gift/view/" + giftId;
    } else {
        alert("Error: " + text);
    }
});

</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
<meta charset="UTF-8">
<title>Edit Gift</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/gift-edit.css}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --night-deep:#070b1f;
  --night-navy:#0f1638;
  --night-mid:#1b2452;
  --night-indigo:#2a3570;
  --star-white:#f4f6ff;
  --star-soft:#c9d2ff;
  --moon-glow:#fdf6e3;
  --silver:#cfd6f0;
  --lilac:#9f8fe0;
  --ink:#e8ebff;
  --ink-soft:#a6acd9;
}

*{box-sizing:border-box;margin:0;padding:0;}

html, body{ height:100%; }

body{
  background:
    radial-gradient(ellipse 70% 40% at 78% 6%, rgba(253,246,227,0.10), transparent 60%),
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(159,143,224,0.14), transparent 60%),
    radial-gradient(ellipse 90% 50% at 50% 110%, rgba(42,53,112,0.35), transparent 60%),
    linear-gradient(180deg, var(--night-deep), var(--night-navy) 60%, var(--night-mid));
  min-height:100vh;
  min-height:100dvh; /* tránh viewport nhảy khi bàn phím/thanh địa chỉ mobile ẩn hiện */
  font-family:'Inter',sans-serif;
  color:var(--ink);
  max-width:480px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow-x:hidden;
}

/* subtle static star sprinkle */
.star-field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.star-dot{
  position:absolute;border-radius:50%;background:var(--star-white);
  box-shadow:0 0 5px 1px rgba(244,246,255,0.6);
  animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7);}50%{opacity:.9;transform:scale(1.1);}}
@media (prefers-reduced-motion: reduce){ .star-dot{animation:none;} }

.booth-shell{
  flex:1;
  display:flex;
  flex-direction:column;
  border-left:1px solid rgba(159,143,224,0.15);
  border-right:1px solid rgba(159,143,224,0.15);
  position:relative;
  z-index:1;
}

.booth-shell form{
  flex:1;
}

/* ── MARQUEE TOPBAR ── */
.booth-marquee{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg, var(--night-navy), var(--night-deep) 95%);
  border-bottom:1px solid rgba(159,143,224,0.25);
  padding:14px 16px 10px;
  text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,0.35);
}
.booth-marquee .bulbs{
  display:flex;justify-content:center;gap:8px;margin-bottom:6px;
}
.booth-marquee .bulb{
  width:5px;height:5px;border-radius:50%;
  background:var(--moon-glow);
  box-shadow:0 0 6px 1px rgba(253,246,227,0.7);
  opacity:.85;
  animation:bulbFlicker 2.4s ease-in-out infinite;
}
.booth-marquee .bulb:nth-child(odd){animation-delay:.3s;}
.booth-marquee .bulb:nth-child(3n){animation-delay:.6s;}
@keyframes bulbFlicker{0%,100%{opacity:.9}50%{opacity:.35}}

.booth-marquee-row{display:flex;align-items:center;justify-content:space-between;}
.booth-back, .booth-done{
  background:none;border:none;color:var(--ink);font-size:20px;
  cursor:pointer;opacity:.9;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
}
.booth-done{
  font-family:'Inter',sans-serif;font-weight:800;font-size:14px;
  color:var(--moon-glow);opacity:1;
}
.booth-done:hover{color:#fff;}
.booth-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;font-style:italic;
  font-size:21px;letter-spacing:1px;
  color:var(--ink);
}
.booth-title span{color:var(--moon-glow);}
.booth-tagline{
  font-family:'Inter',sans-serif;
  font-weight:500;
  font-size:11px;color:rgba(232,235,255,0.6);
  margin-top:4px;letter-spacing:.3px;
}

/* ── SECTION LABEL ── */
.booth-label{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:16px;letter-spacing:.5px;
  color:var(--lilac);
  padding:20px 18px 8px;
}

/* ── FILMSTRIP (PHOTO GRID) ── */
.filmstrip{
  margin:0 12px;
  padding:14px 14px 18px;
  background:rgba(27,36,82,0.5);
  border:1px solid rgba(159,143,224,0.25);
  border-radius:14px;
  position:relative;
  backdrop-filter:blur(2px);
}

.ig-photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.ig-photo-item{
  aspect-ratio:1;
  position:relative;
  background:var(--night-deep);
  padding:5px 5px 8px;
  border-radius:6px;
  box-shadow:0 3px 8px rgba(0,0,0,.5);
  overflow:hidden;
  border:1px solid rgba(207,214,240,0.25);
}
.ig-photo-item:nth-child(6n+1){transform:rotate(-3deg);}
.ig-photo-item:nth-child(6n+2){transform:rotate(2deg);}
.ig-photo-item:nth-child(6n+3){transform:rotate(-1.5deg);}
.ig-photo-item:nth-child(6n+4){transform:rotate(3deg);}
.ig-photo-item:nth-child(6n+5){transform:rotate(0deg);}
.ig-photo-item:nth-child(6n+6){transform:rotate(1.5deg);}
.ig-photo-item img{
  width:100%;height:100%;
  object-fit:cover;display:block;
  filter:saturate(1.02) contrast(1.03) brightness(.98);
}
.ig-photo-item .del-btn{
  position:absolute;top:5px;right:5px;
  width:24px;height:24px;border-radius:50%;
  background:rgba(7,11,31,0.72);
  border:none;color:#fff;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(3px);
  transition:background .15s;
}
.ig-photo-item .del-btn:hover{background:var(--lilac);}

.ig-add-slot{
  aspect-ratio:1;
  background:rgba(255,255,255,0.04);
  border:1.5px dashed rgba(159,143,224,0.45);
  border-radius:6px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  cursor:pointer;
  color:var(--lilac);
  font-size:10.5px;
  font-weight:600;
  font-family:'Inter',sans-serif;
  transition:background .15s, border-color .15s;
}
.ig-add-slot:hover{ background:rgba(159,143,224,0.1); border-color:var(--star-soft); }
.ig-add-slot .bi{font-size:22px;color:var(--star-soft);}

.filmstrip-hint{
  font-family:'Inter',sans-serif;
  font-size:11px;color:var(--ink-soft);
  text-align:center;padding:10px 4px 0;
}

/* ── GIF UPLOAD CARD ── */
.gif-card{
  margin:16px 16px 0;
  background:rgba(27,36,82,0.45);
  border:1px solid rgba(159,143,224,0.25);
  border-radius:12px;
  padding:14px 16px;
}
.gif-card label{
  display:block;
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:14px;letter-spacing:.3px;
  color:var(--lilac);
  margin-bottom:8px;
}
.gif-input-style{
  background-color:rgba(232,235,255,0.06) !important;
  border:1px solid rgba(159,143,224,0.3) !important;
  color:var(--ink) !important;
  font-family:'Inter',sans-serif !important;
  font-size:13px !important;
}
.gif-input-style::file-selector-button{
  background:var(--lilac);
  color:#fff;border:none;border-radius:6px;
  padding:6px 12px;margin-right:10px;
  font-family:'Inter',sans-serif;font-weight:600;
  cursor:pointer;
}
.gif-input-style:focus{
  box-shadow:none !important;
  border-color:var(--lilac) !important;
}

/* ── CAPTION CARD ── */
.caption-card{
  margin:18px 16px 0;
  background:rgba(27,36,82,0.55);
  border-radius:12px;
  padding:16px 18px 12px 20px;
  box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(159,143,224,0.2);
  position:relative;
  border-left:4px solid var(--lilac);
  backdrop-filter:blur(2px);
}
.caption-card .cap-from{
  font-family:'Inter',sans-serif;font-weight:800;font-size:11px;
  letter-spacing:1px;color:var(--lilac);text-transform:uppercase;
  margin-bottom:4px;
}
.caption-card textarea{
  width:100%;
  background:transparent;border:none;outline:none;resize:none;
  color:var(--ink);font-family:'Caveat',cursive;
  font-weight:600;
  font-size:19px;line-height:28px;
  min-height:110px;
}
.caption-card textarea::placeholder{ color:rgba(232,235,255,0.35); font-family:'Inter',sans-serif; font-size:14px; font-weight:400;}
.ig-charcount{
  font-family:'Inter',sans-serif;
  font-size:10.5px;color:var(--ink-soft);
  text-align:right;padding:4px 20px 0;
}

/* ── TAPE / AUDIO UNIT ── */
.tape-unit{
  margin:12px 16px 0;
  background:linear-gradient(160deg,rgba(42,53,112,0.55),rgba(15,22,56,0.7));
  border:1px solid rgba(159,143,224,0.25);
  border-radius:14px;
  padding:16px;
  display:flex;align-items:center;gap:16px;
  backdrop-filter:blur(2px);
}
.tape-reels{display:flex;gap:10px;flex-shrink:0;}
.reel{
  width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--star-soft), var(--lilac) 55%, var(--night-indigo) 100%);
  border:2px solid rgba(207,214,240,0.3);
}
.tape-controls{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
.tape-play-row{display:flex;align-items:center;gap:12px;}
.tape-play-btn{
  width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--star-soft), var(--lilac));
  border:none;color:var(--night-deep);
  font-size:15px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:filter .15s, transform .1s;
}
.tape-play-btn:hover{filter:brightness(1.08);}
.tape-play-btn:active{transform:scale(.92);}
.tape-progress-wrap{flex:1;min-width:0;}
.tape-progress{
  width:100%;height:4px;border-radius:2px;
  background:rgba(207,214,240,0.18);
  cursor:pointer;position:relative;
}
.tape-progress-bar{
  height:100%;border-radius:2px;
  background:var(--moon-glow);
  width:0%;transition:width .1s linear;
  pointer-events:none;
  box-shadow:0 0 6px rgba(253,246,227,0.6);
}
.tape-times{
  display:flex;justify-content:space-between;
  font-family:'Inter',sans-serif;
  font-size:10px;color:var(--ink-soft);
  margin-top:4px;
}
.tape-remove{
  background:none;border:none;
  color:var(--ink-soft);font-size:16px;
  cursor:pointer;flex-shrink:0;
  transition:color .15s;
}
.tape-remove:hover{color:#ff8a8a;}
audio#hiddenOldAudio, audio#audioPreview{display:none;}

/* ── VOICE ROW (record / upload) ── */
.voice-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px 4px;flex-wrap:wrap;
}
.pill-btn{
  display:flex;align-items:center;gap:6px;
  background:rgba(232,235,255,0.05);
  border:1px solid rgba(159,143,224,0.4);
  border-radius:20px;padding:8px 16px;
  font-size:12.5px;font-weight:700;
  color:var(--ink);cursor:pointer;
  font-family:'Inter',sans-serif;
  transition:border-color .15s, background .15s;
}
.pill-btn:hover{ border-color:var(--star-soft); background:rgba(159,143,224,0.1); }
.pill-btn.recording{
  border-color:#e0503f;color:#ff8a75;
  animation:rpulse 1.5s ease infinite;
}
@keyframes rpulse{0%,100%{opacity:1}50%{opacity:.55}}
.pill-upload{
  display:flex;align-items:center;gap:6px;
  background:transparent;
  border:1px solid rgba(159,143,224,0.3);
  border-radius:20px;padding:8px 16px;
  font-size:12.5px;color:var(--ink-soft);
  cursor:pointer;transition:border-color .15s, color .15s;
}
.pill-upload:hover{ border-color:var(--star-soft); color:var(--ink); }
#recStatus{
  font-family:'Inter',sans-serif;
  font-size:11px;color:var(--ink-soft);
}
#recStatus.active{color:#ff8a75;}

/* ── ROWS (tag / location) ── */
.booth-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;cursor:pointer;font-size:13.5px;
  border-top:1px solid rgba(159,143,224,0.15);
  transition:background .1s;
}
.booth-row:hover{background:rgba(159,143,224,0.06);}
.booth-row-left{display:flex;align-items:center;gap:12px;color:var(--ink);}
.booth-row-left .bi{font-size:18px;color:var(--lilac);}
.booth-row-right{color:var(--ink-soft);font-size:18px;}

/* ── BOTTOM SAVE BAR ── */
.booth-bottom-bar{
  position:sticky;bottom:0;
  width:100%;
  background:linear-gradient(180deg, transparent, var(--night-deep) 35%);
  padding:14px 16px 18px;
  z-index:10;
  margin-top:auto;
}
.booth-save-btn{
  width:100%;
  background:linear-gradient(135deg, var(--lilac), var(--night-indigo));
  border:1px solid rgba(159,143,224,0.4);
  color:#fff;
  border-radius:12px;padding:14px;
  font-family:'Cormorant Garamond',serif;
  font-weight:700;font-style:italic;
  font-size:18px;letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(42,53,112,.4);
  transition:filter .15s, transform .1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.booth-save-btn:hover{filter:brightness(1.08);}
.booth-save-btn:active{transform:scale(.98);}
.booth-save-btn.saving{background:#3a3f5c;border-color:rgba(159,143,224,0.15);box-shadow:none;}
.booth-save-btn.done{background:linear-gradient(135deg,#7fd8c0,#2a6f8a);}

.booth-empty{
  margin:4px 16px 0;
  font-family:'Inter',sans-serif;
  font-size:11.5px;color:var(--ink-soft);
  text-align:center;padding:18px 10px;
  border:1px dashed rgba(159,143,224,0.3);
  border-radius:10px;
}
</style>
</head>
<body>

<div class="star-field" id="starField" aria-hidden="true"></div>

<div class="booth-shell">

  <!-- MARQUEE TOPBAR -->
  <div class="booth-marquee">
    <div class="bulbs">
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span>
    </div>
    <div class="booth-marquee-row">
      <button class="booth-back" type="button" onclick="history.back()"><i class="bi bi-x-lg"></i></button>
      <span class="booth-title">CHỈNH SỬA <span>QUÀ</span></span>
      <button class="booth-done" form="giftForm" type="submit">Undo</button>
    </div>
    <div class="booth-tagline">— sửa lại món quà nhỏ của bạn —</div>
  </div>

<form id="giftForm">
<input type="hidden" id="uid" th:value="${nfcUid}">

<!-- FILMSTRIP / PHOTO GRID -->
<div class="booth-label">Ảnh của bạn</div>
<div class="filmstrip">
  <div class="ig-photo-grid" id="previewContainer">
      <div class="ig-photo-item" th:each="img : ${gift.images}">
          <img th:src="@{'/files/images/' + ${img.imageUrl}}" alt="">
          <button type="button" class="del-btn old-image" th:data-url="${img.imageUrl}">
              <i class="bi bi-x"></i>
          </button>
      </div>
      <div class="ig-add-slot" id="addSlot" onclick="imageInput.click()">
          <i class="bi bi-plus-lg"></i>
          <span>Thêm ảnh</span>
      </div>
  </div>
  <div class="filmstrip-hint">chạm để thêm hoặc xoá khoảnh khắc</div>
</div>
<input type="file" id="imageInput" accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp,.gif,.bmp,.tiff,.avif" multiple hidden>

<!-- GIF UPLOAD -->
<div class="gif-card">
    <label for="gifInput">Tệp GIF</label>
    <input
        type="file"
        id="gifInput"
        accept=".gif,image/gif"
        class="form-control gif-input-style">
</div>

<!-- CAPTION -->
<div class="booth-label">Lời nhắn</div>
<div class="caption-card">
   
    <textarea id="message" placeholder="Viết một dòng chú thích…" maxlength="2200"
              th:text="${gift.message}" oninput="updateCount(this)"></textarea>
</div>
<div class="ig-charcount"><span id="cCount">0</span> / 2,200</div>

<!-- EXISTING AUDIO -->
<div id="oldAudioBox" th:if="${gift.voiceUrl != null && gift.voiceUrl != ''}">
    <div class="booth-label">Ghi âm hiện tại</div>
    <div class="tape-unit">
        <div class="tape-reels">
            <div class="reel"></div>
            <div class="reel"></div>
        </div>
        <div class="tape-controls">
            <div class="tape-play-row">
                <button type="button" class="tape-play-btn" id="oldPlayBtn" onclick="toggleOldAudio()">
                    <i class="bi bi-play-fill" id="oldPlayIco"></i>
                </button>
                <div class="tape-progress-wrap">
                    <div class="tape-progress" id="oldProgressBar" onclick="seekOld(event)">
                        <div class="tape-progress-bar" id="oldBar"></div>
                    </div>
                    <div class="tape-times">
                        <span id="oldCur">0:00</span>
                        <span id="oldDur">0:00</span>
                    </div>
                </div>
            </div>
        </div>
        <button type="button" class="tape-remove" onclick="doRemoveOldAudio()" aria-label="Remove">
            <i class="bi bi-trash"></i>
        </button>
    </div>
    <audio id="hiddenOldAudio"><source th:src="@{'/files/audio/' + ${gift.voiceUrl}}"></audio>
</div>

<!-- NEW VOICE -->
<div class="booth-label">Lời nhắn bằng giọng nói</div>
<div class="voice-row">
    <button type="button" class="pill-btn" id="recordBtn" onclick="toggleRecord()">
        <i class="bi bi-mic" id="recIco"></i>
        <span id="recLabel">Ghi âm</span>
    </button>
    <span id="recStatus"></span>
    <label class="pill-upload" for="audioInput">
        <i class="bi bi-upload"></i> Tải lên
    </label>
    <input type="file" id="audioInput" accept="audio/*" hidden>
</div>

<!-- NEW AUDIO PREVIEW -->
<div class="tape-unit" id="newAudioWrap" style="display:none;">
    <div class="tape-reels">
        <div class="reel"></div>
        <div class="reel"></div>
    </div>
    <div class="tape-controls">
        <div class="tape-play-row">
            <button type="button" class="tape-play-btn" id="newPlayBtn" onclick="toggleNewAudio()">
                <i class="bi bi-play-fill" id="newPlayIco"></i>
            </button>
            <div class="tape-progress-wrap">
                <div class="tape-progress" id="newProgressBar" onclick="seekNew(event)">
                    <div class="tape-progress-bar" id="newBar"></div>
                </div>
                <div class="tape-times">
                    <span id="newCur">0:00</span>
                    <span id="newDur">0:00</span>
                </div>
            </div>
        </div>
    </div>
</div>
<audio id="audioPreview"></audio>



</form>

<!-- BOTTOM SAVE -->
<div class="booth-bottom-bar">
    <button class="booth-save-btn" id="saveBtn" onclick="submitForm()">
        <i class="bi bi-check-lg" id="saveIco"></i>
        <span id="saveLbl">Lưu thay đổi</span>
    </button>
</div>

</div>

<script>
// star sprinkle
(function initStars(){
  const field = document.getElementById('starField');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const count = 40;
  for(let i=0;i<count;i++){
    const s = document.createElement('span');
    s.className = 'star-dot';
    const size = (Math.random()*2 + 1).toFixed(1);
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (Math.random()*100)+'vh';
    if(!reduce){
      s.style.animationDuration = (2 + Math.random()*3).toFixed(1)+'s';
      s.style.animationDelay = (Math.random()*4).toFixed(1)+'s';
    }
    field.appendChild(s);
  }
})();

const uid = document.getElementById("uid").value;
const previewContainer = document.getElementById("previewContainer");
const addSlot = document.getElementById("addSlot");

let newImages = [];
let deletedImages = [];
let newAudio = null;
let removeOldAudio = false;

/* ── CHAR COUNT ── */
function updateCount(el){
    document.getElementById("cCount").textContent = el.value.length;
}
const msgEl = document.getElementById("message");
if(msgEl) document.getElementById("cCount").textContent = msgEl.value.length;

/* ── DELETE OLD IMAGES ── */
document.querySelectorAll(".old-image").forEach(btn => {
    btn.onclick = () => {
        deletedImages.push(btn.dataset.url);
        btn.closest(".ig-photo-item").remove();
        updateAddSlot();
    };
});

/* ── ADD NEW IMAGES ── */
document.getElementById("imageInput").addEventListener("change", function(){
    Array.from(this.files).forEach(file => {
        newImages.push(file);
        const reader = new FileReader();
        reader.onload = e => {
            const div = document.createElement("div");
            div.className = "ig-photo-item";
            div.innerHTML = `<img src="${e.target.result}" alt=""><button type="button" class="del-btn"><i class="bi bi-x"></i></button>`;
            div.querySelector("button").onclick = () => {
                const i = newImages.indexOf(file);
                if(i > -1) newImages.splice(i,1);
                div.remove();
                updateAddSlot();
            };
            previewContainer.insertBefore(div, addSlot);
            updateAddSlot();
        };
        reader.readAsDataURL(file);
    });
    this.value = "";
});

function updateAddSlot(){
    const count = previewContainer.querySelectorAll(".ig-photo-item").length;
    addSlot.style.display = count >= 9 ? "none" : "flex";
}

/* ── OLD AUDIO PLAYER ── */
const oldAudio = document.getElementById("hiddenOldAudio");
function fmt(s){ const m=Math.floor(s/60); return m+":"+(Math.floor(s%60)+"").padStart(2,"0"); }
if(oldAudio){
    oldAudio.addEventListener("loadedmetadata", () => {
        document.getElementById("oldDur").textContent = fmt(oldAudio.duration);
    });
    oldAudio.addEventListener("timeupdate", () => {
        const p = oldAudio.duration ? oldAudio.currentTime/oldAudio.duration*100 : 0;
        document.getElementById("oldBar").style.width = p+"%";
        document.getElementById("oldCur").textContent = fmt(oldAudio.currentTime);
    });
    oldAudio.addEventListener("ended", () => {
        document.getElementById("oldPlayIco").className = "bi bi-play-fill";
    });
}
function toggleOldAudio(){
    if(!oldAudio) return;
    if(oldAudio.paused){ oldAudio.play(); document.getElementById("oldPlayIco").className="bi bi-pause-fill"; }
    else { oldAudio.pause(); document.getElementById("oldPlayIco").className="bi bi-play-fill"; }
}
function seekOld(e){
    if(!oldAudio||!oldAudio.duration) return;
    const r = document.getElementById("oldProgressBar").getBoundingClientRect();
    oldAudio.currentTime = ((e.clientX-r.left)/r.width)*oldAudio.duration;
}
function doRemoveOldAudio(){
    removeOldAudio = true;
    document.getElementById("oldAudioBox").style.display = "none";
}

/* ── NEW AUDIO PLAYER ── */
const newAudioEl = document.getElementById("audioPreview");
function showNewAudio(url){
    newAudioEl.src = url;
    document.getElementById("newAudioWrap").style.display = "flex";
    newAudioEl.addEventListener("loadedmetadata", () => {
        document.getElementById("newDur").textContent = fmt(newAudioEl.duration);
    }, {once:true});
    newAudioEl.addEventListener("timeupdate", () => {
        const p = newAudioEl.duration ? newAudioEl.currentTime/newAudioEl.duration*100 : 0;
        document.getElementById("newBar").style.width = p+"%";
        document.getElementById("newCur").textContent = fmt(newAudioEl.currentTime);
    });
    newAudioEl.addEventListener("ended", () => {
        document.getElementById("newPlayIco").className = "bi bi-play-fill";
    }, {once:true});
}
function toggleNewAudio(){
    if(newAudioEl.paused){ newAudioEl.play(); document.getElementById("newPlayIco").className="bi bi-pause-fill"; }
    else { newAudioEl.pause(); document.getElementById("newPlayIco").className="bi bi-play-fill"; }
}
function seekNew(e){
    if(!newAudioEl.duration) return;
    const r = document.getElementById("newProgressBar").getBoundingClientRect();
    newAudioEl.currentTime = ((e.clientX-r.left)/r.width)*newAudioEl.duration;
}

/* ── UPLOAD AUDIO ── */
document.getElementById("audioInput").addEventListener("change", function(){
    if(this.files.length){
        newAudio = this.files[0];
        showNewAudio(URL.createObjectURL(newAudio));
        removeOldAudio = true;
        const ob = document.getElementById("oldAudioBox");
        if(ob) ob.style.display = "none";
    }
});

/* ── RECORD AUDIO ── */
let recorder, chunks=[], stream=null;
async function toggleRecord(){
    const btn = document.getElementById("recordBtn");
    if(recorder && recorder.state==="recording"){
        recorder.stop(); return;
    }
    try {
        stream = await navigator.mediaDevices.getUserMedia({audio:true});
        chunks = [];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, {type: recorder.mimeType});
            newAudio = new File(
                [blob],
                recorder.mimeType.includes("mp4") ? "record.m4a" : "record.webm",
                {
                    type: recorder.mimeType
                }
            );
            showNewAudio(URL.createObjectURL(newAudio));
            stream.getTracks().forEach(t=>t.stop());
            btn.classList.remove("recording");
            document.getElementById("recIco").className = "bi bi-mic";
            document.getElementById("recLabel").textContent = "Ghi âm";
            document.getElementById("recStatus").textContent = "Xong";
            document.getElementById("recStatus").className = "";
            removeOldAudio = true;
            const ob = document.getElementById("oldAudioBox");
            if(ob) ob.style.display = "none";
        };
        recorder.start();
        btn.classList.add("recording");
        document.getElementById("recIco").className = "bi bi-stop-fill";
        document.getElementById("recLabel").textContent = "Dừng";
        document.getElementById("recStatus").textContent = "Đang ghi…";
        document.getElementById("recStatus").className = "active";
    } catch(e){
        alert("Không mở được microphone.");
    }
}
/* ── SUBMIT ── */
async function submitForm(){
    const btn = document.getElementById("saveBtn");
    btn.classList.add("saving");
    document.getElementById("saveLbl").textContent = "Đang lưu…";
    document.getElementById("saveIco").className = "bi bi-hourglass-split";
    btn.disabled = true;

    const fd = new FormData();
    fd.append("message", document.getElementById("message").value);
    newImages.forEach(i => fd.append("images", i));
    if(newAudio) fd.append("audio", newAudio);
    fd.append("removeOldAudio", removeOldAudio);
    deletedImages.forEach(i => fd.append("deleteImages", i));

    // Thêm file GIF được chọn từ input vào FormData
    const gif = document.getElementById("gifInput").files[0];
    if(gif){
        fd.append("gif", gif);
    }

    // UPDATE GIFT
    const uid = document.getElementById("uid").value;
    const apiUrl = window.location.origin + "/api/gift/update/" + uid;

    try {
        const res = await fetch(apiUrl, {
            method: "PUT",
            body: fd
        });
        const text = await res.text();
        if(res.ok){
            btn.classList.remove("saving");
            btn.classList.add("done");
            document.getElementById("saveLbl").textContent = "Đã lưu!";
            document.getElementById("saveIco").className = "bi bi-check-lg";
            setTimeout(() => { location.href = "/gift/view/" + uid; }, 700);
        } else {
            alert("Lỗi: " + text);
            btn.classList.remove("saving");
            btn.disabled = false;
            document.getElementById("saveLbl").textContent = "Lưu thay đổi";
            document.getElementById("saveIco").className = "bi bi-check-lg";
        }
    } catch(err){
        alert("Network error");
        btn.classList.remove("saving");
        btn.disabled = false;
        document.getElementById("saveLbl").textContent = "Lưu thay đổi";
        document.getElementById("saveIco").className = "bi bi-check-lg";
    }
}
</script>

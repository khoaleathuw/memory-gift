<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chỉnh sửa Instagram Memory</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{
  --ig-bg:#fafafa;--ig-card:#fff;--ig-line:#dbdbdb;--ig-text:#262626;
  --ig-soft:#737373;--ig-blue:#0095f6;--ig-red:#ed4956;--ig-light:#efefef;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,button,input,textarea,label{font-family:Arial,Helvetica,sans-serif!important}
body{min-height:100vh;background:var(--ig-bg);color:var(--ig-text)}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
body.locked{overflow:hidden;height:100vh}
.ig-app{width:min(100%,470px);margin:0 auto;min-height:100vh;background:#fff;border-left:1px solid var(--ig-line);border-right:1px solid var(--ig-line)}
.ig-topbar{height:60px;position:sticky;top:0;z-index:40;display:grid;grid-template-columns:44px 1fr 70px;align-items:center;padding:0 12px;border-bottom:1px solid var(--ig-line);background:rgba(255,255,255,.96);backdrop-filter:blur(14px)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:23px}
.icon-btn:active{background:#f2f2f2}
.ig-title{text-align:center;font-size:17px;font-weight:700}
.save-top{justify-self:end;color:var(--ig-blue);font-size:14px;font-weight:700}
.save-top:disabled{opacity:.5}
.profile-card{display:flex;align-items:center;gap:11px;padding:14px 14px 12px;border-bottom:1px solid var(--ig-line)}
.avatar-ring{width:44px;height:44px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.avatar-inner{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
.profile-name{font-size:13px;font-weight:700}.profile-sub{font-size:11px;color:var(--ig-soft);margin-top:3px}
.section{border-bottom:1px solid var(--ig-line);padding:15px 14px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.section-title{font-size:14px;font-weight:700}.section-note{font-size:11px;color:var(--ig-soft)}
.ig-photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.ig-photo-item{aspect-ratio:1;position:relative;background:var(--ig-light);overflow:hidden}
.ig-photo-item img{width:100%;height:100%;display:block;object-fit:cover}
.del-btn{position:absolute;right:5px;top:5px;width:25px;height:25px;border-radius:50%;background:rgba(0,0,0,.68);color:#fff;display:grid;place-items:center;font-size:14px}
.ig-add-slot{aspect-ratio:1;border:1px dashed #b8b8b8;background:#fafafa;color:var(--ig-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10px;font-weight:700}
.ig-add-slot i{font-size:26px}
.upload-hint{font-size:11px;color:var(--ig-soft);margin-top:9px;text-align:center}
.caption-wrap{display:flex;gap:11px;align-items:flex-start}
.mini-avatar{width:33px;height:33px;flex:0 0 33px;border-radius:50%;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);padding:2px}
.mini-avatar>div{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:14px}
.note-card{flex:1}
.note-card textarea{width:100%;min-height:130px;border:0;outline:0;resize:vertical;background:transparent;font-size:14px;line-height:1.5;color:var(--ig-text)}
.note-card textarea::placeholder{color:#a8a8a8}
.charcount{text-align:right;color:var(--ig-soft);font-size:11px;margin-top:4px}
.audio-card{border:1px solid var(--ig-line);border-radius:12px;padding:12px;display:flex;align-items:center;gap:11px}
.audio-cover{width:54px;height:54px;flex:0 0 54px;border-radius:8px;background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf);color:#fff;display:grid;place-items:center;font-size:23px}
.audio-main{flex:1;min-width:0}
.tape-play-row{display:flex;align-items:center;gap:9px}
.tape-play-btn{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:var(--ig-text);color:#fff;display:grid;place-items:center;font-size:18px}
.tape-progress-wrap{flex:1;min-width:0}.tape-progress{height:5px;background:#e5e5e5;border-radius:999px;overflow:hidden;cursor:pointer}.tape-progress-bar{height:100%;width:0;background:var(--ig-blue)}
.tape-times{display:flex;justify-content:space-between;margin-top:5px;font-size:9px;color:var(--ig-soft)}
.tape-remove{width:35px;height:35px;border-radius:50%;color:var(--ig-red);display:grid;place-items:center;font-size:17px}
#hiddenOldAudio,#audioPreview{display:none}
.voice-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill-btn,.pill-upload{border:1px solid var(--ig-line);border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;background:#fff}
.pill-btn.recording{color:var(--ig-red);border-color:var(--ig-red);animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.55}}
#recStatus{font-size:11px;color:var(--ig-soft)}#recStatus.active{color:var(--ig-red)}
#newAudioWrap{margin-top:12px}
.bottom-bar{position:sticky;bottom:0;z-index:30;padding:12px 14px;background:rgba(255,255,255,.96);border-top:1px solid var(--ig-line);backdrop-filter:blur(12px)}
.save-btn{width:100%;border-radius:8px;background:var(--ig-blue);color:#fff;padding:12px;font-size:14px;font-weight:700;display:flex;justify-content:center;align-items:center;gap:8px}
.save-btn:disabled{opacity:.55}.save-btn.saving{background:#7cc5f6}.save-btn.done{background:#2bb673}
.ig-curtain{position:fixed;inset:0;z-index:9999;display:flex;pointer-events:none}
.ig-curtain-panel{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 25% 22%,rgba(255,255,255,.35),transparent 24%),linear-gradient(160deg,#feda75 0%,#fa7e1e 24%,#d62976 52%,#962fbf 76%,#4f5bd5 100%);transition:transform 1.15s cubic-bezier(.76,0,.15,1)}
.ig-curtain-panel::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.28) 1px,transparent 1.5px);background-size:34px 34px;animation:sparkle 8s linear infinite}
body.opened .ig-curtain-left{transform:translateX(-101%)}body.opened .ig-curtain-right{transform:translateX(101%)}
.ig-curtain-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10000;color:#fff;font-size:clamp(34px,9vw,68px);font-weight:800;letter-spacing:-2px;text-shadow:0 8px 30px rgba(0,0,0,.25);transition:opacity .45s ease;white-space:nowrap}
body.opened .ig-curtain-logo{opacity:0}.ig-flash{position:fixed;inset:0;z-index:10001;background:#fff;opacity:0;pointer-events:none}body.opened .ig-flash{animation:flash .7s ease-out .95s forwards}
@keyframes flash{0%{opacity:0}12%{opacity:.72}100%{opacity:0}}@keyframes sparkle{to{background-position:68px 68px}}
@media(max-width:500px){.ig-app{border:0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="locked">
<div id="matchaField" hidden aria-hidden="true"></div>
<div class="ig-curtain" aria-hidden="true"><div class="ig-curtain-panel ig-curtain-left"></div><div class="ig-curtain-logo">Instagram</div><div class="ig-curtain-panel ig-curtain-right"></div></div>
<div class="ig-flash" aria-hidden="true"></div>
<div class="ig-app">
<form id="giftForm">
<input type="hidden" id="uid" th:value="${nfcUid}">
<input type="hidden" id="theme" th:value="${gift.theme}">
<header class="ig-topbar">
<button type="button" class="icon-btn" onclick="history.back()" aria-label="Đóng"><i class="bi bi-x-lg"></i></button>
<div class="ig-title">Chỉnh sửa bài viết</div>
<button type="button" id="topSaveBtn" class="save-top">Xong</button>
</header>
<div class="profile-card">
<div class="avatar-ring"><div class="avatar-inner"><i class="bi bi-person-fill"></i></div></div>
<div><div class="profile-name">instagram_memory</div><div class="profile-sub">Đang chỉnh sửa kỷ niệm</div></div>
</div>
<section class="section">
<div class="section-head"><div class="section-title">Ảnh bài đăng</div><div class="section-note">Tối đa 9 ảnh</div></div>
<div class="ig-photo-grid" id="previewContainer">
<div class="ig-photo-item" th:each="img : ${gift.images}">
<img th:src="@{'/files/images/' + ${img.imageUrl}}" alt="Ảnh Gift">
<button type="button" class="del-btn old-image" th:data-url="${img.imageUrl}" aria-label="Xóa ảnh"><i class="bi bi-x"></i></button>
</div>
<div class="ig-add-slot" id="addSlot" role="button" tabindex="0"><i class="bi bi-plus-square"></i><span>THÊM ẢNH</span></div>
</div>
<div class="upload-hint">Nhấn dấu × để xóa ảnh không muốn giữ</div>
<input type="file" id="imageInput" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif" multiple hidden>
</section>
<section class="section">
<div class="section-head"><div class="section-title">Chú thích</div><div class="section-note">Instagram Memory</div></div>
<div class="caption-wrap"><div class="mini-avatar"><div><i class="bi bi-person-fill"></i></div></div><div class="note-card"><textarea id="message" placeholder="Viết chú thích..." maxlength="2200" th:text="${gift.message}"></textarea><div class="charcount"><span id="cCount">0</span> / 2.200</div></div></div>
</section>
<section class="section" id="oldAudioBox" th:if="${gift.voiceUrl != null and gift.voiceUrl != ''}">
<div class="section-head"><div class="section-title">Âm thanh hiện tại</div><div class="section-note">Nhấn để nghe</div></div>
<div class="audio-card"><div class="audio-cover"><i class="bi bi-music-note-beamed"></i></div><div class="audio-main"><div class="tape-play-row"><button type="button" class="tape-play-btn" id="oldPlayBtn"><i class="bi bi-play-fill" id="oldPlayIco"></i></button><div class="tape-progress-wrap"><div class="tape-progress" id="oldProgressBar"><div class="tape-progress-bar" id="oldBar"></div></div><div class="tape-times"><span id="oldCur">0:00</span><span id="oldDur">0:00</span></div></div></div></div><button type="button" class="tape-remove" id="removeOldAudioBtn"><i class="bi bi-trash"></i></button><div hidden><div id="oldReelL"></div><div id="oldReelR"></div></div></div>
<audio id="hiddenOldAudio" preload="metadata"><source th:src="@{'/files/audio/' + ${gift.voiceUrl}}"></audio>
</section>
<section class="section">
<div class="section-head"><div class="section-title">Thêm âm thanh mới</div><div class="section-note">Ghi âm hoặc tải lên</div></div>
<div class="voice-row"><button type="button" class="pill-btn" id="recordBtn"><i class="bi bi-mic" id="recIco"></i><span id="recLabel">Ghi âm</span></button><label class="pill-upload" for="audioInput"><i class="bi bi-upload"></i>Tải file</label><span id="recStatus"></span><input type="file" id="audioInput" accept="audio/*" hidden></div>
<div class="audio-card" id="newAudioWrap" style="display:none;"><div class="audio-cover"><i class="bi bi-mic-fill"></i></div><div class="audio-main"><div class="tape-play-row"><button type="button" class="tape-play-btn" id="newPlayBtn"><i class="bi bi-play-fill" id="newPlayIco"></i></button><div class="tape-progress-wrap"><div class="tape-progress" id="newProgressBar"><div class="tape-progress-bar" id="newBar"></div></div><div class="tape-times"><span id="newCur">0:00</span><span id="newDur">0:00</span></div></div></div></div><button type="button" class="tape-remove" id="removeNewAudioBtn"><i class="bi bi-trash"></i></button><div hidden><div id="newReelL"></div><div id="newReelR"></div></div></div>
<audio id="audioPreview" preload="metadata"></audio>
</section>
<div class="bottom-bar"><button class="save-btn" type="submit" id="saveBtn"><i class="bi bi-check-lg" id="saveIco"></i><span id="saveLbl">Lưu thay đổi</span></button></div>
</form>
</div>
<script>


    /* =========================================
       STATE
    ========================================= */

    let newImages = [];

    let deletedImages = [];

    let newAudio = null;

    let removeOldAudio = false;

    let isSaving = false;

    let recorder = null;

    let recordedChunks = [];

    let microphoneStream = null;

    let newAudioObjectUrl = null;


    /* =========================================
       ELEMENTS
    ========================================= */

    const giftForm =
        document.getElementById("giftForm");

    const uidInput =
        document.getElementById("uid");

    const themeInput =
        document.getElementById("theme");

    const previewContainer =
        document.getElementById("previewContainer");

    const addSlot =
        document.getElementById("addSlot");

    const imageInput =
        document.getElementById("imageInput");

    const messageInput =
        document.getElementById("message");

    const countElement =
        document.getElementById("cCount");

    const oldAudio =
        document.getElementById("hiddenOldAudio");

    const oldAudioBox =
        document.getElementById("oldAudioBox");

    const newAudioElement =
        document.getElementById("audioPreview");

    const newAudioWrap =
        document.getElementById("newAudioWrap");

    const audioInput =
        document.getElementById("audioInput");

    const recordBtn =
        document.getElementById("recordBtn");

    const recordLabel =
        document.getElementById("recLabel");

    const recordIcon =
        document.getElementById("recIco");

    const recordStatus =
        document.getElementById("recStatus");

    const saveBtn =
        document.getElementById("saveBtn");

    const topSaveBtn =
        document.getElementById("topSaveBtn");

    const saveLabel =
        document.getElementById("saveLbl");

    const saveIcon =
        document.getElementById("saveIco");


    /* =========================================
       MATCHA LEAVES
    ========================================= */

    (function createMatchaLeaves() {

        const field =
            document.getElementById("matchaField");


        const reducedMotion =
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;


        const totalPetals =
            reducedMotion ? 12 : 32;


        for (
            let index = 0;
            index < totalPetals;
            index++
        ) {

            const petal =
                document.createElement("span");


            petal.className =
                "matcha-particle";


            petal.textContent =
                Math.random() > 0.35
                    ? "🍃"
                    : "·";


            petal.style.left =
                Math.random() * 100 + "vw";


            petal.style.fontSize =
                8 + Math.random() * 11 + "px";


            petal.style.setProperty(
                "--drift",
                -80 + Math.random() * 160 + "px"
            );


            petal.style.animationDuration =
                7 + Math.random() * 9 + "s";


            petal.style.animationDelay =
                Math.random() * 10 + "s";


            field.appendChild(petal);
        }

    })();


    /* =========================================
       UID
    ========================================= */

    function getUid() {

        const modelUid =
            uidInput?.value?.trim();


        if (modelUid) {

            return modelUid;
        }


        return new URLSearchParams(
            window.location.search
        )
            .get("uid")
            ?.trim() || "";
    }


    const uid =
        getUid();


    if (!uid) {

        alert(
            "Không tìm thấy UID NFC."
        );

        saveBtn.disabled =
            true;

        topSaveBtn.disabled =
            true;
    }


    /* =========================================
       MESSAGE COUNT
    ========================================= */

    function updateMessageCount() {

        countElement.textContent =
            messageInput.value.length;
    }


    messageInput.addEventListener(
        "input",
        updateMessageCount
    );


    updateMessageCount();


    /* =========================================
       OLD IMAGES
    ========================================= */

    document
        .querySelectorAll(".old-image")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const imageUrl =
                        button.dataset.url;


                    if (
                        imageUrl &&
                        !deletedImages.includes(
                            imageUrl
                        )
                    ) {

                        deletedImages.push(
                            imageUrl
                        );
                    }


                    button
                        .closest(".ig-photo-item")
                        ?.remove();


                    updateAddSlot();
                }
            );

        });


    /* =========================================
       NEW IMAGES
    ========================================= */

    addSlot.addEventListener(
        "click",
        () => {

            imageInput.click();
        }
    );


    addSlot.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                imageInput.click();
            }

        }
    );


    imageInput.addEventListener(
        "change",
        function () {

            const currentCount =
                previewContainer
                    .querySelectorAll(
                        ".ig-photo-item"
                    )
                    .length;


            const remainingSlots =
                9 - currentCount;


            const files =
                Array.from(this.files);


            if (
                files.length >
                remainingSlots
            ) {

                alert(
                    "Bạn chỉ được giữ tối đa 9 ảnh."
                );
            }


            files
                .slice(0, remainingSlots)
                .forEach(addNewImage);


            this.value = "";
        }
    );


    function addNewImage(file) {

        if (
            !file.type.startsWith("image/")
        ) {

            return;
        }


        newImages.push(file);


        const reader =
            new FileReader();


        reader.addEventListener(
            "load",
            event => {

                const wrapper =
                    document.createElement("div");


                wrapper.className =
                    "ig-photo-item";


                const image =
                    document.createElement("img");


                image.src =
                    event.target.result;


                image.alt =
                    "Ảnh mới";


                const removeButton =
                    document.createElement("button");


                removeButton.type =
                    "button";


                removeButton.className =
                    "del-btn";


                removeButton.innerHTML =
                    '<i class="bi bi-x"></i>';


                removeButton.addEventListener(
                    "click",
                    () => {

                        const index =
                            newImages
                                .indexOf(file);


                        if (
                            index !== -1
                        ) {

                            newImages.splice(
                                index,
                                1
                            );
                        }


                        wrapper.remove();

                        updateAddSlot();
                    }
                );


                wrapper.appendChild(image);

                wrapper.appendChild(
                    removeButton
                );


                previewContainer.insertBefore(
                    wrapper,
                    addSlot
                );


                updateAddSlot();
            }
        );


        reader.addEventListener(
            "error",
            () => {

                const index =
                    newImages
                        .indexOf(file);


                if (
                    index !== -1
                ) {

                    newImages.splice(
                        index,
                        1
                    );
                }


                alert(
                    "Không thể đọc ảnh: " +
                    file.name
                );
            }
        );


        reader.readAsDataURL(file);
    }


    function updateAddSlot() {

        const count =
            previewContainer
                .querySelectorAll(
                    ".ig-photo-item"
                )
                .length;


        addSlot.style.display =
            count >= 9
                ? "none"
                : "flex";
    }


    updateAddSlot();


    /* =========================================
       TIME FORMAT
    ========================================= */

    function formatTime(seconds) {

        if (
            !Number.isFinite(seconds)
        ) {

            return "0:00";
        }


        const minutes =
            Math.floor(seconds / 60);


        const remainingSeconds =
            Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");


        return (
            minutes +
            ":" +
            remainingSeconds
        );
    }


    /* =========================================
       OLD AUDIO PLAYER
    ========================================= */

    if (oldAudio) {

        oldAudio.addEventListener(
            "loadedmetadata",
            () => {

                document
                    .getElementById("oldDur")
                    .textContent =
                    formatTime(
                        oldAudio.duration
                    );
            }
        );


        oldAudio.addEventListener(
            "timeupdate",
            () => {

                const percentage =
                    oldAudio.duration
                        ? (
                            oldAudio.currentTime /
                            oldAudio.duration
                        ) * 100
                        : 0;


                document
                    .getElementById("oldBar")
                    .style
                    .width =
                    percentage + "%";


                document
                    .getElementById("oldCur")
                    .textContent =
                    formatTime(
                        oldAudio.currentTime
                    );
            }
        );


        oldAudio.addEventListener(
            "play",
            () => {

                document
                    .getElementById("oldPlayIco")
                    .className =
                    "bi bi-pause-fill";


                document
                    .getElementById("oldReelL")
                    ?.classList
                    .add("spin");


                document
                    .getElementById("oldReelR")
                    ?.classList
                    .add("spin");
            }
        );


        oldAudio.addEventListener(
            "pause",
            resetOldAudioVisual
        );


        oldAudio.addEventListener(
            "ended",
            resetOldAudioVisual
        );


        document
            .getElementById("oldPlayBtn")
            ?.addEventListener(
                "click",
                async () => {

                    if (
                        oldAudio.paused
                    ) {

                        pauseNewAudio();

                        try {

                            await oldAudio.play();

                        } catch (error) {

                            console.error(error);
                        }

                    } else {

                        oldAudio.pause();
                    }

                }
            );


        document
            .getElementById("oldProgressBar")
            ?.addEventListener(
                "click",
                event => {

                    if (
                        !oldAudio.duration
                    ) {

                        return;
                    }


                    const rect =
                        event.currentTarget
                            .getBoundingClientRect();


                    const ratio =
                        Math.min(
                            1,
                            Math.max(
                                0,
                                (
                                    event.clientX -
                                    rect.left
                                ) /
                                rect.width
                            )
                        );


                    oldAudio.currentTime =
                        ratio *
                        oldAudio.duration;
                }
            );


        document
            .getElementById("removeOldAudioBtn")
            ?.addEventListener(
                "click",
                () => {

                    removeOldAudio =
                        true;


                    oldAudio.pause();


                    oldAudioBox.style.display =
                        "none";
                }
            );
    }


    function resetOldAudioVisual() {

        document
            .getElementById("oldPlayIco")
            ?.setAttribute(
                "class",
                "bi bi-play-fill"
            );


        document
            .getElementById("oldReelL")
            ?.classList
            .remove("spin");


        document
            .getElementById("oldReelR")
            ?.classList
            .remove("spin");
    }


    /* =========================================
       NEW AUDIO PLAYER
    ========================================= */

    function revokeNewAudioUrl() {

        if (
            newAudioObjectUrl
        ) {

            URL.revokeObjectURL(
                newAudioObjectUrl
            );


            newAudioObjectUrl =
                null;
        }
    }


    function showNewAudio(file) {

        revokeNewAudioUrl();


        newAudioObjectUrl =
            URL.createObjectURL(file);


        newAudioElement.src =
            newAudioObjectUrl;


        newAudioWrap.style.display =
            "flex";


        newAudioElement.load();
    }


    newAudioElement.addEventListener(
        "loadedmetadata",
        () => {

            document
                .getElementById("newDur")
                .textContent =
                formatTime(
                    newAudioElement.duration
                );
        }
    );


    newAudioElement.addEventListener(
        "timeupdate",
        () => {

            const percentage =
                newAudioElement.duration
                    ? (
                        newAudioElement.currentTime /
                        newAudioElement.duration
                    ) * 100
                    : 0;


            document
                .getElementById("newBar")
                .style
                .width =
                percentage + "%";


            document
                .getElementById("newCur")
                .textContent =
                formatTime(
                    newAudioElement.currentTime
                );
        }
    );


    newAudioElement.addEventListener(
        "play",
        () => {

            document
                .getElementById("newPlayIco")
                .className =
                "bi bi-pause-fill";


            document
                .getElementById("newReelL")
                .classList
                .add("spin");


            document
                .getElementById("newReelR")
                .classList
                .add("spin");
        }
    );


    newAudioElement.addEventListener(
        "pause",
        resetNewAudioVisual
    );


    newAudioElement.addEventListener(
        "ended",
        resetNewAudioVisual
    );


    document
        .getElementById("newPlayBtn")
        .addEventListener(
            "click",
            async () => {

                if (
                    newAudioElement.paused
                ) {

                    if (oldAudio) {

                        oldAudio.pause();
                    }


                    try {

                        await newAudioElement.play();

                    } catch (error) {

                        console.error(error);
                    }

                } else {

                    newAudioElement.pause();
                }

            }
        );


    document
        .getElementById("newProgressBar")
        .addEventListener(
            "click",
            event => {

                if (
                    !newAudioElement.duration
                ) {

                    return;
                }


                const rect =
                    event.currentTarget
                        .getBoundingClientRect();


                const ratio =
                    Math.min(
                        1,
                        Math.max(
                            0,
                            (
                                event.clientX -
                                rect.left
                            ) /
                            rect.width
                        )
                    );


                newAudioElement.currentTime =
                    ratio *
                    newAudioElement.duration;
            }
        );


    document
        .getElementById("removeNewAudioBtn")
        .addEventListener(
            "click",
            () => {

                pauseNewAudio();


                newAudio =
                    null;


                audioInput.value =
                    "";


                newAudioElement.removeAttribute(
                    "src"
                );


                newAudioElement.load();


                revokeNewAudioUrl();


                newAudioWrap.style.display =
                    "none";


                /*
                 * Không tự khôi phục audio cũ.
                 * Nếu trước đó đã chọn thay audio,
                 * removeOldAudio vẫn giữ true.
                 */
            }
        );


    function pauseNewAudio() {

        if (
            !newAudioElement.paused
        ) {

            newAudioElement.pause();
        }


        resetNewAudioVisual();
    }


    function resetNewAudioVisual() {

        document
            .getElementById("newPlayIco")
            .className =
            "bi bi-play-fill";


        document
            .getElementById("newReelL")
            .classList
            .remove("spin");


        document
            .getElementById("newReelR")
            .classList
            .remove("spin");
    }


    /* =========================================
       AUDIO UPLOAD
    ========================================= */

    audioInput.addEventListener(
        "change",
        function () {

            if (
                !this.files.length
            ) {

                return;
            }


            if (
                recorder &&
                recorder.state ===
                "recording"
            ) {

                recorder.stop();
            }


            stopMicrophone();


            newAudio =
                this.files[0];


            showNewAudio(
                newAudio
            );


            removeOldAudio =
                true;


            if (
                oldAudioBox
            ) {

                oldAudio?.pause();

                oldAudioBox.style.display =
                    "none";
            }


            setRecordIdle(
                "Đã chọn file"
            );
        }
    );


    /* =========================================
       RECORD AUDIO
    ========================================= */

    recordBtn.addEventListener(
        "click",
        async () => {

            if (
                !navigator.mediaDevices
                ?.getUserMedia
            ) {

                alert(
                    "Thiết bị không hỗ trợ microphone."
                );

                return;
            }


            if (
                recorder &&
                recorder.state ===
                "recording"
            ) {

                recorder.stop();

                return;
            }


            try {

                microphoneStream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            audio: true
                        });


                recordedChunks =
                    [];


                const mimeType =
                    getSupportedAudioType();


                recorder =
                    mimeType
                        ? new MediaRecorder(
                            microphoneStream,
                            {
                                mimeType
                            }
                        )
                        : new MediaRecorder(
                            microphoneStream
                        );


                recorder.addEventListener(
                    "dataavailable",
                    event => {

                        if (
                            event.data &&
                            event.data.size > 0
                        ) {

                            recordedChunks.push(
                                event.data
                            );
                        }

                    }
                );


                recorder.addEventListener(
                    "stop",
                    () => {

                        const realType =
                            recorder.mimeType ||
                            mimeType ||
                            "audio/webm";


                        const blob =
                            new Blob(
                                recordedChunks,
                                {
                                    type:
                                        realType
                                }
                            );


                        const extension =
                            realType.includes("mp4")
                                ? "m4a"
                                : realType.includes("ogg")
                                    ? "ogg"
                                    : "webm";


                        newAudio =
                            new File(
                                [blob],
                                "record." +
                                extension,
                                {
                                    type:
                                        realType
                                }
                            );


                        showNewAudio(
                            newAudio
                        );


                        removeOldAudio =
                            true;


                        if (
                            oldAudioBox
                        ) {

                            oldAudio?.pause();

                            oldAudioBox.style.display =
                                "none";
                        }


                        stopMicrophone();


                        setRecordIdle(
                            "Đã ghi xong"
                        );
                    }
                );


                recorder.start();


                recordBtn.classList.add(
                    "recording"
                );


                recordIcon.className =
                    "bi bi-stop-fill";


                recordLabel.textContent =
                    "Dừng";


                recordStatus.textContent =
                    "Đang ghi…";


                recordStatus.className =
                    "active";


                document
                    .getElementById("newReelL")
                    .classList
                    .add("spin");


                document
                    .getElementById("newReelR")
                    .classList
                    .add("spin");

            } catch (error) {

                stopMicrophone();


                console.error(error);


                alert(
                    "Không mở được microphone. Hãy cấp quyền micro cho trình duyệt."
                );
            }

        }
    );


    function getSupportedAudioType() {

        const mimeTypes = [
            "audio/mp4",
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/ogg;codecs=opus"
        ];


        for (
            const mimeType of mimeTypes
        ) {

            if (
                MediaRecorder.isTypeSupported(
                    mimeType
                )
            ) {

                return mimeType;
            }
        }


        return "";
    }


    function stopMicrophone() {

        if (
            microphoneStream
        ) {

            microphoneStream
                .getTracks()
                .forEach(track => {

                    track.stop();
                });


            microphoneStream =
                null;
        }


        document
            .getElementById("newReelL")
            .classList
            .remove("spin");


        document
            .getElementById("newReelR")
            .classList
            .remove("spin");
    }


    function setRecordIdle(text) {

        recordBtn.classList.remove(
            "recording"
        );


        recordIcon.className =
            "bi bi-mic";


        recordLabel.textContent =
            "Ghi âm";


        recordStatus.textContent =
            text || "";


        recordStatus.className =
            "";
    }


    /* =========================================
       SUBMIT
    ========================================= */

    topSaveBtn.addEventListener(
        "click",
        () => {

            giftForm.requestSubmit();
        }
    );


    giftForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            if (
                isSaving ||
                !uid
            ) {

                return;
            }


            if (
                recorder &&
                recorder.state ===
                "recording"
            ) {

                alert(
                    "Hãy dừng ghi âm trước khi lưu."
                );

                return;
            }


            isSaving =
                true;


            setSavingState();


            const formData =
                new FormData();


            formData.append(
                "message",
                messageInput.value
            );


            const theme =
                themeInput?.value?.trim()
                || "matcha";


            formData.append(
                "theme",
                theme
            );


            newImages.forEach(
                image => {

                    formData.append(
                        "images",
                        image
                    );
                }
            );


            if (
                newAudio
            ) {

                formData.append(
                    "audio",
                    newAudio
                );
            }


            formData.append(
                "removeOldAudio",
                String(removeOldAudio)
            );


            deletedImages.forEach(
                imageUrl => {

                    formData.append(
                        "deleteImages",
                        imageUrl
                    );
                }
            );


            const apiUrl =
                    "/api/gift/update/" +
                    encodeURIComponent(uid);


            try {

                const response =
                    await fetch(
                        apiUrl,
                        {
                            method:
                                "POST",

                            body:
                                formData
                        }
                    );


                const responseText =
                    await response.text();


                if (
                    !response.ok
                ) {

                    throw new Error(
                        responseText ||
                        "Không thể cập nhật Gift."
                    );
                }


                setSuccessState();


                setTimeout(
                    () => {

                        window.location.href =
                                "/gift/view/" +
                                encodeURIComponent(uid);

                    },
                    700
                );

            } catch (error) {

                console.error(error);


                alert(
                    "Lỗi: " +
                    error.message
                );


                resetSavingState();
            }

        }
    );


    function setSavingState() {

        saveBtn.disabled =
            true;


        topSaveBtn.disabled =
            true;


        saveBtn.classList.add(
            "saving"
        );


        saveLabel.textContent =
            "Đang lưu…";


        saveIcon.className =
            "bi bi-hourglass-split";
    }


    function setSuccessState() {

        saveBtn.classList.remove(
            "saving"
        );


        saveBtn.classList.add(
            "done"
        );


        saveLabel.textContent =
            "Đã lưu!";


        saveIcon.className =
            "bi bi-check-lg";
    }


    function resetSavingState() {

        isSaving =
            false;


        saveBtn.disabled =
            false;


        topSaveBtn.disabled =
            false;


        saveBtn.classList.remove(
            "saving",
            "done"
        );


        saveLabel.textContent =
            "Lưu thay đổi";


        saveIcon.className =
            "bi bi-check-lg";
    }


    window.addEventListener(
        "beforeunload",
        () => {

            stopMicrophone();

            revokeNewAudioUrl();
        }
    );


</script>
<script>
(function(){const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;const openPage=()=>{document.body.classList.add('opened');document.body.classList.remove('locked')};if(reduce){openPage();return}window.addEventListener('load',()=>setTimeout(openPage,350));})();
</script>
</body>

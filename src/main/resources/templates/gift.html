<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Booth</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/index.css}">

<style>
:root{
  --booth-black:#120a0b;
  --curtain-red:#6e1423;
  --curtain-red-dark:#43101a;
  --film-cream:#f2e7d2;
  --film-cream-dim:#e6d8bb;
  --bulb-amber:#f0a944;
  --bulb-amber-soft:#ffcf8a;
  --ink:#2a1f1a;
  --ink-soft:#5b4c40;
  --flash-white:#fffdf7;

  /* Font hệ thống chuẩn, không phụ thuộc Google Fonts
     nên không bị lỗi không load được font / chữ vỡ dòng */
  --font-display: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --font-hand: "Times New Roman", Times, serif;
  --font-body: Arial, "Helvetica Neue", Helvetica, sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;}

html,body{height:100%;}

body{
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(240,169,68,0.16), transparent 60%),
    radial-gradient(ellipse 90% 50% at 50% 110%, rgba(110,20,35,0.25), transparent 60%),
    var(--booth-black);
  min-height:100vh;
  font-family:var(--font-body);
  color:var(--film-cream);
  overflow-x:hidden;
}

body.locked{overflow:hidden;height:100vh;}

/* ============ CURTAIN INTRO ============ */
.curtain-stage{position:fixed;inset:0;z-index:9999;display:flex;pointer-events:none;}
.curtain-panel{
  flex:1;
  background:
    repeating-linear-gradient(90deg,
      var(--curtain-red) 0px, var(--curtain-red) 16px,
      var(--curtain-red-dark) 16px, var(--curtain-red-dark) 32px);
  box-shadow:inset 0 0 120px rgba(0,0,0,0.65);
  transition:transform 1.15s cubic-bezier(.76,0,.15,1);
  position:relative;
}
.curtain-panel::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.35), transparent 12%, transparent 88%, rgba(0,0,0,.45));
}
.curtain-left{transform-origin:left center;}
.curtain-right{transform-origin:right center;}
body.opened .curtain-left{transform:translateX(-101%);}
body.opened .curtain-right{transform:translateX(101%);}

.curtain-mark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--font-display);
  font-weight:700;
  font-size:15vw;
  letter-spacing:6px;
  color:rgba(242,231,210,0.9);
  text-shadow:0 0 40px rgba(240,169,68,0.5);
  white-space:nowrap;
  z-index:2;
  opacity:1;
  transition:opacity .5s ease .05s;
}
body.opened .curtain-mark{opacity:0;}

.flash-overlay{
  position:fixed;inset:0;z-index:10000;
  background:var(--flash-white);
  opacity:0;pointer-events:none;
}
body.opened .flash-overlay{animation:flashPulse .7s ease-out .95s forwards;}
@keyframes flashPulse{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){
  .curtain-panel,.curtain-mark{transition:none !important;}
  body.opened .flash-overlay{animation:none !important;}
}

/* ============ SHELL ============ */
.booth-shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  border-left:1px solid rgba(240,169,68,0.12);
  border-right:1px solid rgba(240,169,68,0.12);
  opacity:0;
  transform:translateY(10px);
  transition:opacity .7s ease .95s, transform .7s ease .95s;
}
body.opened .booth-shell{opacity:1;transform:translateY(0);}

/* ============ MARQUEE TOPBAR ============ */
.booth-marquee{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg, #1c1011, #150c0d 90%);
  border-bottom:1px solid rgba(240,169,68,0.25);
  padding:14px 16px 10px;
  text-align:center;
}
.booth-marquee .bulbs{
  display:flex;justify-content:center;gap:7px;margin-bottom:6px;
}
.booth-marquee .bulb{
  width:5px;height:5px;border-radius:50%;
  background:var(--bulb-amber-soft);
  box-shadow:0 0 6px 1px var(--bulb-amber);
  animation:bulbFlicker 2.4s ease-in-out infinite;
}
.booth-marquee .bulb:nth-child(odd){animation-delay:.3s;}
.booth-marquee .bulb:nth-child(3n){animation-delay:.6s;}
@keyframes bulbFlicker{0%,100%{opacity:1}50%{opacity:.35}}

.booth-marquee-row{display:flex;align-items:center;justify-content:space-between;}
.booth-back{background:none;border:none;color:var(--film-cream);font-size:20px;cursor:pointer;opacity:.85;}
.booth-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:22px;letter-spacing:3px;
  color:var(--film-cream);
}
.booth-title span{color:var(--bulb-amber);}
.booth-share-top{
  background:none;border:none;font-family:var(--font-body);
  font-weight:700;font-size:13px;color:var(--bulb-amber);cursor:pointer;
  letter-spacing:.3px;
}
.booth-share-top:hover{color:var(--bulb-amber-soft);}

.booth-tagline{
  font-family:var(--font-hand);
  font-style:italic;
  font-size:12.5px;color:rgba(242,231,210,0.55);
  margin-top:4px;letter-spacing:.2px;
}

/* ============ SECTION LABEL ============ */
.booth-label{
  font-family:var(--font-display);
  font-weight:700;
  font-size:13px;letter-spacing:2.5px;
  color:var(--bulb-amber);
  padding:20px 18px 8px;
}

/* ============ FILMSTRIP GRID ============ */
.filmstrip{
  margin:0 12px;
  padding:14px 22px;
  background:#0d0708;
  border-radius:4px;
  position:relative;
}
.filmstrip::before,.filmstrip::after{
  content:'';
  position:absolute;top:0;bottom:0;width:16px;
  background-image:radial-gradient(circle, #000 3px, transparent 3.4px);
  background-size:16px 22px;
  background-position:center;
  background-repeat:repeat-y;
  opacity:.9;
}
.filmstrip::before{left:0;background-color:#1a1010;}
.filmstrip::after{right:0;background-color:#1a1010;}

#previewContainer{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

#addBox{
  aspect-ratio:1;
  background:rgba(242,231,210,0.04);
  border:1.5px dashed rgba(240,169,68,0.4);
  border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;cursor:pointer;color:var(--bulb-amber);
  font-family:var(--font-display);
  font-weight:700;
  font-size:11px;letter-spacing:1px;
  transition:background .15s,border-color .15s;
}
#addBox:hover{background:rgba(240,169,68,0.08);border-color:var(--bulb-amber);}
#addBox .bi{font-size:24px;}
#previewContainer > .col-4{all:unset;display:contents;}

.img-item-wrap{
  aspect-ratio:1;
  position:relative;
  background:var(--film-cream);
  padding:6px 6px 14px;
  border-radius:2px;
  box-shadow:0 3px 8px rgba(0,0,0,.5);
}
.img-item-wrap img{
  width:100%;height:100%;object-fit:cover;display:block;
  filter:sepia(.12) contrast(1.04);
}
.img-item-wrap .btn-remove{
  position:absolute;top:-6px;right:-6px;
  width:22px;height:22px;border-radius:50%;
  background:var(--curtain-red);border:2px solid var(--booth-black);
  color:#fff;font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  opacity:0;transition:opacity .15s;
}
.img-item-wrap:hover .btn-remove{opacity:1;}
.img-item-wrap.rot1{transform:rotate(-3deg);}
.img-item-wrap.rot2{transform:rotate(2deg);}
.img-item-wrap.rot3{transform:rotate(-1.5deg);}
.img-item-wrap.rot4{transform:rotate(3deg);}
.img-item-wrap.rot5{transform:rotate(0deg);}

.filmstrip-hint{
  font-family:var(--font-hand);
  font-style:italic;
  font-size:12px;color:rgba(242,231,210,0.4);
  text-align:center;padding:10px 18px 4px;
}

/* ============ CAPTION CARD ============ */
/* Background kẻ dòng + line-height của textarea đồng bộ 28px,
   thêm word-wrap để chữ luôn tự xuống dòng đúng khung, không tràn. */
.caption-card{
  margin:18px 16px 0;
  background:var(--film-cream);
  border-radius:3px;
  padding:16px 16px 10px 22px;
  box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.05);
  position:relative;
  background-image:repeating-linear-gradient(
    180deg, transparent 0, transparent 27px, rgba(90,70,50,0.14) 28px);
  background-origin:border-box;
  background-position:0 16px;
  transform:rotate(-0.6deg);
}
.caption-card::before{
  content:'';position:absolute;left:14px;top:0;bottom:0;width:1px;
  background:rgba(190,40,50,0.35);
}
.caption-card textarea{
  width:100%;background:transparent;border:none;outline:none;
  color:var(--ink);font-family:var(--font-hand);
  font-size:15px;line-height:28px;resize:none;min-height:112px;
  white-space:pre-wrap;
  word-wrap:break-word;
  overflow-wrap:break-word;
  word-break:break-word;
}
.caption-card textarea::placeholder{color:var(--ink-soft);opacity:.7;}
.booth-charcount{
  font-family:var(--font-body);font-size:11px;color:rgba(242,231,210,0.4);
  text-align:right;padding:6px 20px 4px;
}

/* ============ VOICE / TAPE ============ */
.tape-unit{
  margin:20px 16px 0;
  background:linear-gradient(160deg,#231515,#160d0d);
  border:1px solid rgba(240,169,68,0.2);
  border-radius:10px;
  padding:16px;
  display:flex;align-items:center;gap:16px;
}
.tape-reels{display:flex;gap:10px;}
.reel{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #3a2323 0 6px, #191010 7px 14px, #3a2323 15px 17px);
  border:2px solid rgba(240,169,68,0.3);
}
.reel.spin{animation:reelSpin 1.1s linear infinite;}
@keyframes reelSpin{to{transform:rotate(360deg);}}

.tape-controls{flex:1;display:flex;flex-direction:column;gap:8px;}
.tape-controls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

#recordBtn{
  display:flex;align-items:center;gap:6px;
  background:var(--curtain-red);border:none;border-radius:18px;
  padding:8px 15px;font-size:12.5px;font-weight:700;color:#fff;
  cursor:pointer;font-family:var(--font-body);
  transition:background .15s,transform .1s;
}
#recordBtn:hover{background:#84192a;}
#recordBtn:active{transform:scale(.96);}
#recordBtn.recording{
  background:#e02020;animation:rpulse 1.3s ease infinite;
}
@keyframes rpulse{0%,100%{box-shadow:0 0 0 0 rgba(224,32,32,.5)}50%{box-shadow:0 0 0 7px rgba(224,32,32,0)}}

#recordStatus{font-family:var(--font-hand);font-size:11px;color:rgba(242,231,210,0.45);}
#recordStatus.active{color:#ff6b6b;}

.ig-file-label{
  display:flex;align-items:center;gap:6px;
  background:transparent;border:1px solid rgba(240,169,68,0.35);
  border-radius:18px;padding:8px 15px;font-size:12.5px;
  color:var(--bulb-amber-soft);cursor:pointer;
  transition:border-color .15s,color .15s;
}
.ig-file-label:hover{border-color:var(--bulb-amber);color:#fff;}
#audioInput{display:none !important;}

#audioPreview{
  width:100%;margin-top:2px;border-radius:6px;display:none;height:32px;
}

/* ============ SHUTTER SUBMIT ============ */
.shutter-wrap{
  display:flex;flex-direction:column;align-items:center;
  gap:10px;padding:34px 16px 40px;
}
.shutter-btn{
  width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff5c5c, var(--curtain-red) 55%, #3d0b13 100%);
  border:4px solid rgba(240,169,68,0.55);
  box-shadow:0 0 0 6px rgba(240,169,68,0.08), 0 8px 24px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;color:#fff;font-family:var(--font-body);
  transition:transform .12s, box-shadow .2s;
}
.shutter-btn:hover{box-shadow:0 0 0 9px rgba(240,169,68,0.14), 0 8px 24px rgba(0,0,0,.6);}
.shutter-btn:active{transform:scale(.94);}
.shutter-btn .bi{font-size:24px;}
.shutter-btn span{font-size:9.5px;font-weight:700;letter-spacing:1px;}
.shutter-btn.done{background:radial-gradient(circle at 35% 30%,#4fd88a,#1d9c5f 60%,#0e5c37 100%);}
.shutter-caption{
  font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:2px;
  color:rgba(242,231,210,0.55);
}
</style>
</head>

<body class="locked">

<!-- CURTAIN INTRO -->
<div class="curtain-stage" aria-hidden="true">
  <div class="curtain-panel curtain-left"></div>
  <div class="curtain-mark">MEMORY BOOTH</div>
  <div class="curtain-panel curtain-right"></div>
</div>
<div class="flash-overlay" aria-hidden="true"></div>

<div class="booth-shell">
<form id="giftForm" enctype="multipart/form-data">

  <!-- MARQUEE TOPBAR -->
  <div class="booth-marquee">
    <div class="bulbs">
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span>
    </div>
    <div class="booth-marquee-row">
      <button class="booth-back" type="button" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
      <span class="booth-title">MEMORY <span>BOOTH</span></span>
      <button class="booth-share-top" type="submit" form="giftForm">In ảnh</button>
    </div>
    <div class="booth-tagline">— bước vào, cười lên, lưu lại khoảnh khắc —</div>
  </div>

  <input type="file" id="imageInput" name="images" accept="image/*" multiple hidden>

  <div class="booth-label">Cuộn phim của bạn</div>
  <div class="filmstrip">
    <div id="previewContainer">
      <div id="addBox" onclick="imageInput.click()">
        <i class="bi bi-plus-lg"></i>
        <span>THÊM ẢNH</span>
      </div>
    </div>
  </div>
  <div class="filmstrip-hint">tối đa 9 tấm — chạm để gỡ ảnh</div>

  <div class="booth-label">Viết sau tấm ảnh</div>
  <div class="caption-card">
    <textarea name="message" placeholder="Viết vài dòng lưu niệm…" maxlength="2200" oninput="updateCount(this)"></textarea>
  </div>
  <div class="booth-charcount"><span id="cCount">0</span> / 2.200</div>

  <div class="booth-label">Ghi âm một lời nhắn</div>
  <div class="tape-unit">
    <div class="tape-reels">
      <div class="reel" id="reelL"></div>
      <div class="reel" id="reelR"></div>
    </div>
    <div class="tape-controls">
      <div class="tape-controls-row">
        <button type="button" id="recordBtn">
          <i class="bi bi-mic"></i>
          <span id="recordLabel">Ghi âm</span>
        </button>
        <label class="ig-file-label" for="audioInput">
          <i class="bi bi-upload"></i> Tải lên
        </label>
        <span id="recordStatus"></span>
      </div>
      <input type="file" id="audioInput" name="audio" accept="audio/*">
      <audio id="audioPreview" controls></audio>
    </div>
  </div>

  <div class="shutter-wrap">
    <button type="submit" class="shutter-btn" id="shareBtn">
      <i class="bi bi-camera-fill" id="shareIco"></i>
      <span id="shareLbl">IN ẢNH</span>
    </button>
    <div class="shutter-caption">nhấn nút để lưu khoảnh khắc</div>
  </div>

</form>
</div>

<script>

let selectedImages = [];
let audioFile = null;
let mediaRecorder;
let chunks = [];
let stream;
const rotClasses = ['rot1','rot2','rot3','rot4','rot5'];

// ================= INTRO CURTAIN =================
(function initCurtain(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const openNow = () => {
    document.body.classList.add('opened');
    document.body.classList.remove('locked');
  };
  if (reduce){
    document.querySelectorAll('.curtain-panel,.curtain-mark').forEach(el=>el.style.transition='none');
    openNow();
    return;
  }
  window.addEventListener('load', () => {
    setTimeout(openNow, 350);
    setTimeout(() => {
      document.body.classList.remove('locked');
    }, 1700);
  });
})();

// LẤY UID TỪ URL
const urlParams = new URLSearchParams(window.location.search);
const uid = urlParams.get("uid");
if (!uid) {
    alert("Không tìm thấy UID NFC");
}

// ================= IMAGE =================
const imageInput = document.getElementById("imageInput");
const previewContainer = document.getElementById("previewContainer");
const addBox = document.getElementById("addBox");

imageInput.addEventListener("change", function () {
    Array.from(this.files).forEach(file => {
        if (selectedImages.length >= 9) return;
        selectedImages.push(file);
        const reader = new FileReader();
        reader.onload = e => {
            const wrap = document.createElement("div");
            const rot = rotClasses[Math.floor(Math.random()*rotClasses.length)];
            wrap.className = "img-item-wrap img-item " + rot;
            wrap.innerHTML = `
                <img src="${e.target.result}" alt="">
                <button type="button" class="btn-remove" onclick="removeImage(this)">
                    <i class="bi bi-x"></i>
                </button>
            `;
            previewContainer.insertBefore(wrap, addBox);
            updateLayout();
        };
        reader.readAsDataURL(file);
    });
    this.value = "";
});

function removeImage(btn) {
    const items = document.querySelectorAll(".img-item");
    const index = Array.from(items).indexOf(btn.closest(".img-item"));
    if (index > -1) selectedImages.splice(index, 1);
    btn.closest(".img-item").remove();
    updateLayout();
}

function updateLayout() {
    addBox.style.display = selectedImages.length >= 9 ? "none" : "flex";
}

// ================= CAPTION COUNT =================
function updateCount(el) {
    document.getElementById("cCount").textContent = el.value.length;
}

// ================= AUDIO UPLOAD =================
const audioInput = document.getElementById("audioInput");
const audioPreview = document.getElementById("audioPreview");

audioInput.addEventListener("change", function () {
    if (this.files.length) {
        audioFile = this.files[0];
        audioPreview.src = URL.createObjectURL(audioFile);
        audioPreview.style.display = "block";
        stopMic();
    }
});

// ================= RECORD =================
function stopMic() {
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
    document.getElementById("reelL").classList.remove("spin");
    document.getElementById("reelR").classList.remove("spin");
}

const recordBtn = document.getElementById("recordBtn");
const recordLabel = document.getElementById("recordLabel");
const recordStatus = document.getElementById("recordStatus");

recordBtn.addEventListener("click", async () => {

    if (!navigator.mediaDevices?.getUserMedia) {
        alert("Thiết bị không hỗ trợ micro");
        return;
    }

    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();

        recordBtn.classList.remove("recording");
        recordLabel.textContent = "Ghi âm";
        recordBtn.querySelector(".bi").className = "bi bi-mic";
        recordStatus.textContent = "Đã xong";
        recordStatus.className = "";

        return;
    }

    try {

        stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        // Ưu tiên định dạng tương thích nhất
        let mimeType = "";

        if (MediaRecorder.isTypeSupported("audio/mp4")) {
            mimeType = "audio/mp4";
        } else if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
            mimeType = "audio/webm;codecs=opus";
        } else if (MediaRecorder.isTypeSupported("audio/webm")) {
            mimeType = "audio/webm";
        }

        mediaRecorder = mimeType
            ? new MediaRecorder(stream, { mimeType })
            : new MediaRecorder(stream);

        chunks = [];

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
                chunks.push(e.data);
            }
        };

        mediaRecorder.onstop = () => {

            const realType = mediaRecorder.mimeType || mimeType;

            const blob = new Blob(chunks, {
                type: realType
            });

            const extension = realType.includes("mp4")
                ? "m4a"
                : "webm";

            audioFile = new File(
                [blob],
                `voice.${extension}`,
                {
                    type: realType
                }
            );

            audioPreview.src = URL.createObjectURL(audioFile);
            audioPreview.style.display = "block";

            stopMic();
        };

        mediaRecorder.start();

        recordBtn.classList.add("recording");
        recordLabel.textContent = "Dừng";
        recordBtn.querySelector(".bi").className = "bi bi-stop-fill";
        recordStatus.textContent = "Đang ghi…";
        recordStatus.className = "active";

        document.getElementById("reelL").classList.add("spin");
        document.getElementById("reelR").classList.add("spin");

    } catch (err) {
        alert(err.message);
        console.error(err);
    }
});

// ================= SUBMIT =================
document.getElementById("giftForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const btn = document.getElementById("shareBtn");
    btn.disabled = true;
    document.getElementById("shareLbl").textContent = "Đang in…";

    // shutter flash on submit
    const flash = document.createElement('div');
    flash.className = 'flash-overlay';
    flash.style.zIndex = 10001;
    document.body.appendChild(flash);
    requestAnimationFrame(() => { flash.style.animation = 'flashPulse .5s ease-out forwards'; });
    setTimeout(() => flash.remove(), 600);

    const formData = new FormData();
    formData.append("message", document.querySelector("textarea[name='message']").value);
    selectedImages.forEach(i => formData.append("images", i));
    if (audioFile) formData.append("audio", audioFile);

    const url = window.location.origin
        + "/api/gift/save/"
        + uid;

    try {
        const res = await fetch(url, { method: "POST", body: formData });

        if (!res.ok) {
            const err = await res.text();
            alert("ERROR: " + err);
            btn.disabled = false;
            document.getElementById("shareLbl").textContent = "IN ẢNH";
            return;
        }

        btn.classList.add("done");
        document.getElementById("shareLbl").textContent = "Đã lưu!";
        document.getElementById("shareIco").className = "bi bi-check-lg";

        setTimeout(() => {
            window.location.href = "/gift/view/" + uid;
        }, 800);

    } catch (err) {
        alert("Lỗi kết nối mạng");
        console.log(err);
        btn.disabled = false;
        document.getElementById("shareLbl").textContent = "IN ẢNH";
    }
});

</script>

</body>
</html>

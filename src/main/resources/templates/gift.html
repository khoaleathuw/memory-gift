<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Memory Gift</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/gift.css}">

</head>

<body>

<div class="gift-card">

    <div class="title">🎁 Memory Gift</div>

    <!-- MESSAGE -->
    <div class="section-box">
        <div class="section-header">
            <h5>Message</h5>
            <a th:href="@{'/gift/edit/' + ${gift.id}}" class="edit-icon">✏️</a>
        </div>

        <div class="message" th:text="${gift.message}"></div>
    </div>

    <!-- IMAGE -->
    <div class="section-box">
        <div class="section-header">
            <h5>Images</h5>
            <a th:href="@{'/gift/edit/' + ${gift.id}}" class="edit-icon">✏️</a>
        </div>

        <img id="mainImage"
             class="main-img"
             th:if="${!#lists.isEmpty(gift.images)}"
             th:src="${gift.images[0].imageUrl}">

        <div class="thumb-container">
            <img th:each="img : ${gift.images}"
                 th:src="${img.imageUrl}"
                 class="thumb"
                 onclick="document.getElementById('mainImage').src=this.src">
        </div>
    </div>

    <!-- AUDIO -->
    <div class="section-box">
        <div class="section-header">
            <h5>Voice</h5>
            <a th:href="@{'/gift/edit/' + ${gift.id}}" class="edit-icon">✏️</a>
        </div>

  <audio controls th:if="${gift.voiceUrl != null}">
    <source th:src="${gift.voiceUrl}">
</audio>
    </div>

</div>
</body>
</html>

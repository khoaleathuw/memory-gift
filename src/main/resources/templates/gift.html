<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
<meta charset="UTF-8">
<title>Memory Booth</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/gift.css}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --night-deep:#070b1f;
  --night-navy:#0f1638;
  --night-mid:#1b2452;
  --night-indigo:#2a3570;
  --star-white:#f4f6ff;
  --star-soft:#c9d2ff;
  --moon-glow:#fdf6e3;
  --silver:#cfd6f0;
  --lilac:#9f8fe0;
  --ink:#e8ebff;
  --ink-soft:#a6acd9;
  --flash-white:#eef1ff;
}

*{box-sizing:border-box;margin:0;padding:0;}

html,body{height:100%;}

body{
  background:
    radial-gradient(ellipse 70% 40% at 78% 6%, rgba(253,246,227,0.10), transparent 60%),
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(159,143,224,0.14), transparent 60%),
    radial-gradient(ellipse 90% 50% at 50% 110%, rgba(42,53,112,0.35), transparent 60%),
    linear-gradient(180deg, var(--night-deep), var(--night-navy) 60%, var(--night-mid));
  background-size:100% 100%;
  animation:bgBreathe 16s ease-in-out infinite;
  min-height:100vh;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  overflow-x:hidden;
  padding-bottom:40px;
  position:relative;
}
@keyframes bgBreathe{
  0%,100%{ background-position:78% 6%, 50% -10%, 50% 110%, 0 0; }
  50%{ background-position:74% 2%, 50% -4%, 50% 104%, 0 0; }
}

body.locked{overflow:hidden;height:100vh;}

/* ============ STAR FIELD ============ */
.leaf-field{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.star-twinkle{
  position:absolute;border-radius:50%;
  background:var(--star-white);
  box-shadow:0 0 6px 1px rgba(244,246,255,0.7);
  animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{ opacity:.15; transform:scale(.7); }
  50%{ opacity:1; transform:scale(1.15); }
}
.leaf{
  position:absolute;
  font-size:14px;
  opacity:0;
  filter:drop-shadow(0 0 4px rgba(244,246,255,.5));
  animation:leafFall linear infinite;
}
@keyframes leafFall{
  0%{ transform:translate(0,-8vh) rotate(0deg); opacity:0; }
  8%{ opacity:.7; }
  92%{ opacity:.55; }
  100%{ transform:translate(var(--drift,40px),112vh) rotate(160deg); opacity:0; }
}
.shooting-star{
  position:absolute;
  width:2px;height:2px;
  background:var(--star-white);
  border-radius:50%;
  box-shadow:0 0 8px 2px rgba(244,246,255,0.9);
  opacity:0;
  animation:shootAcross 5.5s ease-in infinite;
}
.shooting-star::before{
  content:'';
  position:absolute;top:50%;right:0;
  width:90px;height:1px;
  background:linear-gradient(90deg, rgba(244,246,255,0.9), transparent);
  transform:translateY(-50%);
}
@keyframes shootAcross{
  0%{ opacity:0; transform:translate(0,0); }
  2%{ opacity:1; }
  14%{ opacity:0; transform:translate(-260px,180px); }
  100%{ opacity:0; }
}

/* ============ CURTAIN INTRO (night silk) ============ */
.curtain-stage{position:fixed;inset:0;z-index:9999;display:flex;pointer-events:none;}
.curtain-panel{
  flex:1;
  background:
    linear-gradient(160deg, var(--night-mid) 0%, var(--night-navy) 55%, var(--night-deep) 100%);
  box-shadow:inset 0 0 140px rgba(0,0,0,0.4);
  transition:transform 1.15s cubic-bezier(.76,0,.15,1);
  position:relative;
  overflow:hidden;
}
.curtain-panel::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(244,246,255,0.5) 1px, transparent 1.4px);
  background-size:38px 46px;
  opacity:.35;
}
.curtain-panel::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.3), transparent 14%, transparent 86%, rgba(0,0,0,.35));
}
.curtain-left{transform-origin:left center;}
.curtain-right{transform-origin:right center;}
body.opened .curtain-left{transform:translateX(-101%);}
body.opened .curtain-right{transform:translateX(101%);}

.curtain-mark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-style:italic;
  font-size:10.5vw;
  letter-spacing:3px;
  color:var(--moon-glow);
  text-shadow:0 0 40px rgba(253,246,227,0.55);
  white-space:nowrap;
  z-index:2;
  opacity:1;
  transition:opacity .5s ease .05s;
}
body.opened .curtain-mark{opacity:0;}

.flash-overlay{
  position:fixed;inset:0;z-index:10000;
  background:var(--flash-white);
  opacity:0;pointer-events:none;
}
body.opened .flash-overlay{animation:flashPulse .7s ease-out .95s forwards;}
@keyframes flashPulse{0%{opacity:0}12%{opacity:.7}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){
  .curtain-panel,.curtain-mark,.leaf,.star-twinkle,.shooting-star,body{animation:none !important;transition:none !important;}
  body.opened .flash-overlay{animation:none !important;}
}

/* ============ SHELL ============ */
.booth-shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  border-left:1px solid rgba(159,143,224,0.15);
  border-right:1px solid rgba(159,143,224,0.15);
  opacity:0;
  transform:translateY(10px);
  transition:opacity .7s ease .95s, transform .7s ease .95s;
  position:relative;
  z-index:2;
}
body.opened .booth-shell{opacity:1;transform:translateY(0);}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s ease;}
.reveal.in{opacity:1;transform:translateY(0);}

/* ============ MARQUEE TOPBAR ============ */
.booth-marquee{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg, var(--night-navy), var(--night-deep) 95%);
  border-bottom:1px solid rgba(159,143,224,0.25);
  padding:14px 16px 10px;
  text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,0.35);
}
.booth-marquee .bulbs{
  display:flex;justify-content:center;gap:8px;margin-bottom:6px;
}
.booth-marquee .bulb{
  width:5px;height:5px;border-radius:50%;
  background:var(--moon-glow);
  box-shadow:0 0 6px 1px rgba(253,246,227,0.7);
  opacity:.85;
  animation:leafPulse 2.6s ease-in-out infinite;
}
.booth-marquee .bulb:nth-child(odd){animation-delay:.3s;}
.booth-marquee .bulb:nth-child(3n){animation-delay:.6s;}
@keyframes leafPulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

.booth-marquee-row{display:flex;align-items:center;justify-content:space-between;}
.booth-back, .booth-edit{
  background:none;border:none;color:var(--ink);font-size:20px;
  cursor:pointer;opacity:.9;text-decoration:none;line-height:1;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  width:34px;height:34px;border-radius:50%;
}
.booth-back:active, .booth-edit:active{background:rgba(159,143,224,0.18);}
.booth-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-style:italic;
  font-size:23px;letter-spacing:1px;
  color:var(--ink);
}
.booth-title span{color:var(--moon-glow);}

.booth-tagline{
  font-family:'Inter',sans-serif;
  font-weight:500;
  font-size:11.5px;color:rgba(232,235,255,0.6);
  margin-top:4px;letter-spacing:.3px;
}

/* ============ SECTION LABEL ============ */
.booth-label{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:16px;letter-spacing:1px;
  color:var(--lilac);
  padding:20px 18px 8px;
}

/* ============ FILMSTRIP VIEWER (SWIPER) ============ */
.filmstrip{
  margin:0 12px;
  padding:14px 14px 22px;
  background:rgba(27,36,82,0.55);
  border:1px solid rgba(159,143,224,0.25);
  border-radius:14px;
  position:relative;
  backdrop-filter:blur(2px);
}

.ig-swiper{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.ig-slide{
  aspect-ratio:1;
  position:relative;
  background:var(--night-deep);
  padding:5px 5px 9px;
  border-radius:6px;
  box-shadow:0 3px 10px rgba(0,0,0,.5);
  overflow:hidden;
  display:flex;
  border:1px solid rgba(207,214,240,0.25);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease;
}
.ig-slide::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(115deg, transparent 30%, rgba(244,246,255,.35) 48%, transparent 62%);
  transform:translateX(-120%);
  transition:transform .7s ease;
  pointer-events:none;
}
.ig-slide:hover, .ig-slide:active{
  transform:rotate(0deg) scale(1.06) translateY(-4px);
  box-shadow:0 12px 26px rgba(159,143,224,.32);
  z-index:3;
}
.ig-slide:hover::after, .ig-slide:active::after{transform:translateX(120%);}
.ig-slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  border-radius:3px;
  filter:saturate(1.02) contrast(1.03) brightness(.98);
}
.ig-slide.rot1{transform:rotate(-3deg);}
.ig-slide.rot2{transform:rotate(2deg);}
.ig-slide.rot3{transform:rotate(-1.5deg);}
.ig-slide.rot4{transform:rotate(3deg);}
.ig-slide.rot5{transform:rotate(0deg);}
.ig-slide.rot6{transform:rotate(1.5deg);}

.filmstrip-hint{
  font-family:'Inter',sans-serif;
  font-size:11px;color:var(--ink-soft);
  text-align:center;padding:10px 4px 0;
}

/* ============ CAPTION CARD ============ */
.caption-card{
  margin:18px 16px 0;
  background:rgba(27,36,82,0.6);
  border-radius:12px;
  padding:16px 18px 14px 20px;
  box-shadow:0 6px 20px rgba(0,0,0,.3), inset 0 0 0 1px rgba(159,143,224,0.2);
  position:relative;
  border-left:4px solid var(--lilac);
  overflow:hidden;
  backdrop-filter:blur(2px);
}
.caption-card .cap-from{
  font-family:'Inter',sans-serif;font-weight:800;font-size:11px;
  letter-spacing:1px;color:var(--lilac);text-transform:uppercase;
  margin-bottom:4px;
}
.caption-card .cap-text{
  color:var(--ink);
  font-family:'Caveat',cursive;
  font-weight:600;
  font-size:20px;
  line-height:28px;
  white-space:pre-wrap;
  overflow-wrap:break-word;
  word-break:break-word;
}
.caption-card .cap-text .type-cursor{
  display:inline-block;width:2px;height:1em;background:var(--moon-glow);
  margin-left:2px;vertical-align:-2px;
  animation:caretBlink .9s steps(1) infinite;
}
@keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}

.booth-timestamp{
  font-family:'Inter',sans-serif;font-size:10.5px;
  color:var(--ink-soft);
  text-align:right;padding:6px 20px 4px;
  text-transform:uppercase;letter-spacing:.5px;
}

/* ============ VOICE / TAPE PLAYER ============ */
.tape-unit{
  margin:12px 16px 0;
  background:linear-gradient(160deg,rgba(42,53,112,0.55),rgba(15,22,56,0.7));
  border:1px solid rgba(159,143,224,0.25);
  border-radius:14px;
  padding:16px;
  display:flex;align-items:center;gap:16px;
  transition:box-shadow .3s ease;
  backdrop-filter:blur(2px);
}
.tape-unit.playing{
  box-shadow:0 0 0 2px rgba(159,143,224,0.3), 0 10px 26px rgba(0,0,0,.3);
}
.tape-reels{display:flex;gap:10px;flex-shrink:0;}
.reel{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--star-soft), var(--lilac) 55%, var(--night-indigo) 100%);
  border:2px solid rgba(207,214,240,0.3);
}
.reel.spin{animation:reelSpin 1.1s linear infinite;}
@keyframes reelSpin{to{transform:rotate(360deg);}}

.tape-controls{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
.tape-play-row{display:flex;align-items:center;gap:12px;}

.tape-play-btn{
  width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--star-soft), var(--lilac));
  border:none;color:var(--night-deep);
  font-size:16px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:filter .15s, transform .1s;
  position:relative;
  overflow:visible;
}
.tape-play-btn::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  border:2px solid var(--moon-glow);
  opacity:0;transform:scale(.85);
}
.tape-unit.playing .tape-play-btn::before{
  animation:pulseRing 1.5s ease-out infinite;
}
@keyframes pulseRing{
  0%{opacity:.6;transform:scale(.85);}
  100%{opacity:0;transform:scale(1.4);}
}
.tape-play-btn:hover{filter:brightness(1.08);}
.tape-play-btn:active{transform:scale(.92);}

.tape-progress-wrap{flex:1;min-width:0;}
.tape-progress{
  width:100%;height:4px;border-radius:2px;
  background:rgba(207,214,240,0.18);
  cursor:pointer;position:relative;
}
.tape-progress-bar{
  height:100%;border-radius:2px;
  background:var(--moon-glow);
  width:0%;
  transition:width .1s linear;
  pointer-events:none;
  box-shadow:0 0 6px rgba(253,246,227,0.6);
}
.tape-times{
  display:flex;justify-content:space-between;
  font-family:'Inter',sans-serif;
  font-size:10px;color:var(--ink-soft);
  margin-top:4px;
}
audio#hiddenAudio{display:none;}

/* ============ EMPTY STATES ============ */
.booth-empty{
  margin:18px 16px 0;
  font-family:'Inter',sans-serif;
  font-size:12px;color:var(--ink-soft);
  text-align:center;padding:24px 10px;
  border:1px dashed rgba(159,143,224,0.3);
  border-radius:10px;
}

/* ============ FOOTER STAMP ============ */
.booth-footer{
  text-align:center;padding:34px 16px 10px;
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-style:italic;
  font-size:14px;letter-spacing:1px;
  color:var(--lilac);
  opacity:.7;
}

/* ripple effect */
.ripple-dot{
  position:absolute;border-radius:50%;
  background:rgba(244,246,255,0.5);
  transform:scale(0);
  animation:rippleAnim .55s ease-out forwards;
  pointer-events:none;
}
@keyframes rippleAnim{
  to{ transform:scale(2.6); opacity:0; }
}
</style>
</head>

<body class="locked">

<!-- STAR FIELD -->
<div class="leaf-field" id="leafField" aria-hidden="true"></div>

<!-- CURTAIN INTRO -->
<div class="curtain-stage" aria-hidden="true">
  <div class="curtain-panel curtain-left"></div>
  <div class="curtain-mark">Dưới bầu trời đêm</div>
  <div class="curtain-panel curtain-right"></div>
</div>
<div class="flash-overlay" aria-hidden="true"></div>

<div class="booth-shell">

  <!-- MARQUEE TOPBAR -->
  <div class="booth-marquee">
    <div class="bulbs">
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span>
    </div>
    <div class="booth-marquee-row">
      <button class="booth-back ripple-btn" type="button" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
      <span class="booth-title">MEMORY <span>BOOTH</span></span>
      <a class="booth-edit ripple-btn" th:href="@{'/gift/edit/' + ${uid}}"><i class="bi bi-pencil"></i></a>
    </div>
    <div class="booth-tagline">— những vì sao ký ức —</div>
  </div>

  <!-- FILMSTRIP VIEWER -->
  <div class="booth-label">Cuộn phim của bạn</div>
  <div class="filmstrip reveal" th:if="${gift.images != null and !gift.images.isEmpty()}">
    <div class="ig-swiper" id="swiper">
      <div class="ig-slide" th:each="img, iter : ${gift.images}"
           th:classappend="${'rot' + (iter.index % 6 + 1)}">
        <img th:src="@{'/files/images/' + ${img.imageUrl}}">
      </div>
    </div>
    <div class="filmstrip-hint">tất cả khoảnh khắc trong cuộn phim này</div>
  </div>
  <div class="booth-empty reveal" th:if="${gift.images == null or gift.images.isEmpty()}">
    chưa có tấm ảnh nào trong cuộn phim này
  </div>

  <!-- CAPTION -->
  <div class="booth-label">Viết sau tấm ảnh</div>
  <div class="caption-card reveal" th:if="${gift.message != null and gift.message != ''}">
    <div class="cap-text" id="capText" th:text="${gift.message}"></div>
  </div>
  <div class="booth-empty reveal" th:if="${gift.message == null or gift.message == ''}">
    chưa có lời nhắn nào được viết
  </div>
  <div class="booth-timestamp">Just now</div>

  <!-- VOICE / TAPE -->
  <div class="booth-label">Lời nhắn bằng giọng nói</div>
  <div class="tape-unit reveal" id="tapeUnit" th:if="${gift.voiceUrl != null and gift.voiceUrl != ''}">
    <div class="tape-reels">
      <div class="reel" id="reelL"></div>
      <div class="reel" id="reelR"></div>
    </div>
    <div class="tape-controls">
      <div class="tape-play-row">
        <button class="tape-play-btn ripple-btn" id="playBtn" onclick="toggleAudio()">
          <i class="bi bi-play-fill" id="playIco"></i>
        </button>
        <div class="tape-progress-wrap">
          <div class="tape-progress" id="progressBar" onclick="seekAudio(event)">
            <div class="tape-progress-bar" id="audioBar"></div>
          </div>
          <div class="tape-times">
            <span id="curTime">0:00</span>
            <span id="durTime">0:00</span>
          </div>
        </div>
      </div>
    </div>
   <audio id="hiddenAudio"
       <source th:src="@{'/files/audio/' + ${gift.voiceUrl}}">
  </audio>
  </div>
  <div class="booth-empty reveal" th:if="${gift.voiceUrl == null or gift.voiceUrl == ''}">
    chưa có ghi âm nào được lưu lại
  </div>

  <div class="booth-footer reveal">— MEMORY BOOTH —</div>

</div>

<script>
// ================= INTRO CURTAIN =================
(function initCurtain(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const openNow = () => {
    document.body.classList.add('opened');
    document.body.classList.remove('locked');
  };
  if (reduce){
    document.querySelectorAll('.curtain-panel,.curtain-mark').forEach(el=>el.style.transition='none');
    openNow();
    return;
  }
  window.addEventListener('load', () => {
    setTimeout(openNow, 350);
    setTimeout(() => {
      document.body.classList.remove('locked');
    }, 1700);
  });
})();

// ================= STAR FIELD (twinkles + shooting stars + drifting sparkles) =================
(function initStars(){
  const field = document.getElementById('leafField');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // static twinkling stars
  const starCount = 55;
  for(let i=0;i<starCount;i++){
    const s = document.createElement('span');
    s.className = 'star-twinkle';
    const size = (Math.random()*2 + 1).toFixed(1);
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (Math.random()*100)+'vh';
    s.style.animationDuration = (2 + Math.random()*3).toFixed(1)+'s';
    s.style.animationDelay = (Math.random()*4).toFixed(1)+'s';
    field.appendChild(s);
  }

  if(reduce) return;

  // drifting sparkle emoji
  const symbols = ['✨','⭐'];
  for(let i=0;i<6;i++){
    const leaf = document.createElement('span');
    leaf.className = 'leaf';
    leaf.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    leaf.style.left = (Math.random()*100)+'vw';
    leaf.style.fontSize = (10+Math.random()*10).toFixed(0)+'px';
    leaf.style.animationDuration = (16 + Math.random()*14)+'s';
    leaf.style.animationDelay = (Math.random()*14)+'s';
    leaf.style.setProperty('--drift', (Math.random()*80-40).toFixed(0)+'px');
    field.appendChild(leaf);
  }

  // shooting stars
  for(let i=0;i<2;i++){
    const sh = document.createElement('span');
    sh.className = 'shooting-star';
    sh.style.top = (10 + Math.random()*30)+'vh';
    sh.style.right = (-10)+'vw';
    sh.style.animationDelay = (i*3 + Math.random()*4)+'s';
    field.appendChild(sh);
  }
})();

// ================= SCROLL REVEAL =================
(function initReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){
    els.forEach(el=>el.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('in');
        io.unobserve(entry.target);
      }
    });
  }, {threshold:.15});
  els.forEach(el=>io.observe(el));
})();

// ================= CAPTION TYPEWRITER =================
(function initTypewriter(){
  const el = document.getElementById('capText');
  if(!el) return;
  const fullText = el.textContent;
  if(!fullText || !fullText.trim()) return;
  el.textContent = '';
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor';
  let started = false;

  function typeIt(){
    if(started) return;
    started = true;
    let i = 0;
    el.appendChild(cursor);
    const speed = Math.max(12, Math.min(28, 900/fullText.length));
    const timer = setInterval(()=>{
      if(i >= fullText.length){
        clearInterval(timer);
        return;
      }
      cursor.insertAdjacentText('beforebegin', fullText[i]);
      i++;
    }, speed);
  }

  if('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          setTimeout(typeIt, 150);
          io.disconnect();
        }
      });
    }, {threshold:.4});
    io.observe(el);
  } else {
    typeIt();
  }
})();

// ================= RIPPLE ON BUTTONS =================
(function initRipple(){
  document.querySelectorAll('.ripple-btn').forEach(btn=>{
    btn.addEventListener('click', function(e){
      const rect = btn.getBoundingClientRect();
      const dot = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      dot.className = 'ripple-dot';
      dot.style.width = dot.style.height = size+'px';
      dot.style.left = ((e.clientX ?? rect.left+rect.width/2) - rect.left - size/2)+'px';
      dot.style.top = ((e.clientY ?? rect.top+rect.height/2) - rect.top - size/2)+'px';
      btn.style.position = btn.style.position || 'relative';
      btn.style.overflow = 'hidden';
      btn.appendChild(dot);
      setTimeout(()=>dot.remove(), 600);
    });
  });
})();

/* ── AUDIO / TAPE PLAYER ── */
const audio = document.getElementById('hiddenAudio');
if(audio){
    audio.addEventListener("loadedmetadata", () => {
        console.log("duration", audio.duration);
    });
    audio.addEventListener("error", () => {
        console.log(audio.error);
    });
}

const reelL = document.getElementById('reelL');
const reelR = document.getElementById('reelR');
const tapeUnit = document.getElementById('tapeUnit');

function fmt(s){ const m=Math.floor(s/60); return m+':'+(Math.floor(s%60)+'').padStart(2,'0'); }

if(audio){
    audio.addEventListener('timeupdate',()=>{
        const pct = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
        document.getElementById('audioBar').style.width = pct+'%';
        document.getElementById('curTime').textContent = fmt(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata',()=>{
        document.getElementById('durTime').textContent = fmt(audio.duration);
    });
    audio.addEventListener('ended',()=>{
        document.getElementById('playIco').className='bi bi-play-fill';
        reelL.classList.remove('spin');
        reelR.classList.remove('spin');
        if(tapeUnit) tapeUnit.classList.remove('playing');
    });
}
function toggleAudio(){
    if(!audio) return;
    if(audio.paused){
        audio.play().catch(err => alert('Lỗi phát audio: ' + err.name + ' - ' + err.message));
        document.getElementById('playIco').className='bi bi-pause-fill';
        reelL.classList.add('spin');
        reelR.classList.add('spin');
        if(tapeUnit) tapeUnit.classList.add('playing');
    } else {
        audio.pause();
        document.getElementById('playIco').className='bi bi-play-fill';
        reelL.classList.remove('spin');
        reelR.classList.remove('spin');
        if(tapeUnit) tapeUnit.classList.remove('playing');
    }
}
function seekAudio(e){
    if(!audio || !audio.duration) return;
    const rect = document.getElementById('progressBar').getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

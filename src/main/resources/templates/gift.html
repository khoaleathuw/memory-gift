<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Memory Gift</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(135deg,#f5f7fa,#c3cfe2);
    font-family: Arial;
}

.gift-card{
    max-width: 720px;
    margin: 12px auto;
    background: white;
    border-radius: 18px;
    padding: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.message{
    font-size:16px;
    background:#f8f9fa;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
}

.main-img{
    width:100%;
    max-height:70vh;
    object-fit:contain;
    background:#000;
    border-radius:14px;
}

.thumb-container{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-top:12px;
    justify-content:center;
}

.thumb{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
}

.audio-box{
    margin-top:15px;
    padding:12px;
    background:#f1f3f5;
    border-radius:12px;
}

audio{
    width:100%;
}
</style>
</head>

<body>

<div class="gift-card">

    <div class="title">🎁 Memory Gift</div>

    <div class="message" th:text="${gift.message}"></div>

    <!-- ================= IMAGE ================= -->
    <div th:if="${gift.images != null and !#lists.isEmpty(gift.images)}">

        <!-- MAIN IMAGE -->
        <img id="mainImage"
             class="main-img"
             th:src="${gift.images[0].imageUrl}">

        <!-- THUMBNAILS -->
        <div class="thumb-container">

            <img th:each="img : ${gift.images}"
                 th:src="${img.imageUrl}"
                 class="thumb"
                 onclick="document.getElementById('mainImage').src=this.src">

        </div>

    </div>

    <!-- ================= AUDIO ================= -->
    <div class="audio-box" th:if="${gift.voiceUrl != null}">
        <audio controls>
            <source th:src="${gift.voiceUrl}" type="audio/webm">
        </audio>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Memory Gift</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/gift.css}">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #000;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
    padding-bottom: 70px;
    max-width: 480px;
    margin: 0 auto;
    overflow-x: hidden;
}

/* ── TOPBAR ── */
.ig-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    border-bottom: 0.5px solid #262626;
    position: sticky;
    top: 0;
    background: #000;
    z-index: 10;
}
.ig-topbar button, .ig-topbar a {
    font-size: 22px; color: #fff;
    background: none; border: none; cursor: pointer;
    line-height: 1; text-decoration: none; padding: 0;
}
.ig-topbar .ig-title { font-size: 16px; font-weight: 700; }

/* ── PROFILE ROW ── */
.ig-profile {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
}
.ig-profile-left { display: flex; align-items: center; gap: 10px; }
.ig-avatar-ring {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
    padding: 2px; flex-shrink: 0;
}
.ig-avatar-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
}
.ig-username { font-size: 13px; font-weight: 700; }
.ig-date { font-size: 11px; color: #a8a8a8; margin-top: 2px; }
.ig-more { font-size: 20px; color: #fff; background: none; border: none; cursor: pointer; }

/* ── IMAGE SWIPER ── */
.ig-swiper {
    position: relative;
    width: 100%;
    aspect-ratio: 1/1;
    overflow: hidden;
    background: #000;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
}
.ig-slides {
    display: flex; /* Bắt buộc phải có để dàn các slide hàng ngang */
    height: 100%;
    width: 100%;
    will-change: transform;
    transition: transform 0.3s cubic-bezier(0.215, 0.610, 0.355, 1);
}
.ig-slide {
    min-width: 100%;
    height: 100%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
}
.ig-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Đổi về cover theo ý muốn giao diện cũ của bạn */
    display: block;
    pointer-events: none;
}

/* ── DOTS ── */
.ig-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    padding: 8px 0 2px;
}
.ig-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #555;
    transition: background 0.2s, transform 0.2s;
}
.ig-dot.active { background: #0095f6; transform: scale(1.25); }

/* ── ACTION BAR ── */
.ig-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 4px;
}
.ig-actions-left { display: flex; gap: 16px; }
.ig-actions button {
    background: none; border: none; color: #fff;
    font-size: 26px; cursor: pointer; padding: 2px;
    transition: transform 0.15s;
    line-height: 1;
}
.ig-actions button:active { transform: scale(0.85); }
.ig-heart.liked i { color: #ed4956; }

/* ── LIKES ── */
.ig-likes {
    padding: 2px 16px 6px;
    font-size: 13px;
    font-weight: 700;
}

/* ── CAPTION ── */
.ig-caption {
    padding: 2px 16px 4px;
    font-size: 14px;
    line-height: 1.6;
}
.ig-caption .u { font-weight: 700; margin-right: 5px; }

/* ── VIEW COMMENTS ── */
.ig-view-comments {
    padding: 2px 16px 8px;
    font-size: 13px;
    color: #a8a8a8;
    cursor: pointer;
}

/* ── COMMENTS ── */
.ig-comments { padding: 0 16px; }
.ig-comment {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
}
.ig-comment .ig-avatar-ring { width: 30px; height: 30px; flex-shrink: 0; }
.ig-comment .ig-avatar-inner { font-size: 10px; }
.ig-comment-body { flex: 1; }
.ig-comment-body .u { font-size: 13px; font-weight: 700; margin-right: 5px; }
.ig-comment-body .txt { font-size: 13px; line-height: 1.5; }
.ig-comment-meta { display: flex; gap: 14px; margin-top: 4px; align-items: center; }
.ig-comment-meta span { font-size: 11px; color: #a8a8a8; }
.ig-comment-meta button {
    background: none; border: none; color: #a8a8a8;
    font-size: 11px; cursor: pointer; padding: 0; font-family: inherit; font-weight: 700;
}
.ig-comment-meta .cheart { font-size: 13px; color: #a8a8a8; background: none; border: none; cursor: pointer; padding: 0; }

/* ── TIMESTAMP ── */
.ig-timestamp {
    padding: 4px 16px 10px;
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* ── DIVIDER ── */
.ig-divider { height: 0.5px; background: #262626; margin: 4px 0; }

/* ── AUDIO PLAYER ── */
.ig-audio-wrap {
    padding: 14px 16px 16px;
}
.ig-audio-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700;
    color: #a8a8a8; text-transform: uppercase; letter-spacing: 0.6px;
    margin-bottom: 12px;
}
.ig-audio-player {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #111;
    border-radius: 12px;
    padding: 12px 14px;
}
.ig-audio-play {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #fff;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    color: #000;
    transition: transform 0.1s;
}
.ig-audio-play:active { transform: scale(0.92); }
.ig-audio-right { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.ig-audio-progress {
    width: 100%;
    height: 3px;
    background: #333;
    border-radius: 2px;
    cursor: pointer;
    position: relative;
}
.ig-audio-bar {
    height: 100%;
    background: #fff;
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
    pointer-events: none;
}
.ig-audio-times {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #a8a8a8;
}
audio#hiddenAudio { display: none; }

/* ── ADD COMMENT BAR ── */
.ig-add-comment {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-top: 0.5px solid #262626;
    position: fixed;
    bottom: 56px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: #000;
    z-index: 9;
}
.ig-add-comment input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
}
.ig-add-comment input::placeholder { color: #555; }
.ig-add-comment .post-btn {
    background: none; border: none;
    color: #0095f6; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; opacity: 0.4;
    transition: opacity 0.15s;
}
.ig-add-comment .post-btn.active { opacity: 1; }

/* ── BOTTOM NAV ── */
.ig-bottomnav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: #000;
    border-top: 0.5px solid #262626;
    display: flex;
    padding: 10px 0 12px;
    z-index: 10;
}
.ig-bottomnav a {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; text-decoration: none;
}
.ig-bottomnav a:hover { color: #a8a8a8; }

/* ── RESPONSIVE MÀN HÌNH NHỎ ── */
@media (max-width: 480px) {
    body { max-width: 100%; }
    .ig-topbar { padding: 12px; }
    .ig-profile { padding: 10px; }
    .ig-caption,
    .ig-likes,
    .ig-comments,
    .ig-view-comments,
    .ig-timestamp,
    .ig-audio-wrap {
        padding-left: 12px;
        padding-right: 12px;
    }
}
</style>
</head>

<body>

<div class="ig-topbar">
    <button onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
    <span class="ig-title">Post</span>
    <a th:href="@{'/gift/edit/' + ${gift.id}}"><i class="bi bi-pencil"></i></a>
</div>

<div class="ig-profile">
    <div class="ig-profile-left">
        <div class="ig-avatar-ring"><div class="ig-avatar-inner">Y</div></div>
        <div>
            <div class="ig-username">your_username</div>
            <div class="ig-date">Memory capsule</div>
        </div>
    </div>
    <button class="ig-more"><i class="bi bi-three-dots"></i></button>
</div>

<div class="ig-swiper" id="swiper" th:if="${!#lists.isEmpty(gift.images)}">
    <div class="ig-slides" id="slides">
        <div class="ig-slide" th:each="img : ${gift.images}">
            <img th:src="${img.imageUrl}" alt="">
        </div>
    </div>
</div>

<div class="ig-dots" id="dots" th:if="${#lists.size(gift.images) > 1}">
    <div th:each="img,iter : ${gift.images}"
         th:class="${iter.index == 0} ? 'ig-dot active' : 'ig-dot'"></div>
</div>

<div class="ig-actions">
    <div class="ig-actions-left">
        <button class="ig-heart" onclick="toggleHeart(this)" aria-label="Like">
            <i class="bi bi-heart"></i>
        </button>
        <button onclick="focusComment()" aria-label="Comment"><i class="bi bi-chat"></i></button>
        <button aria-label="Share"><i class="bi bi-send"></i></button>
    </div>
    <button aria-label="Save"><i class="bi bi-bookmark"></i></button>
</div>

<div class="ig-likes" id="likesCount">1 like</div>

<div class="ig-caption" th:if="${gift.message != null}">
    <span class="u">your_username</span><span th:text="${gift.message}"></span>
</div>

<div class="ig-view-comments" id="toggleComments" onclick="toggleComments()">View all 2 comments</div>

<div class="ig-comments" id="commentsSection" style="display:none">
    <div class="ig-comment">
        <div class="ig-avatar-ring"><div class="ig-avatar-inner" style="font-size:10px">A</div></div>
        <div class="ig-comment-body">
            <span class="u">friend_one</span><span class="txt">This is so beautiful 🥹</span>
            <div class="ig-comment-meta">
                <span>2h</span>
                <button>Reply</button>
                <button class="cheart"><i class="bi bi-heart"></i></button>
            </div>
        </div>
    </div>
    <div class="ig-comment">
        <div class="ig-avatar-ring"><div class="ig-avatar-inner" style="font-size:10px">B</div></div>
        <div class="ig-comment-body">
            <span class="u">friend_two</span><span class="txt">Love this memory 💛</span>
            <div class="ig-comment-meta">
                <span>1h</span>
                <button>Reply</button>
                <button class="cheart"><i class="bi bi-heart"></i></button>
            </div>
        </div>
    </div>
</div>

<div class="ig-timestamp">Just now</div>

<div class="ig-divider"></div>

<div class="ig-audio-wrap" th:if="${gift.voiceUrl != null}">
    <div class="ig-audio-label"><i class="bi bi-mic"></i> Voice note</div>
    <div class="ig-audio-player">
        <button class="ig-audio-play" id="playBtn" onclick="toggleAudio()">
            <i class="bi bi-play-fill" id="playIco"></i>
        </button>
        <div class="ig-audio-right">
            <div class="ig-audio-progress" id="progressBar" onclick="seekAudio(event)">
                <div class="ig-audio-bar" id="audioBar"></div>
            </div>
            <div class="ig-audio-times">
                <span id="curTime">0:00</span>
                <span id="durTime">0:00</span>
            </div>
        </div>
    </div>
    <audio id="hiddenAudio">
        <source th:src="${gift.voiceUrl}">
    </audio>
</div>

<div class="ig-add-comment">
    <div class="ig-avatar-ring" style="width:30px;height:30px;flex-shrink:0">
        <div class="ig-avatar-inner" style="font-size:10px">Y</div>
    </div>
    <input type="text" id="commentInput" placeholder="Add a comment…" oninput="onCommentInput(this)">
    <button class="post-btn" id="postBtn" onclick="postComment()">Post</button>
</div>

<div class="ig-bottomnav">
    <a href="#"><i class="bi bi-house"></i></a>
    <a href="#"><i class="bi bi-search"></i></a>
    <a href="#"><i class="bi bi-plus-square"></i></a>
    <a href="#"><i class="bi bi-heart"></i></a>
    <a href="#">
        <div class="ig-avatar-ring" style="width:26px;height:26px">
            <div class="ig-avatar-inner" style="font-size:9px">Y</div>
        </div>
    </a>
</div>

<script>
/* ── SWIPER LOGIC ── */
(function(){
    const swiper = document.getElementById('swiper');
    if(!swiper) return;
    const slides = document.getElementById('slides');
    const dots = document.querySelectorAll('.ig-dot');
    let cur = 0, total = slides ? slides.children.length : 0;
    if(total === 0) return;

    let startX = 0, currentX = 0, dragging = false;
    let swiperWidth = swiper.offsetWidth;

    window.addEventListener('resize', () => {
        swiperWidth = swiper.offsetWidth;
        goTo(cur);
    });

    function goTo(n){
        cur = Math.max(0, Math.min(n, total - 1));
        slides.style.transition = 'transform 0.3s cubic-bezier(0.215, 0.610, 0.355, 1)';
        slides.style.transform = `translateX(-${cur * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === cur));
    }

    function updatePosition() {
        if (!dragging) return;
        const dragDelta = currentX - startX;
        let offset = -cur * swiperWidth + dragDelta;
        if ((cur === 0 && dragDelta > 0) || (cur === total - 1 && dragDelta < 0)) {
            offset = -cur * swiperWidth + dragDelta * 0.3; 
        }
        slides.style.transform = `translateX(${offset}px)`;
        requestAnimationFrame(updatePosition);
    }

    // Điện thoại
    swiper.addEventListener('touchstart', e => {
        dragging = true;
        startX = e.touches[0].clientX;
        currentX = startX;
        slides.style.transition = 'none';
        requestAnimationFrame(updatePosition);
    }, {passive: true});

    swiper.addEventListener('touchmove', e => {
        if (!dragging) return;
        currentX = e.touches[0].clientX;
    }, {passive: true});

    swiper.addEventListener('touchend', () => {
        if (!dragging) return;
        dragging = false;
        const dragDelta = currentX - startX;
        if (dragDelta < -swiperWidth / 4) goTo(cur + 1);
        else if (dragDelta > swiperWidth / 4) goTo(cur - 1);
        else goTo(cur);
    });

    // Máy tính
    swiper.addEventListener('mousedown', e => {
        dragging = true;
        startX = e.clientX;
        currentX = startX;
        slides.style.transition = 'none';
        requestAnimationFrame(updatePosition);
    });

    swiper.addEventListener('mousemove', e => {
        if (!dragging) return;
        currentX = e.clientX;
    });

    const handleMouseUp = () => {
        if (!dragging) return;
        dragging = false;
        const dragDelta = currentX - startX;
        if (dragDelta < -swiperWidth / 4) goTo(cur + 1);
        else if (dragDelta > swiperWidth / 4) goTo(cur - 1);
        else goTo(cur);
    };

    swiper.addEventListener('mouseup', handleMouseUp);
    swiper.addEventListener('mouseleave', handleMouseUp);
})();

/* ── HEART ── */
let likes = 1;
function toggleHeart(btn){
    const ico = btn.querySelector('i');
    const on = ico.classList.contains('bi-heart-fill');
    ico.className = on ? 'bi bi-heart' : 'bi bi-heart-fill';
    ico.style.color = on ? '' : '#ed4956';
    likes += on ? -1 : 1;
    document.getElementById('likesCount').textContent = likes + (likes===1?' like':' likes');
    if(!on){ btn.style.transform='scale(1.35)'; setTimeout(()=>btn.style.transform='',200); }
}

/* ── COMMENTS ── */
let commentsOpen = false;
function toggleComments(){
    commentsOpen = !commentsOpen;
    document.getElementById('commentsSection').style.display = commentsOpen ? 'block' : 'none';
    document.getElementById('toggleComments').textContent = commentsOpen ? 'Hide comments' : 'View all 2 comments';
}
function focusComment(){ document.getElementById('commentInput').focus(); }
function onCommentInput(el){
    document.getElementById('postBtn').classList.toggle('active', el.value.trim().length > 0);
}
function postComment(){
    const inp = document.getElementById('commentInput');
    const txt = inp.value.trim();
    if(!txt) return;
    const sec = document.getElementById('commentsSection');
    if(!commentsOpen){ commentsOpen=true; sec.style.display='block'; }
    const div = document.createElement('div');
    div.className = 'ig-comment';
    div.innerHTML = `
        <div class="ig-avatar-ring"><div class="ig-avatar-inner" style="font-size:10px">Y</div></div>
        <div class="ig-comment-body">
            <span class="u">your_username</span><span class="txt">${txt}</span>
            <div class="ig-comment-meta"><span>Just now</span><button>Reply</button><button class="cheart"><i class="bi bi-heart"></i></button></div>
        </div>`;
    sec.appendChild(div);
    inp.value = '';
    document.getElementById('postBtn').classList.remove('active');
}

/* ── AUDIO ── */
const audio = document.getElementById('hiddenAudio');
if(audio){
    function fmt(s){ const m=Math.floor(s/60); return m+':'+(Math.floor(s%60)+'').padStart(2,'0'); }
    audio.addEventListener('timeupdate',()=>{
        const pct = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
        document.getElementById('audioBar').style.width = pct+'%';
        document.getElementById('curTime').textContent = fmt(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata',()=>{
        document.getElementById('durTime').textContent = fmt(audio.duration);
    });
    audio.addEventListener('ended',()=>{
        document.getElementById('playIco').className='bi bi-play-fill';
    });
}
function toggleAudio(){
    if(!audio) return;
    if(audio.paused){ audio.play(); document.getElementById('playIco').className='bi bi-pause-fill'; }
    else { audio.pause(); document.getElementById('playIco').className='bi bi-play-fill'; }
}
function seekAudio(e){
    if(!audio || !audio.duration) return;
    const rect = document.getElementById('progressBar').getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}
</script>

</body>
</html>

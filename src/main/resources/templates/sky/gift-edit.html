<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chỉnh sửa Sky Ocean Memory</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>


    <style>

        :root {

            --sky-cream: #fcfff9;
            --sky-milk: #f3faee;
            --sky-mist-soft: #e5f2dc;
            --sky-soft: #d2e8c4;

            --sky-blue: #9abd7a;
            --sky-ocean-deep: #6f9850;

            --ink: #40523b;
            --ink-soft: #78906f;

            --white: #ffffff;

        }


        * {

            box-sizing: border-box;

            margin: 0;
            padding: 0;

        }


        html,
        body {

            min-height: 100%;

        }


        body {

            min-height: 100vh;
            min-height: 100dvh;

            background:
                    radial-gradient(
                            ellipse 70% 40% at 78% 6%,
                            rgba(255, 255, 255, 0.55),
                            transparent 60%
                    ),
                    radial-gradient(
                            ellipse 120% 60% at 50% -10%,
                            rgba(154, 189, 122, 0.18),
                            transparent 60%
                    ),
                    radial-gradient(
                            ellipse 90% 50% at 50% 110%,
                            rgba(210, 232, 196, 0.65),
                            transparent 60%
                    ),
                    linear-gradient(
                            180deg,
                            var(--sky-cream),
                            var(--sky-milk) 60%,
                            var(--sky-soft)
                    );

            color: var(--ink);

            font-family: Arial, sans-serif;

            overflow-x: hidden;

        }


        /* =========================================
           SKY CLOUDS
        ========================================= */

        .cloud-field {

            position: fixed;
            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 0;

        }


        .sky-cloud {

            position: absolute;

            top: -40px;

            opacity: 0;

            filter:
                    drop-shadow(
                            0 2px 3px
                            rgba(111, 152, 80, 0.2)
                    );

            animation:
                    cloudFloat linear infinite;

        }


        @keyframes cloudFloat {

            0% {

                opacity: 0;

                transform:
                        translate3d(
                                0,
                                -5vh,
                                0
                        )
                        rotate(0deg);

            }

            10% {

                opacity: 0.85;

            }

            90% {

                opacity: 0.65;

            }

            100% {

                opacity: 0;

                transform:
                        translate3d(
                                var(--drift, 60px),
                                110vh,
                                0
                        )
                        rotate(360deg);

            }

        }


        /* =========================================
           SHELL
        ========================================= */

        .booth-shell {

            width: min(100%, 480px);

            min-height: 100vh;
            min-height: 100dvh;

            margin: 0 auto;

            position: relative;
            z-index: 1;

            border-left:
                    1px solid
                    rgba(154, 189, 122, 0.2);

            border-right:
                    1px solid
                    rgba(154, 189, 122, 0.2);

            display: flex;
            flex-direction: column;

        }


        #giftForm {

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;

        }


        /* =========================================
           TOP BAR
        ========================================= */

        .booth-marquee {

            position: sticky;

            top: 0;

            z-index: 20;

            padding:
                    14px 16px 10px;

            text-align: center;

            background:
                    linear-gradient(
                            180deg,
                            var(--sky-milk),
                            var(--sky-cream) 95%
                    );

            border-bottom:
                    1px solid
                    rgba(154, 189, 122, 0.3);

            box-shadow:
                    0 4px 18px
                    rgba(154, 189, 122, 0.15);

        }


        .bulbs {

            display: flex;

            justify-content: center;

            gap: 8px;

            margin-bottom: 6px;

        }


        .bulb {

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background:
                    var(--sky-blue);

            box-shadow:
                    0 0 6px
                    rgba(154, 189, 122, 0.8);

            animation:
                    bulbPulse 2.4s
                    ease-in-out infinite;

        }


        .bulb:nth-child(odd) {

            animation-delay: 0.3s;

        }


        .bulb:nth-child(3n) {

            animation-delay: 0.6s;

        }


        @keyframes bulbPulse {

            0%,
            100% {

                opacity: 0.9;

                transform:
                        scale(1);

            }

            50% {

                opacity: 0.3;

                transform:
                        scale(0.7);

            }

        }


        .booth-marquee-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .booth-back,
        .booth-done {

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            border: 0;

            background: none;

            cursor: pointer;

            color: var(--ink);

        }


        .booth-back {

            width: 34px;
            height: 34px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 20px;

            border-radius: 50%;

        }


        .booth-back:active {

            background:
                    rgba(154, 189, 122, 0.16);

        }


        .booth-done {

            min-width: 50px;

            font-size: 13px;
            font-weight: 700;

            color: var(--sky-ocean-deep);

        }


        .booth-done:disabled {

            opacity: 0.55;

            cursor: not-allowed;

        }


        .booth-title {

            font-weight: 700;
            font-style: normal;
            font-family: Arial, Helvetica, sans-serif;

            font-size: 21px;

            letter-spacing: 1px;

        }


        .booth-title span {

            color: var(--sky-ocean-deep);

        }


        .booth-tagline {

            margin-top: 4px;

            font-size: 11px;

            color: var(--ink-soft);

        }


        /* =========================================
           LABEL
        ========================================= */

        .booth-label {

            padding:
                    20px 18px 8px;

            color: var(--sky-ocean-deep);

            font-size: 16px;
            font-weight: 700;

            letter-spacing: 0.4px;

        }


        /* =========================================
           PHOTOS
        ========================================= */

        .filmstrip {

            margin:
                    0 12px;

            padding:
                    14px;

            background:
                    rgba(255, 255, 255, 0.58);

            border:
                    1px solid
                    rgba(154, 189, 122, 0.3);

            border-radius: 14px;

            backdrop-filter:
                    blur(3px);

        }


        .ig-photo-grid {

            display: grid;

            grid-template-columns:
                    repeat(3, 1fr);

            gap: 10px;

        }


        .ig-photo-item {

            aspect-ratio: 1;

            position: relative;

            background: #fff;

            padding:
                    5px 5px 9px;

            border-radius: 6px;

            border:
                    1px solid
                    rgba(154, 189, 122, 0.3);

            box-shadow:
                    0 4px 12px
                    rgba(154, 189, 122, 0.22);

        }


        .ig-photo-item:nth-child(6n + 1) {

            transform:
                    rotate(-3deg);

        }


        .ig-photo-item:nth-child(6n + 2) {

            transform:
                    rotate(2deg);

        }


        .ig-photo-item:nth-child(6n + 3) {

            transform:
                    rotate(-1.5deg);

        }


        .ig-photo-item:nth-child(6n + 4) {

            transform:
                    rotate(3deg);

        }


        .ig-photo-item:nth-child(6n + 5) {

            transform:
                    rotate(0deg);

        }


        .ig-photo-item:nth-child(6n + 6) {

            transform:
                    rotate(1.5deg);

        }


        .ig-photo-item img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            border-radius: 3px;

        }


        .del-btn {

            position: absolute;

            top: 5px;
            right: 5px;

            width: 24px;
            height: 24px;

            border: 0;
            border-radius: 50%;

            background:
                    rgba(64, 82, 59, 0.76);

            color: #fff;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

        }


        .ig-add-slot {

            aspect-ratio: 1;

            border:
                    1.5px dashed
                    rgba(154, 189, 122, 0.55);

            border-radius: 6px;

            background:
                    rgba(255, 255, 255, 0.42);

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 6px;

            color: var(--sky-ocean-deep);

            font-size: 11px;
            font-weight: 700;

            cursor: pointer;

        }


        .ig-add-slot i {

            font-size: 23px;

        }


        .filmstrip-hint {

            text-align: center;

            color: var(--ink-soft);

            font-size: 11px;

            padding-top: 10px;

        }


        /* =========================================
           MESSAGE
        ========================================= */

        .caption-card {

            margin:
                    0 16px;

            background:
                    rgba(255, 255, 255, 0.65);

            border:
                    1px solid
                    rgba(154, 189, 122, 0.25);

            border-left:
                    4px solid
                    var(--sky-blue);

            border-radius: 12px;

            padding:
                    16px 18px;

            box-shadow:
                    0 6px 20px
                    rgba(154, 189, 122, 0.18);

        }


        .caption-card textarea {

            width: 100%;

            min-height: 120px;

            border: 0;

            outline: 0;

            resize: none;

            background:
                    transparent;

            color:
                    var(--ink);

            font-family: Arial, sans-serif;

            font-size: 20px;
            font-weight: 600;

            line-height: 1.45;

        }


        .caption-card textarea::placeholder {

            color:
                    rgba(64, 82, 59, 0.4);

            font-family: Arial, sans-serif;

            font-size: 14px;

            font-weight: 400;

        }


        .ig-charcount {

            text-align: right;

            padding:
                    5px 20px 0;

            color:
                    var(--ink-soft);

            font-size: 10.5px;

        }


        /* =========================================
           AUDIO
        ========================================= */

        .tape-unit {

            margin:
                    12px 16px 0;

            padding:
                    16px;

            border:
                    1px solid
                    rgba(154, 189, 122, 0.3);

            border-radius: 14px;

            background:
                    rgba(255, 255, 255, 0.62);

            display: flex;

            align-items: center;

            gap: 14px;

        }


        .tape-reels {

            display: flex;

            gap: 8px;

            flex-shrink: 0;

        }


        .reel {

            width: 30px;
            height: 30px;

            border-radius: 50%;

            background:
                    radial-gradient(
                            circle at 35% 30%,
                            #fff,
                            var(--sky-blue) 58%,
                            var(--sky-ocean-deep)
                    );

            border:
                    2px solid
                    rgba(255, 255, 255, 0.65);

        }


        .reel.spin {

            animation:
                    reelSpin 1s linear infinite;

        }


        @keyframes reelSpin {

            to {

                transform:
                        rotate(360deg);

            }

        }


        .tape-controls {

            flex: 1;

            min-width: 0;

        }


        .tape-play-row {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .tape-play-btn {

            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 50%;

            background:
                    linear-gradient(
                            135deg,
                            var(--sky-blue),
                            var(--sky-ocean-deep)
                    );

            color: #fff;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

        }


        .tape-progress-wrap {

            flex: 1;

            min-width: 0;

        }


        .tape-progress {

            width: 100%;
            height: 4px;

            border-radius: 2px;

            background:
                    rgba(154, 189, 122, 0.22);

            cursor: pointer;

            position: relative;

        }


        .tape-progress-bar {

            width: 0%;
            height: 100%;

            border-radius: 2px;

            background:
                    var(--sky-ocean-deep);

            pointer-events: none;

        }


        .tape-times {

            display: flex;

            justify-content: space-between;

            margin-top: 4px;

            color:
                    var(--ink-soft);

            font-size: 10px;

        }


        .tape-remove {

            border: 0;

            background: none;

            color:
                    var(--ink-soft);

            font-size: 17px;

            cursor: pointer;

        }


        .tape-remove:hover {

            color:
                    #d94c68;

        }


        #hiddenOldAudio,
        #audioPreview {

            display: none;

        }


        .voice-row {

            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

            padding:
                    4px 16px;

        }


        .pill-btn,
        .pill-upload {

            display: flex;

            align-items: center;

            gap: 7px;

            border:
                    1px solid
                    rgba(154, 189, 122, 0.45);

            border-radius: 22px;

            padding:
                    9px 14px;

            background:
                    rgba(255, 255, 255, 0.58);

            color:
                    var(--ink);

            font-family: Arial, sans-serif;

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;

        }


        .pill-btn.recording {

            border-color:
                    #e05050;

            color:
                    #d83c52;

            animation:
                    recordingPulse 1.2s
                    ease infinite;

        }


        @keyframes recordingPulse {

            50% {

                opacity: 0.55;

            }

        }


        #recStatus {

            color:
                    var(--ink-soft);

            font-size: 11px;

        }


        #recStatus.active {

            color:
                    #d83c52;

        }


        /* =========================================
           SAVE BAR
        ========================================= */

        .booth-bottom-bar {

            position: sticky;

            bottom: 0;

            z-index: 10;

            margin-top: auto;

            padding:
                    14px 16px 18px;

            background:
                    linear-gradient(
                            180deg,
                            transparent,
                            var(--sky-cream) 38%
                    );

        }


        .booth-save-btn {

            width: 100%;

            border:
                    1px solid
                    rgba(154, 189, 122, 0.5);

            border-radius: 12px;

            padding:
                    14px;

            background:
                    linear-gradient(
                            135deg,
                            var(--sky-blue),
                            var(--sky-ocean-deep)
                    );

            color: #fff;

            font-size: 17px;
            font-weight: 700;
            font-style: normal;
            font-family: Arial, Helvetica, sans-serif;

            cursor: pointer;

            box-shadow:
                    0 7px 20px
                    rgba(154, 189, 122, 0.35);

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

        }


        .booth-save-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

        }


        .booth-save-btn.saving {

            background:
                    #b68f9d;

            box-shadow:
                    none;

        }


        .booth-save-btn.done {

            background:
                    linear-gradient(
                            135deg,
                            #7fd8c0,
                            #3ba889
                    );

        }


        @media (
            prefers-reduced-motion: reduce
        ) {

            *,
            *::before,
            *::after {

                animation-duration:
                        0.01ms !important;

                animation-iteration-count:
                        1 !important;

                transition-duration:
                        0.01ms !important;

            }

        }

    
/* =========================================
   EXTRA SKY–OCEAN AMBIENT EFFECTS
========================================= */
body::before,
body::after {
    content: "";
    position: fixed;
    z-index: 0;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(10px);
    opacity: 0.72;
}

body::before {
    width: 260px;
    height: 260px;
    top: 8%;
    left: -110px;
    background:
        radial-gradient(circle at 35% 35%,
            rgba(255,255,255,0.95) 0 18%,
            rgba(203,228,186,0.42) 42%,
            transparent 72%);
    animation: skyOrbLeft 10s ease-in-out infinite alternate;
}

body::after {
    width: 310px;
    height: 310px;
    right: -145px;
    bottom: 5%;
    background:
        radial-gradient(circle at 45% 40%,
            rgba(255,255,255,0.92) 0 16%,
            rgba(154,189,122,0.34) 40%,
            transparent 72%);
    animation: skyOrbRight 12s ease-in-out infinite alternate;
}

@keyframes skyOrbLeft {
    from { transform: translate3d(0, 0, 0) scale(0.94); }
    to   { transform: translate3d(42px, 55px, 0) scale(1.08); }
}

@keyframes skyOrbRight {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(-48px, -38px, 0) scale(1.1); }
}

.booth-shell::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1.5px, transparent 2px),
        radial-gradient(circle, rgba(154,189,122,.35) 0 1px, transparent 1.7px);
    background-size: 54px 54px, 76px 76px;
    background-position: 0 0, 20px 30px;
    opacity: .42;
    animation: skySparkleDrift 18s linear infinite;
}

@keyframes skySparkleDrift {
    from { background-position: 0 0, 20px 30px; }
    to   { background-position: 54px 108px, -56px 106px; }
}


/* ===== FINAL SKY OCEAN OVERRIDES ===== */
:root{
  --sky-cream:#fffef9;
  --sky-milk:#f7fbf1;
  --sky-mist-soft:#edf5e5;
  --sky-soft:#dbeacb;
  --sky-blue:#a8c98d;
  --sky-ocean-deep:#64834f;
}
body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#fffefb 0%,#f8fbf4 52%,#edf5e5 100%);}
.booth-marquee{background:rgba(255,255,251,.94);backdrop-filter:blur(14px);}
.booth-title,.booth-tagline,.booth-label,.field-label,.hint,.save-btn,.booth-done,button,input,textarea{font-family:Arial,sans-serif;}
.sky-cloud{filter:drop-shadow(0 2px 3px rgba(100,131,79,.16));}


/* =========================================================
   SKY & OCEAN MEMORY THEME
   Giữ nguyên chức năng, chỉ thay phần nhìn và hiệu ứng.
========================================================= */
:root{
  --sky-white:#ffffff;
  --sky-mist:#effaff;
  --sky-light:#cdefff;
  --sky:#8ed8ff;
  --sky-deep:#42a9e8;
  --ocean:#2e9ddd;
  --ocean-deep:#0871b5;
  --ocean-dark:#075985;
  --foam:#f7fdff;
  --sun:#fff4b8;
  --ink:#123e5d;
  --ink-soft:#5d86a0;

  /* Tương thích các tên biến cũ trong file */
  --sky-bg-1:var(--sky-white);
  --sky-bg-2:var(--sky-mist);
  --sky-bg-3:var(--sky-light);
  --sky-mid:var(--sky);
  --sky-accent:var(--sky-deep);
  --sky-deep:var(--ocean-deep);
  --sky-sun:var(--sun);

  --sky-cream:var(--sky-white);
  --sky-milk:var(--sky-mist);
  --sky-mist-soft:var(--sky-light);
  --sky-soft:var(--sky);
  --sky-blue:var(--sky-deep);
  --sky-ocean-deep:var(--ocean-deep);
  --latte-foam:var(--foam);
}

html,body,button,input,textarea,select{
  font-family:Arial,Helvetica,sans-serif !important;
}

body{
  position:relative;
  isolation:isolate;
  color:var(--ink) !important;
  background:
    radial-gradient(circle at 78% 9%,rgba(255,244,184,.95) 0 34px,rgba(255,244,184,.35) 35px 58px,transparent 60px),
    linear-gradient(180deg,#eefbff 0%,#ccefff 25%,#91d9fb 57%,#4bb8ed 76%,#1689cf 100%) !important;
  background-attachment:fixed !important;
}

/* Xóa hoàn toàn cảm giác lá/cánh hoa cũ */
.cloud,.sky-cloud,.sky-cloud,.star-twinkle,.shooting-star{
  display:none !important;
}

/* Ánh nắng và bụi sáng trên trời */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-5;
  pointer-events:none;
  border-radius:0;
  filter:none;
  opacity:.72;
  background:
    radial-gradient(circle at 15% 16%,rgba(255,255,255,.95) 0 2px,transparent 3px),
    radial-gradient(circle at 70% 29%,rgba(255,255,255,.75) 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 42% 43%,rgba(255,255,255,.72) 0 1px,transparent 2px);
  background-size:92px 92px,126px 126px,74px 74px;
  animation:skySparkles 18s linear infinite;
}

body::after{
  content:"";
  position:fixed;
  left:-15%;
  right:-15%;
  bottom:-70px;
  height:230px;
  z-index:-3;
  pointer-events:none;
  border-radius:48% 52% 0 0 / 18% 22% 0 0;
  filter:none;
  opacity:1;
  background:
    radial-gradient(ellipse at 50% 0,rgba(255,255,255,.92) 0 7%,transparent 8%),
    repeating-radial-gradient(ellipse at 50% 120%,rgba(255,255,255,.36) 0 5px,transparent 6px 25px),
    linear-gradient(180deg,rgba(64,184,238,.88),rgba(8,113,181,.98));
  box-shadow:0 -14px 30px rgba(255,255,255,.3);
  animation:oceanBreathe 7s ease-in-out infinite alternate;
}

@keyframes skySparkles{
  from{background-position:0 0,20px 15px,10px 35px}
  to{background-position:92px 184px,-106px 141px,84px 183px}
}

@keyframes oceanBreathe{
  from{transform:translate3d(-1.5%,8px,0) scaleX(1.02)}
  to{transform:translate3d(1.5%,-5px,0) scaleX(1.07)}
}

/* Lớp mây và sóng trang trí */
.sky-ocean-scene{
  position:fixed;
  inset:0;
  z-index:-4;
  overflow:hidden;
  pointer-events:none;
}

.sky-cloud{
  position:absolute;
  width:108px;
  height:34px;
  border-radius:999px;
  background:rgba(255,255,255,.88);
  box-shadow:
    25px -17px 0 5px rgba(255,255,255,.9),
    58px -7px 0 1px rgba(255,255,255,.86),
    0 9px 22px rgba(42,137,190,.12);
  animation:cloudDrift linear infinite;
}

.sky-cloud.c1{top:12%;left:-170px;transform:scale(.72);animation-duration:34s}
.sky-cloud.c2{top:29%;left:-210px;transform:scale(1.05);animation-duration:48s;animation-delay:-15s;opacity:.72}
.sky-cloud.c3{top:48%;left:-160px;transform:scale(.56);animation-duration:39s;animation-delay:-27s;opacity:.62}

@keyframes cloudDrift{
  from{margin-left:0}
  to{margin-left:calc(100vw + 330px)}
}

.ocean-wave{
  position:absolute;
  left:-15%;
  width:130%;
  height:115px;
  bottom:-37px;
  border-radius:50% 50% 0 0 / 30% 30% 0 0;
  transform-origin:center bottom;
}

.ocean-wave.w1{

.ocean-wave.w2{

@keyframes waveMove1{

}
@keyframes waveMove2{
  from{transform:translateX(2%) scaleY(.92)}
  to{transform:translateX(-2%) scaleY(1.08)}

/* =========================================================
   OCEAN DIARY UI OVERRIDE
   CHỈ ĐỔI GIAO DIỆN — KHÔNG ĐỔI ID, API, UID, JAVASCRIPT
========================================================= */

:root{
    --diary-sky:#dff5ff;
    --diary-sky-2:#a9ddf6;
    --diary-sea:#4eafe0;
    --diary-deep:#0b6da8;
    --diary-ink:#16435f;
    --diary-soft:#6a91a7;
    --diary-paper:#fffdf8;
    --diary-glass:rgba(255,255,255,.72);
    --diary-line:rgba(13,109,168,.16);
    --diary-shadow:0 20px 50px rgba(10,91,143,.18);
}

html,
body,
button,
input,
textarea,
select{
    font-family:Arial,Helvetica,sans-serif !important;
}

body{
    background:
        radial-gradient(circle at 82% 7%,rgba(255,244,181,.96) 0 34px,rgba(255,244,181,.28) 35px 64px,transparent 65px),
        linear-gradient(180deg,#effbff 0%,var(--diary-sky) 28%,var(--diary-sky-2) 58%,var(--diary-sea) 82%,var(--diary-deep) 100%) !important;
    color:var(--diary-ink) !important;
    background-attachment:fixed !important;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;
    opacity:.58;
    background:
        radial-gradient(circle,rgba(255,255,255,.9) 0 1.5px,transparent 2px) 0 0/72px 72px,
        radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.7px) 22px 38px/94px 94px;
    animation:diarySparkles 20s linear infinite;
}

body::after{
    content:"";
    position:fixed;
    left:-15%;
    right:-15%;
    bottom:-86px;
    height:220px;
    z-index:-4;
    pointer-events:none;
    border-radius:48% 52% 0 0/22% 26% 0 0;
    background:
        radial-gradient(ellipse at 50% 0,rgba(255,255,255,.86) 0 7%,transparent 8%),
        repeating-radial-gradient(ellipse at 50% 120%,rgba(255,255,255,.22) 0 5px,transparent 6px 26px),
        linear-gradient(180deg,#39aee3,#0875ba);
    animation:diaryOcean 7s ease-in-out infinite alternate;
}

@keyframes diarySparkles{
    to{background-position:72px 144px,-72px 132px}
}

@keyframes diaryOcean{
    from{transform:translateX(-2%) translateY(8px) scaleX(1.02)}
    to{transform:translateX(2%) translateY(-7px) scaleX(1.08)}
}

.sky-ocean-scene{
    display:block !important;
}

.sky-cloud{
    display:block !important;
    position:absolute;
    width:105px;
    height:32px;
    border-radius:999px;
    background:rgba(255,255,255,.76);
    box-shadow:
        26px -16px 0 4px rgba(255,255,255,.79),
        57px -7px 0 1px rgba(255,255,255,.72);
    animation:diaryCloud linear infinite !important;
}

.sky-cloud.c1{top:12%;left:-180px;animation-duration:34s !important}
.sky-cloud.c2{top:29%;left:-220px;animation-duration:46s !important;animation-delay:-14s !important}
.sky-cloud.c3{top:49%;left:-170px;animation-duration:39s !important;animation-delay:-25s !important}

@keyframes diaryCloud{
    to{margin-left:calc(100vw + 340px)}
}

.ocean-wave{
    opacity:.28;
}

.cloud-field{
    display:none !important;
}

.booth-shell{
    width:min(100%,520px) !important;
    border:0 !important;
    padding-bottom:20px;
}

.booth-marquee{
    margin:14px 12px 0;
    padding:13px 14px 15px !important;
    border:1px solid rgba(255,255,255,.7) !important;
    border-radius:24px !important;
    background:rgba(248,253,255,.75) !important;
    backdrop-filter:blur(18px) saturate(1.15) !important;
    -webkit-backdrop-filter:blur(18px) saturate(1.15) !important;
    box-shadow:0 14px 34px rgba(8,102,160,.15) !important;
}

.bulbs{
    display:none !important;
}

.booth-marquee-row{
    gap:12px;
}

.booth-back{
    width:42px !important;

    background:rgba(255,255,255,.72) !important;
    box-shadow:0 8px 20px rgba(10,94,146,.12);
    color:var(--diary-ink) !important;
}

.booth-title{
    flex:1;
    font-size:20px !important;
    letter-spacing:.4px !important;
    color:var(--diary-ink) !important;
}

.booth-title span{
    color:var(--diary-deep) !important;
}

.booth-done{
    min-width:64px !important;
    padding:10px 14px !important;
    border-radius:999px !important;
    background:rgba(255,255,255,.7) !important;
    box-shadow:0 8px 20px rgba(10,94,146,.12);
    color:var(--diary-deep) !important;
}

.booth-tagline{
    margin-top:7px !important;
    color:var(--diary-soft) !important;
    font-size:12px !important;
}

.booth-label{
    padding:25px 18px 10px !important;
    color:var(--diary-ink) !important;
    font-size:15px !important;
    letter-spacing:0 !important;
}

.booth-label::before{
    content:"";
    display:inline-block;
    width:8px;
    height:8px;
    margin-right:9px;
    border-radius:50%;
    background:linear-gradient(135deg,#75d5f5,var(--diary-deep));
    box-shadow:0 0 0 5px rgba(92,190,232,.15);
}

.filmstrip{
    margin:0 12px !important;
    padding:13px !important;
    border:1px solid rgba(255,255,255,.72) !important;
    border-radius:26px !important;
    background:var(--diary-glass) !important;
    backdrop-filter:blur(18px) !important;
    -webkit-backdrop-filter:blur(18px) !important;
    box-shadow:var(--diary-shadow) !important;
}

.ig-photo-grid{
    grid-template-columns:repeat(2,1fr) !important;
    gap:11px !important;
}

.ig-photo-item{
    aspect-ratio:4/5 !important;
    padding:7px 7px 26px !important;
    border-radius:8px 8px 20px 8px !important;
    border:1px solid rgba(13,109,168,.14) !important;
    background:#fffdf8 !important;
    box-shadow:0 12px 27px rgba(9,92,144,.17) !important;
    transform:none !important;
}

.ig-photo-item:nth-child(odd){
    transform:rotate(-1deg) !important;
}

.ig-photo-item:nth-child(even){
    transform:rotate(1deg) !important;
}

.ig-photo-item img{
    border-radius:5px 5px 14px 5px !important;
}

.del-btn{
    top:10px !important;
    right:10px !important;
    width:30px !important;
    height:30px !important;
    background:rgba(8,58,88,.72) !important;
    backdrop-filter:blur(8px);
}

.ig-add-slot{
    aspect-ratio:4/5 !important;
    border:2px dashed rgba(13,109,168,.28) !important;
    border-radius:8px 8px 20px 8px !important;
    background:rgba(255,255,255,.45) !important;
    color:var(--diary-deep) !important;
    font-size:12px !important;
}

.ig-add-slot i{
    font-size:30px !important;
}

.filmstrip-hint{
    padding-top:13px !important;
    color:var(--diary-soft) !important;
}

/* Lá thư giấy trơn, không đường gạch ngang */
.caption-card{
    position:relative;
    margin:0 14px !important;
    padding:24px 20px 20px !important;
    border:1px solid rgba(255,255,255,.78) !important;
    border-left:0 !important;
    border-radius:10px 30px 10px 30px !important;
    background:var(--diary-paper) !important;
    box-shadow:0 18px 38px rgba(9,88,137,.17) !important;
    transform:rotate(-.35deg);
}

.caption-card::before{
    content:"";
    position:absolute;
    width:74px;
    height:22px;
    left:50%;
    top:-10px;
    transform:translateX(-50%) rotate(2deg);
    background:rgba(255,236,177,.72);
    box-shadow:0 3px 8px rgba(126,95,30,.08);
}

.caption-card textarea{
    min-height:165px !important;
    font-size:18px !important;
    font-weight:500 !important;
    line-height:1.65 !important;
    color:var(--diary-ink) !important;
}

.caption-card textarea::placeholder{

    font-size:14px !important;
}

.ig-charcount{
    padding:8px 23px 0 !important;
    color:var(--diary-soft) !important;
}

.tape-unit{
    margin:10px 14px 0 !important;
    padding:16px !important;
    border:1px solid rgba(255,255,255,.72) !important;
    border-radius:25px !important;
    background:var(--diary-glass) !important;
    box-shadow:var(--diary-shadow) !important;
    backdrop-filter:blur(16px) !important;
}

.tape-reels{
    position:relative;
    width:58px;
    height:76px;
    border:3px solid rgba(13,109,168,.25);
    border-radius:17px 17px 24px 24px;
    background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(92,191,232,.18));
    transform:rotate(-5deg);
    display:grid !important;
    place-items:center;
}

.tape-reels::before{
    content:"♫";
    font-size:24px;
    color:var(--diary-deep);
}

.reel{
    display:none !important;
}

.tape-play-btn{
    background:linear-gradient(135deg,#48bde9,var(--diary-deep)) !important;
    box-shadow:0 9px 22px rgba(10,104,163,.25);
}

.tape-progress{
    height:7px !important;
    border-radius:999px !important;
    background:rgba(13,109,168,.13) !important;
}

.tape-progress-bar{
    border-radius:999px !important;
    background:linear-gradient(90deg,#6ed7f5,var(--diary-deep)) !important;
}

.voice-row{
    margin:0 14px !important;
    padding:14px !important;
    border:1px solid rgba(255,255,255,.72) !important;
    border-radius:22px !important;
    background:var(--diary-glass) !important;
    box-shadow:0 14px 32px rgba(9,90,142,.14) !important;
    backdrop-filter:blur(16px) !important;
}

.pill-btn,
.pill-upload{
    border:1px solid rgba(13,109,168,.2) !important;
    background:rgba(255,255,255,.72) !important;
    color:var(--diary-ink) !important;
    box-shadow:none !important;
}

.booth-bottom-bar{
    padding:16px 14px 20px !important;
    background:linear-gradient(180deg,transparent,rgba(232,248,255,.92) 36%) !important;
}

.booth-save-btn{
    border:0 !important;
    border-radius:22px !important;
    padding:16px !important;
    background:linear-gradient(135deg,#43bbe8,#086cae) !important;
    box-shadow:0 15px 34px rgba(5,91,148,.32) !important;
}

.booth-save-btn:active{

}

@media(max-width:430px){
    .booth-shell{
        width:100% !important;
    }

    .ig-photo-grid{

        padding:6px 6px 22px !important;
    }

        font-size:18px !important;
    }

</style>

<body>

<div class="sky-ocean-scene" aria-hidden="true">
  <span class="sky-cloud c1"></span>
  <span class="sky-cloud c2"></span>
  <span class="sky-cloud c3"></span>
  <span class="ocean-wave w1"></span>
  <span class="ocean-wave w2"></span>
  <span class="ocean-wave w3"></span>
</div>



<div class="cloud-field"
     id="cloudField"
     aria-hidden="true">
</div>


<div class="booth-shell">


    <form id="giftForm">

        <!-- UID -->
        <input type="hidden"
               id="uid"
               th:value="${nfcUid}">

        <!-- Theme -->
        <input type="hidden"
               id="theme"
               th:value="${gift.theme}">


        <!-- =========================================
             TOP BAR
        ========================================== -->

        <div class="booth-marquee">

            <div class="bulbs">

                <span class="bulb"></span>
                <span class="bulb"></span>
                <span class="bulb"></span>
                <span class="bulb"></span>
                <span class="bulb"></span>
                <span class="bulb"></span>
                <span class="bulb"></span>

            </div>


            <div class="booth-marquee-row">

                <button class="booth-back"
                        type="button"
                        onclick="history.back()">

                    <i class="bi bi-x-lg"></i>

                </button>


                <span class="booth-title">

                    SKY
                    <span>OCEAN</span>

                </span>


                <button class="booth-done"
                        type="button"
                        id="topSaveBtn">

                    Lưu

                </button>

            </div>


            <div class="booth-tagline">

                — chỉnh lại ký ức giữa trời và biển —

            </div>

        </div>


        <!-- =========================================
             PHOTOS
        ========================================== -->

        <div class="booth-label">

            Ảnh của bạn

        </div>


        <div class="filmstrip">

            <div class="ig-photo-grid"
                 id="previewContainer">


                <!-- ẢNH CŨ -->

                <div class="ig-photo-item"
                     th:each="img : ${gift.images}">

                    <img th:src="@{'/files/images/' + ${img.imageUrl}}"
                         alt="Ảnh Gift">

                    <button type="button"
                            class="del-btn old-image"
                            th:data-url="${img.imageUrl}"
                            aria-label="Xóa ảnh">

                        <i class="bi bi-x"></i>

                    </button>

                </div>


                <!-- NÚT THÊM ẢNH -->

                <div class="ig-add-slot"
                     id="addSlot"
                     role="button"
                     tabindex="0">

                    <i class="bi bi-plus-lg"></i>

                    <span>Thêm ảnh</span>

                </div>

            </div>


            <div class="filmstrip-hint">

                tối đa 9 ảnh — chạm dấu × để xóa

            </div>

        </div>


        <input type="file"
               id="imageInput"
               accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif"
               multiple
               hidden>


        <!-- =========================================
             MESSAGE
        ========================================== -->

        <div class="booth-label">

            Lời nhắn

        </div>


        <div class="caption-card">

            <textarea id="message"
                      placeholder="Viết một dòng chú thích…"
                      maxlength="2200"
                      th:text="${gift.message}"></textarea>

        </div>


        <div class="ig-charcount">

            <span id="cCount">0</span>
            / 2.200

        </div>


        <!-- =========================================
             OLD AUDIO
        ========================================== -->

        <div id="oldAudioBox"
             th:if="${gift.voiceUrl != null and gift.voiceUrl != ''}">


            <div class="booth-label">

                Ghi âm hiện tại

            </div>


            <div class="tape-unit">

                <div class="tape-reels">

                    <div class="reel"
                         id="oldReelL">
                    </div>

                    <div class="reel"
                         id="oldReelR">
                    </div>

                </div>


                <div class="tape-controls">

                    <div class="tape-play-row">

                        <button type="button"
                                class="tape-play-btn"
                                id="oldPlayBtn">

                            <i class="bi bi-play-fill"
                               id="oldPlayIco">
                            </i>

                        </button>


                        <div class="tape-progress-wrap">

                            <div class="tape-progress"
                                 id="oldProgressBar">

                                <div class="tape-progress-bar"
                                     id="oldBar">
                                </div>

                            </div>


                            <div class="tape-times">

                                <span id="oldCur">
                                    0:00
                                </span>

                                <span id="oldDur">
                                    0:00
                                </span>

                            </div>

                        </div>

                    </div>

                </div>


                <button type="button"
                        class="tape-remove"
                        id="removeOldAudioBtn"
                        aria-label="Xóa audio cũ">

                    <i class="bi bi-trash"></i>

                </button>

            </div>


            <audio id="hiddenOldAudio"
                   preload="metadata">

                <source th:src="@{'/files/audio/' + ${gift.voiceUrl}}">

            </audio>

        </div>


        <!-- =========================================
             NEW AUDIO
        ========================================== -->

        <div class="booth-label">

            Lời nhắn bằng giọng nói

        </div>


        <div class="voice-row">

            <button type="button"
                    class="pill-btn"
                    id="recordBtn">

                <i class="bi bi-mic"
                   id="recIco">
                </i>

                <span id="recLabel">

                    Ghi âm

                </span>

            </button>


            <label class="pill-upload"
                   for="audioInput">

                <i class="bi bi-upload"></i>

                Tải lên

            </label>


            <span id="recStatus"></span>


            <input type="file"
                   id="audioInput"
                   accept="audio/*"
                   hidden>

        </div>


        <div class="tape-unit"
             id="newAudioWrap"
             style="display: none;">


            <div class="tape-reels">

                <div class="reel"
                     id="newReelL">
                </div>

                <div class="reel"
                     id="newReelR">
                </div>

            </div>


            <div class="tape-controls">

                <div class="tape-play-row">

                    <button type="button"
                            class="tape-play-btn"
                            id="newPlayBtn">

                        <i class="bi bi-play-fill"
                           id="newPlayIco">
                        </i>

                    </button>


                    <div class="tape-progress-wrap">

                        <div class="tape-progress"
                             id="newProgressBar">

                            <div class="tape-progress-bar"
                                 id="newBar">
                            </div>

                        </div>


                        <div class="tape-times">

                            <span id="newCur">
                                0:00
                            </span>

                            <span id="newDur">
                                0:00
                            </span>

                        </div>

                    </div>

                </div>

            </div>


            <button type="button"
                    class="tape-remove"
                    id="removeNewAudioBtn"
                    aria-label="Xóa audio mới">

                <i class="bi bi-trash"></i>

            </button>

        </div>


        <audio id="audioPreview"
               preload="metadata">
        </audio>


        <!-- =========================================
             SAVE
        ========================================== -->

        <div class="booth-bottom-bar">

            <button class="booth-save-btn"
                    type="submit"
                    id="saveBtn">

                <i class="bi bi-check-lg"
                   id="saveIco">
                </i>

                <span id="saveLbl">

                    Lưu thay đổi

                </span>

            </button>

        </div>

    </form>

</div>


<script>

    /* =========================================
       STATE
    ========================================= */

    let newImages = [];

    let deletedImages = [];

    let newAudio = null;

    let removeOldAudio = false;

    let isSaving = false;

    let recorder = null;

    let recordedChunks = [];

    let microphoneStream = null;

    let newAudioObjectUrl = null;


    /* =========================================
       ELEMENTS
    ========================================= */

    const giftForm =
        document.getElementById("giftForm");

    const uidInput =
        document.getElementById("uid");

    const themeInput =
        document.getElementById("theme");

    const previewContainer =
        document.getElementById("previewContainer");

    const addSlot =
        document.getElementById("addSlot");

    const imageInput =
        document.getElementById("imageInput");

    const messageInput =
        document.getElementById("message");

    const countElement =
        document.getElementById("cCount");

    const oldAudio =
        document.getElementById("hiddenOldAudio");

    const oldAudioBox =
        document.getElementById("oldAudioBox");

    const newAudioElement =
        document.getElementById("audioPreview");

    const newAudioWrap =
        document.getElementById("newAudioWrap");

    const audioInput =
        document.getElementById("audioInput");

    const recordBtn =
        document.getElementById("recordBtn");

    const recordLabel =
        document.getElementById("recLabel");

    const recordIcon =
        document.getElementById("recIco");

    const recordStatus =
        document.getElementById("recStatus");

    const saveBtn =
        document.getElementById("saveBtn");

    const topSaveBtn =
        document.getElementById("topSaveBtn");

    const saveLabel =
        document.getElementById("saveLbl");

    const saveIcon =
        document.getElementById("saveIco");


    /* =========================================
       SKY CLOUDS
    ========================================= */

    (function createSkyClouds() {

        const field =
            document.getElementById("cloudField");


        const reducedMotion =
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;


        const totalLeaves =
            reducedMotion ? 12 : 32;


        for (
            let index = 0;
            index < totalLeaves;
            index++
        ) {

            const cloud =
                document.createElement("span");


            cloud.className =
                "sky-cloud";


            cloud.textContent =
                Math.random() > 0.35
                    ? "☁️"
                    : "·";


            cloud.style.left =
                Math.random() * 100 + "vw";


            cloud.style.fontSize =
                8 + Math.random() * 11 + "px";


            cloud.style.setProperty(
                "--drift",
                -80 + Math.random() * 160 + "px"
            );


            cloud.style.animationDuration =
                7 + Math.random() * 9 + "s";


            cloud.style.animationDelay =
                Math.random() * 10 + "s";


            field.appendChild(cloud);
        }

    })();


    /* =========================================
       UID
    ========================================= */

    function getUid() {

        const modelUid =
            uidInput?.value?.trim();


        if (modelUid) {

            return modelUid;
        }


        return new URLSearchParams(
            window.location.search
        )
            .get("uid")
            ?.trim() || "";
    }


    const uid =
        getUid();


    if (!uid) {

        alert(
            "Không tìm thấy UID NFC."
        );

        saveBtn.disabled =
            true;

        topSaveBtn.disabled =
            true;
    }


    /* =========================================
       MESSAGE COUNT
    ========================================= */

    function updateMessageCount() {

        countElement.textContent =
            messageInput.value.length;
    }


    messageInput.addEventListener(
        "input",
        updateMessageCount
    );


    updateMessageCount();


    /* =========================================
       OLD IMAGES
    ========================================= */

    document
        .querySelectorAll(".old-image")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const imageUrl =
                        button.dataset.url;


                    if (
                        imageUrl &&
                        !deletedImages.includes(
                            imageUrl
                        )
                    ) {

                        deletedImages.push(
                            imageUrl
                        );
                    }


                    button
                        .closest(".ig-photo-item")
                        ?.remove();


                    updateAddSlot();
                }
            );

        });


    /* =========================================
       NEW IMAGES
    ========================================= */

    addSlot.addEventListener(
        "click",
        () => {

            imageInput.click();
        }
    );


    addSlot.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                imageInput.click();
            }

        }
    );


    imageInput.addEventListener(
        "change",
        function () {

            const currentCount =
                previewContainer
                    .querySelectorAll(
                        ".ig-photo-item"
                    )
                    .length;


            const remainingSlots =
                9 - currentCount;


            const files =
                Array.from(this.files);


            if (
                files.length >
                remainingSlots
            ) {

                alert(
                    "Bạn chỉ được giữ tối đa 9 ảnh."
                );
            }


            files
                .slice(0, remainingSlots)
                .forEach(addNewImage);


            this.value = "";
        }
    );


    function addNewImage(file) {

        if (
            !file.type.startsWith("image/")
        ) {

            return;
        }


        newImages.push(file);


        const reader =
            new FileReader();


        reader.addEventListener(
            "load",
            event => {

                const wrapper =
                    document.createElement("div");


                wrapper.className =
                    "ig-photo-item";


                const image =
                    document.createElement("img");


                image.src =
                    event.target.result;


                image.alt =
                    "Ảnh mới";


                const removeButton =
                    document.createElement("button");


                removeButton.type =
                    "button";


                removeButton.className =
                    "del-btn";


                removeButton.innerHTML =
                    '<i class="bi bi-x"></i>';


                removeButton.addEventListener(
                    "click",
                    () => {

                        const index =
                            newImages
                                .indexOf(file);


                        if (
                            index !== -1
                        ) {

                            newImages.splice(
                                index,
                                1
                            );
                        }


                        wrapper.remove();

                        updateAddSlot();
                    }
                );


                wrapper.appendChild(image);

                wrapper.appendChild(
                    removeButton
                );


                previewContainer.insertBefore(
                    wrapper,
                    addSlot
                );


                updateAddSlot();
            }
        );


        reader.addEventListener(
            "error",
            () => {

                const index =
                    newImages
                        .indexOf(file);


                if (
                    index !== -1
                ) {

                    newImages.splice(
                        index,
                        1
                    );
                }


                alert(
                    "Không thể đọc ảnh: " +
                    file.name
                );
            }
        );


        reader.readAsDataURL(file);
    }


    function updateAddSlot() {

        const count =
            previewContainer
                .querySelectorAll(
                    ".ig-photo-item"
                )
                .length;


        addSlot.style.display =
            count >= 9
                ? "none"
                : "flex";
    }


    updateAddSlot();


    /* =========================================
       TIME FORMAT
    ========================================= */

    function formatTime(seconds) {

        if (
            !Number.isFinite(seconds)
        ) {

            return "0:00";
        }


        const minutes =
            Math.floor(seconds / 60);


        const remainingSeconds =
            Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");


        return (
            minutes +
            ":" +
            remainingSeconds
        );
    }


    /* =========================================
       OLD AUDIO PLAYER
    ========================================= */

    if (oldAudio) {

        oldAudio.addEventListener(
            "loadedmetadata",
            () => {

                document
                    .getElementById("oldDur")
                    .textContent =
                    formatTime(
                        oldAudio.duration
                    );
            }
        );


        oldAudio.addEventListener(
            "timeupdate",
            () => {

                const percentage =
                    oldAudio.duration
                        ? (
                            oldAudio.currentTime /
                            oldAudio.duration
                        ) * 100
                        : 0;


                document
                    .getElementById("oldBar")
                    .style
                    .width =
                    percentage + "%";


                document
                    .getElementById("oldCur")
                    .textContent =
                    formatTime(
                        oldAudio.currentTime
                    );
            }
        );


        oldAudio.addEventListener(
            "play",
            () => {

                document
                    .getElementById("oldPlayIco")
                    .className =
                    "bi bi-pause-fill";


                document
                    .getElementById("oldReelL")
                    ?.classList
                    .add("spin");


                document
                    .getElementById("oldReelR")
                    ?.classList
                    .add("spin");
            }
        );


        oldAudio.addEventListener(
            "pause",
            resetOldAudioVisual
        );


        oldAudio.addEventListener(
            "ended",
            resetOldAudioVisual
        );


        document
            .getElementById("oldPlayBtn")
            ?.addEventListener(
                "click",
                async () => {

                    if (
                        oldAudio.paused
                    ) {

                        pauseNewAudio();

                        try {

                            await oldAudio.play();

                        } catch (error) {

                            console.error(error);
                        }

                    } else {

                        oldAudio.pause();
                    }

                }
            );


        document
            .getElementById("oldProgressBar")
            ?.addEventListener(
                "click",
                event => {

                    if (
                        !oldAudio.duration
                    ) {

                        return;
                    }


                    const rect =
                        event.currentTarget
                            .getBoundingClientRect();


                    const ratio =
                        Math.min(
                            1,
                            Math.max(
                                0,
                                (
                                    event.clientX -
                                    rect.left
                                ) /
                                rect.width
                            )
                        );


                    oldAudio.currentTime =
                        ratio *
                        oldAudio.duration;
                }
            );


        document
            .getElementById("removeOldAudioBtn")
            ?.addEventListener(
                "click",
                () => {

                    removeOldAudio =
                        true;


                    oldAudio.pause();


                    oldAudioBox.style.display =
                        "none";
                }
            );
    }


    function resetOldAudioVisual() {

        document
            .getElementById("oldPlayIco")
            ?.setAttribute(
                "class",
                "bi bi-play-fill"
            );


        document
            .getElementById("oldReelL")
            ?.classList
            .remove("spin");


        document
            .getElementById("oldReelR")
            ?.classList
            .remove("spin");
    }


    /* =========================================
       NEW AUDIO PLAYER
    ========================================= */

    function revokeNewAudioUrl() {

        if (
            newAudioObjectUrl
        ) {

            URL.revokeObjectURL(
                newAudioObjectUrl
            );


            newAudioObjectUrl =
                null;
        }
    }


    function showNewAudio(file) {

        revokeNewAudioUrl();


        newAudioObjectUrl =
            URL.createObjectURL(file);


        newAudioElement.src =
            newAudioObjectUrl;


        newAudioWrap.style.display =
            "flex";


        newAudioElement.load();
    }


    newAudioElement.addEventListener(
        "loadedmetadata",
        () => {

            document
                .getElementById("newDur")
                .textContent =
                formatTime(
                    newAudioElement.duration
                );
        }
    );


    newAudioElement.addEventListener(
        "timeupdate",
        () => {

            const percentage =
                newAudioElement.duration
                    ? (
                        newAudioElement.currentTime /
                        newAudioElement.duration
                    ) * 100
                    : 0;


            document
                .getElementById("newBar")
                .style
                .width =
                percentage + "%";


            document
                .getElementById("newCur")
                .textContent =
                formatTime(
                    newAudioElement.currentTime
                );
        }
    );


    newAudioElement.addEventListener(
        "play",
        () => {

            document
                .getElementById("newPlayIco")
                .className =
                "bi bi-pause-fill";


            document
                .getElementById("newReelL")
                .classList
                .add("spin");


            document
                .getElementById("newReelR")
                .classList
                .add("spin");
        }
    );


    newAudioElement.addEventListener(
        "pause",
        resetNewAudioVisual
    );


    newAudioElement.addEventListener(
        "ended",
        resetNewAudioVisual
    );


    document
        .getElementById("newPlayBtn")
        .addEventListener(
            "click",
            async () => {

                if (
                    newAudioElement.paused
                ) {

                    if (oldAudio) {

                        oldAudio.pause();
                    }


                    try {

                        await newAudioElement.play();

                    } catch (error) {

                        console.error(error);
                    }

                } else {

                    newAudioElement.pause();
                }

            }
        );


    document
        .getElementById("newProgressBar")
        .addEventListener(
            "click",
            event => {

                if (
                    !newAudioElement.duration
                ) {

                    return;
                }


                const rect =
                    event.currentTarget
                        .getBoundingClientRect();


                const ratio =
                    Math.min(
                        1,
                        Math.max(
                            0,
                            (
                                event.clientX -
                                rect.left
                            ) /
                            rect.width
                        )
                    );


                newAudioElement.currentTime =
                    ratio *
                    newAudioElement.duration;
            }
        );


    document
        .getElementById("removeNewAudioBtn")
        .addEventListener(
            "click",
            () => {

                pauseNewAudio();


                newAudio =
                    null;


                audioInput.value =
                    "";


                newAudioElement.removeAttribute(
                    "src"
                );


                newAudioElement.load();


                revokeNewAudioUrl();


                newAudioWrap.style.display =
                    "none";


                /*
                 * Không tự khôi phục audio cũ.
                 * Nếu trước đó đã chọn thay audio,
                 * removeOldAudio vẫn giữ true.
                 */
            }
        );


    function pauseNewAudio() {

        if (
            !newAudioElement.paused
        ) {

            newAudioElement.pause();
        }


        resetNewAudioVisual();
    }


    function resetNewAudioVisual() {

        document
            .getElementById("newPlayIco")
            .className =
            "bi bi-play-fill";


        document
            .getElementById("newReelL")
            .classList
            .remove("spin");


        document
            .getElementById("newReelR")
            .classList
            .remove("spin");
    }


    /* =========================================
       AUDIO UPLOAD
    ========================================= */

    audioInput.addEventListener(
        "change",
        function () {

            if (
                !this.files.length
            ) {

                return;
            }


            if (
                recorder &&
                recorder.state ===
                "recording"
            ) {

                recorder.stop();
            }


            stopMicrophone();


            newAudio =
                this.files[0];


            showNewAudio(
                newAudio
            );


            removeOldAudio =
                true;


            if (
                oldAudioBox
            ) {

                oldAudio?.pause();

                oldAudioBox.style.display =
                    "none";
            }


            setRecordIdle(
                "Đã chọn file"
            );
        }
    );


    /* =========================================
       RECORD AUDIO
    ========================================= */

    recordBtn.addEventListener(
        "click",
        async () => {

            if (
                !navigator.mediaDevices
                ?.getUserMedia
            ) {

                alert(
                    "Thiết bị không hỗ trợ microphone."
                );

                return;
            }


            if (
                recorder &&
                recorder.state ===
                "recording"
            ) {

                recorder.stop();

                return;
            }


            try {

                microphoneStream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            audio: true
                        });


                recordedChunks =
                    [];


                const mimeType =
                    getSupportedAudioType();


                recorder =
                    mimeType
                        ? new MediaRecorder(
                            microphoneStream,
                            {
                                mimeType
                            }
                        )
                        : new MediaRecorder(
                            microphoneStream
                        );


                recorder.addEventListener(
                    "dataavailable",
                    event => {

                        if (
                            event.data &&
                            event.data.size > 0
                        ) {

                            recordedChunks.push(
                                event.data
                            );
                        }

                    }
                );


                recorder.addEventListener(
                    "stop",
                    () => {

                        const realType =
                            recorder.mimeType ||
                            mimeType ||
                            "audio/webm";


                        const blob =
                            new Blob(
                                recordedChunks,
                                {
                                    type:
                                        realType
                                }
                            );


                        const extension =
                            realType.includes("mp4")
                                ? "m4a"
                                : realType.includes("ogg")
                                    ? "ogg"
                                    : "webm";


                        newAudio =
                            new File(
                                [blob],
                                "record." +
                                extension,
                                {
                                    type:
                                        realType
                                }
                            );


                        showNewAudio(
                            newAudio
                        );


                        removeOldAudio =
                            true;


                        if (
                            oldAudioBox
                        ) {

                            oldAudio?.pause();

                            oldAudioBox.style.display =
                                "none";
                        }


                        stopMicrophone();


                        setRecordIdle(
                            "Đã ghi xong"
                        );
                    }
                );


                recorder.start();


                recordBtn.classList.add(
                    "recording"
                );


                recordIcon.className =
                    "bi bi-stop-fill";


                recordLabel.textContent =
                    "Dừng";


                recordStatus.textContent =
                    "Đang ghi…";


                recordStatus.className =
                    "active";


                document
                    .getElementById("newReelL")
                    .classList
                    .add("spin");


                document
                    .getElementById("newReelR")
                    .classList
                    .add("spin");

            } catch (error) {

                stopMicrophone();


                console.error(error);


                alert(
                    "Không mở được microphone. Hãy cấp quyền micro cho trình duyệt."
                );
            }

        }
    );


    function getSupportedAudioType() {

        const mimeTypes = [
            "audio/mp4",
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/ogg;codecs=opus"
        ];


        for (
            const mimeType of mimeTypes
        ) {

            if (
                MediaRecorder.isTypeSupported(
                    mimeType
                )
            ) {

                return mimeType;
            }
        }


        return "";
    }


    function stopMicrophone() {

        if (
            microphoneStream
        ) {

            microphoneStream
                .getTracks()
                .forEach(track => {

                    track.stop();
                });


            microphoneStream =
                null;
        }


        document
            .getElementById("newReelL")
            .classList
            .remove("spin");


        document
            .getElementById("newReelR")
            .classList
            .remove("spin");
    }


    function setRecordIdle(text) {

        recordBtn.classList.remove(
            "recording"
        );


        recordIcon.className =
            "bi bi-mic";


        recordLabel.textContent =
            "Ghi âm";


        recordStatus.textContent =
            text || "";


        recordStatus.className =
            "";
    }


    /* =========================================
       SUBMIT
    ========================================= */

    topSaveBtn.addEventListener(
        "click",
        () => {

            giftForm.requestSubmit();
        }
    );


    giftForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            if (
                isSaving ||
                !uid
            ) {

                return;
            }


            if (
                recorder &&
                recorder.state ===
                "recording"
            ) {

                alert(
                    "Hãy dừng ghi âm trước khi lưu."
                );

                return;
            }


            isSaving =
                true;


            setSavingState();


            const formData =
                new FormData();


            formData.append(
                "message",
                messageInput.value
            );


            const theme = "sky";


            formData.append(
                "theme",
                theme
            );


            newImages.forEach(
                image => {

                    formData.append(
                        "images",
                        image
                    );
                }
            );


            if (
                newAudio
            ) {

                formData.append(
                    "audio",
                    newAudio
                );
            }


            formData.append(
                "removeOldAudio",
                String(removeOldAudio)
            );


            deletedImages.forEach(
                imageUrl => {

                    formData.append(
                        "deleteImages",
                        imageUrl
                    );
                }
            );


            const apiUrl =
                    "/api/gift/update/" +
                    encodeURIComponent(uid);


            try {

                const response =
                    await fetch(
                        apiUrl,
                        {
                            method:
                                "POST",

                            body:
                                formData
                        }
                    );


                const responseText =
                    await response.text();


                if (
                    !response.ok
                ) {

                    throw new Error(
                        responseText ||
                        "Không thể cập nhật Gift."
                    );
                }


                setSuccessState();


                setTimeout(
                    () => {

                        window.location.href =
                                "/gift/view/" +
                                encodeURIComponent(uid);

                    },
                    700
                );

            } catch (error) {

                console.error(error);


                alert(
                    "Lỗi: " +
                    error.message
                );


                resetSavingState();
            }

        }
    );


    function setSavingState() {

        saveBtn.disabled =
            true;


        topSaveBtn.disabled =
            true;


        saveBtn.classList.add(
            "saving"
        );


        saveLabel.textContent =
            "Đang lưu…";


        saveIcon.className =
            "bi bi-hourglass-split";
    }


    function setSuccessState() {

        saveBtn.classList.remove(
            "saving"
        );


        saveBtn.classList.add(
            "done"
        );


        saveLabel.textContent =
            "Đã lưu!";


        saveIcon.className =
            "bi bi-check-lg";
    }


    function resetSavingState() {

        isSaving =
            false;


        saveBtn.disabled =
            false;


        topSaveBtn.disabled =
            false;


        saveBtn.classList.remove(
            "saving",
            "done"
        );


        saveLabel.textContent =
            "Lưu thay đổi";


        saveIcon.className =
            "bi bi-check-lg";
    }


    window.addEventListener(
        "beforeunload",
        () => {

            stopMicrophone();

            revokeNewAudioUrl();
        }
    );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Ocean Diary</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{
  --sky-top:#eaf9ff; --sky:#a8e2ff; --sea:#42b7e8; --deep:#0874b9;
  --navy:#123f5c; --muted:#668ba0; --paper:#fffdf7; --foam:#f7fdff;
  --line:rgba(8,116,185,.18); --shadow:0 18px 45px rgba(16,104,158,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,button,input,textarea{font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;color:var(--navy);overflow-x:hidden;
  background:
    radial-gradient(circle at 80% 8%,rgba(255,244,177,.95) 0 35px,rgba(255,244,177,.3) 36px 65px,transparent 66px),
    linear-gradient(180deg,var(--sky-top) 0%,var(--sky) 48%,var(--sea) 76%,var(--deep) 100%);
  background-attachment:fixed;
}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;width:110px;height:34px;border-radius:999px;background:rgba(255,255,255,.72);filter:blur(.2px);animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:50px;height:50px;left:18px;top:-22px}.cloud:after{width:66px;height:66px;right:12px;top:-32px}
.cloud.c1{top:12%;left:-140px;animation-duration:28s}.cloud.c2{top:30%;left:-180px;transform:scale(.72);animation-duration:38s;animation-delay:-12s}
@keyframes drift{to{transform:translateX(calc(100vw + 320px))}}
.bubble{position:absolute;bottom:-40px;border:1px solid rgba(255,255,255,.7);border-radius:50%;animation:bubbleUp linear infinite}
@keyframes bubbleUp{to{transform:translateY(-115vh) translateX(var(--x));opacity:0}}
.wave{position:fixed;left:-10%;right:-10%;bottom:-72px;height:190px;z-index:0;border-radius:46% 54% 0 0/18% 25% 0 0;background:
  radial-gradient(ellipse at 50% 0,rgba(255,255,255,.9) 0 6%,transparent 7%),
  repeating-radial-gradient(ellipse at 50% 120%,rgba(255,255,255,.22) 0 5px,transparent 6px 26px),
  linear-gradient(180deg,#35afe2,#0573b9);animation:wave 7s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateY(22px) scaleX(1.05)}}
.shell{position:relative;z-index:2;width:min(100%,520px);margin:auto;min-height:100vh;padding:18px 14px 140px}
.hero{text-align:center;padding:26px 16px 18px}
.kicker{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--deep);font-weight:700}
.title{font-size:clamp(34px,10vw,58px);line-height:1;margin-top:8px;letter-spacing:-2px}
.subtitle{font-size:13px;color:var(--muted);margin-top:9px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.icon-btn,.text-btn{border:0;background:rgba(255,255,255,.62);backdrop-filter:blur(12px);color:var(--navy);box-shadow:0 7px 20px rgba(8,116,185,.12);cursor:pointer}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.text-btn{padding:11px 15px;border-radius:999px;font-weight:700}
.section{margin-top:22px}
.section-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;margin:0 6px 10px}
.card{background:rgba(255,253,247,.86);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);backdrop-filter:blur(16px);border-radius:26px;padding:16px}
.album{display:grid;grid-template-columns:1.35fr .65fr;grid-template-rows:1fr 1fr;gap:9px;min-height:340px}
.photo{position:relative;overflow:hidden;border-radius:18px;background:#dff4ff;min-height:145px}
.photo:first-child{grid-row:1/3}.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo:nth-child(n+4){display:none}
.add-photo{border:2px dashed rgba(8,116,185,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--deep);cursor:pointer;background:rgba(255,255,255,.44)}
.add-photo i{font-size:26px}.remove{position:absolute;right:8px;top:8px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(7,50,75,.72);color:#fff;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.thumbs .photo{aspect-ratio:1;min-height:0}.thumbs .photo:first-child{grid-row:auto}
.note{
  position:relative;
  background:var(--paper);
  padding:24px 22px 22px;
  border-radius:8px 28px 8px 28px;
  transform:rotate(-.5deg);
  box-shadow:0 12px 28px rgba(0,0,0,.08);
}
.note:before{content:"";position:absolute;width:70px;height:22px;background:rgba(255,236,176,.7);top:-9px;left:50%;transform:translateX(-50%) rotate(2deg)}
textarea{width:100%;min-height:150px;border:0;outline:0;resize:vertical;background:transparent;color:var(--navy);font-size:18px;line-height:31px}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:31px}
.count{text-align:right;color:var(--muted);font-size:11px;margin-top:8px}
.bottle{display:flex;align-items:center;gap:15px}
.bottle-icon{width:64px;height:86px;border:3px solid rgba(8,116,185,.34);border-radius:18px 18px 25px 25px;display:grid;place-items:center;font-size:27px;transform:rotate(-5deg);background:linear-gradient(145deg,rgba(255,255,255,.7),rgba(107,211,245,.25))}
.audio-main{flex:1}.audio-row{display:flex;align-items:center;gap:10px}
.play{width:42px;height:42px;border:0;border-radius:50%;background:var(--deep);color:#fff;cursor:pointer}
.progress{height:7px;background:rgba(8,116,185,.15);border-radius:999px;overflow:hidden;cursor:pointer;flex:1}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#63d9f6,var(--deep))}
.times{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:7px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--navy);border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer}
.pill.recording{color:#cf3655;border-color:#cf3655}
.status{font-size:11px;color:var(--muted);align-self:center}
.savebar{position:fixed;z-index:10;left:50%;bottom:18px;transform:translateX(-50%);width:min(calc(100% - 28px),490px)}
.save{width:100%;border:0;border-radius:22px;padding:16px 20px;background:linear-gradient(135deg,#169bd6,#0569aa);color:#fff;font-size:16px;font-weight:800;box-shadow:0 14px 34px rgba(3,83,139,.35);cursor:pointer}
.save:disabled{opacity:.65}.save.done{background:linear-gradient(135deg,#4bc5a2,#17886c)}
.lightbox{position:fixed;inset:0;background:rgba(2,34,54,.9);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.lightbox.open{display:flex}.lightbox img{max-width:92vw;max-height:84vh;border-radius:18px}.lightbox button{position:absolute;top:18px;right:18px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
@media(max-width:430px){.album{min-height:300px}.title{font-size:42px}.shell{padding-left:10px;padding-right:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="ambient" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <span class="bubble" style="left:12%;width:12px;height:12px;--x:20px;animation-duration:10s"></span>
  <span class="bubble" style="left:74%;width:18px;height:18px;--x:-25px;animation-duration:13s;animation-delay:-5s"></span>
  <span class="bubble" style="left:42%;width:8px;height:8px;--x:12px;animation-duration:8s;animation-delay:-2s"></span>
</div><div class="wave" aria-hidden="true"></div>

<div class="shell">
<header class="hero"><div class="kicker">A memory beside the sea</div><h1 id="memoryTitle" tabindex="0" class="title" th:data-edit-url="@{'/gift/edit/' + ${gift.uid}}">Sky Ocean Diary</h1><p class="subtitle">Chạm 3 lần vào tiêu đề để chỉnh sửa</p></header>
<section class="section" th:if="${gift.images != null and !gift.images.isEmpty()}"><div class="section-title"><i class="bi bi-images"></i> Album ký ức</div>
<div class="card"><div class="album" id="gallery">
<div class="photo" th:each="img,st : ${gift.images}" th:if="${st.index < 3}"><img class="zoomable" th:src="@{'/files/images/' + ${img.imageUrl}}" alt="Ảnh ký ức"></div>
</div><div class="thumbs"><div class="photo" th:each="img,st : ${gift.images}" th:if="${st.index >= 3}"><img class="zoomable" th:src="@{'/files/images/' + ${img.imageUrl}}" alt="Ảnh ký ức"></div></div></div></section>
<section class="section" th:if="${gift.images == null or gift.images.isEmpty()}"><div class="card empty"><i class="bi bi-cloud-sun" style="font-size:34px"></i><p>Chưa có ảnh trong trang nhật ký này.</p></div></section>

<section class="section"><div class="section-title"><i class="bi bi-envelope-paper-heart"></i> Lá thư nhỏ</div>
<div class="card note" th:if="${gift.message != null and gift.message != ''}"><div class="note-text" th:text="${gift.message}"></div></div>
<div class="card empty" th:if="${gift.message == null or gift.message == ''}">Chưa có lời nhắn.</div></section>

<section class="section" th:if="${gift.voiceUrl != null and gift.voiceUrl != ''}"><div class="section-title"><i class="bi bi-soundwave"></i> Lời nhắn trong chai</div>
<div class="card bottle"><div class="bottle-icon"><i class="bi bi-music-note-beamed"></i></div><div class="audio-main">
<div class="audio-row"><button class="play" id="playBtn"><i id="playIco" class="bi bi-play-fill"></i></button><div id="progress" class="progress"><span id="bar"></span></div></div>
<div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
<audio id="audio" preload="metadata" th:src="@{'/files/audio/' + ${gift.voiceUrl}}"></audio></div></section>
</div>
<div class="lightbox" id="lightbox"><button class="icon-btn" onclick="closeLightbox()"><i class="bi bi-x-lg"></i></button><img id="lightboxImg" alt=""></div>
<script>
let taps=0,timer;const title=document.getElementById('memoryTitle');function tap(){taps++;clearTimeout(timer);if(taps>=3){taps=0;location.href=title.dataset.editUrl;return}timer=setTimeout(()=>taps=0,650)}title.onclick=tap;title.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}};
const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lightboxImg');document.querySelectorAll('.zoomable').forEach(i=>i.onclick=()=>{lbImg.src=i.src;lb.classList.add('open')});function closeLightbox(){lb.classList.remove('open')}lb.onclick=e=>{if(e.target===lb)closeLightbox()};
const a=document.getElementById('audio');if(a){const p=document.getElementById('playBtn'),ico=document.getElementById('playIco'),bar=document.getElementById('bar'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),prog=document.getElementById('progress');const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
p.onclick=()=>{if(a.paused){a.play();ico.className='bi bi-pause-fill'}else{a.pause();ico.className='bi bi-play-fill'}};a.onloadedmetadata=()=>dur.textContent=fmt(a.duration);a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);bar.style.width=(a.duration?a.currentTime/a.duration*100:0)+'%'};a.onended=()=>ico.className='bi bi-play-fill';prog.onclick=e=>{const r=prog.getBoundingClientRect();a.currentTime=((e.clientX-r.left)/r.width)*a.duration}}
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Gift</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f5f5f5;
}

.card-box{
    max-width:700px;
    margin:40px auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.image-box{
    height:120px;
    border:2px dashed #ccc;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.3s;
}

.image-box:hover{
    background:#fafafa;
}

textarea{
    resize:none;
    border-radius:15px;
}

.voice{
    display:flex;
    align-items:center;
    gap:15px;
    margin-top:20px;
}

audio{
    width:100%;
}

/* ================== UI STATE ================== */

/* 1 ảnh -> center + to */
.single-mode{
    display:flex !important;
    justify-content:center;
}

.single-mode .img-item{
    width:100%;
}

.single-mode img{
    height:300px !important;
    object-fit:cover;
    border-radius:16px;
}

/* image item */
.img-item img{
    height:120px;
    width:100%;
    object-fit:cover;
    border-radius:14px;
}

</style>
</head>

<body>

<div class="card-box">

<form id="giftForm" enctype="multipart/form-data">

<!-- INPUT -->
<input type="file"
       id="imageInput"
       name="images"
       accept="image/*"
       multiple
       hidden>

<!-- ================= ALBUM ================= -->
<div class="section-title">
    <h3>Album</h3>
</div>

<div class="row g-3" id="previewContainer">

    <!-- IMAGE BOX + -->
    <div class="col-4" id="addBox">
        <div class="image-box" onclick="document.getElementById('imageInput').click()">
            <div style="text-align:center">
                <i class="bi bi-plus-lg fs-1"></i>
                <div style="font-size:12px;color:#888">Thêm ảnh</div>
            </div>
        </div>
    </div>

</div>

<!-- ================= TEXT ================= -->
<div class="section-title mt-4">
    <h3>Text Message</h3>
</div>

<textarea class="form-control" name="message" rows="5"></textarea>

<hr class="my-4">

<!-- ================= VOICE ================= -->
<div class="section-title">
    <h3>Voice Message</h3>
</div>

<div class="voice">

    <input type="file"
           id="audioInput"
           name="audio"
           accept="audio/*"
           class="form-control">

    <audio id="audioPreview" controls></audio>

</div>

<!-- SAVE -->
<div class="text-center mt-4">
    <button class="btn btn-success">
        <i class="bi bi-floppy"></i> Save
    </button>
</div>

</form>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const previewContainer = document.getElementById("previewContainer");
const addBox = document.getElementById("addBox");

let selectedImages = [];
let audioFile = null;

/* ================= ADD IMAGE ================= */
imageInput.addEventListener("change", function () {

    const files = Array.from(this.files);

    files.forEach(file => {

        if (selectedImages.length >= 6) return;

        selectedImages.push(file);

        const reader = new FileReader();

        reader.onload = function (e) {

            const col = document.createElement("div");
            col.className = "col-4 img-item";

            col.innerHTML = `
                <div class="position-relative">

                    <img src="${e.target.result}">

                    <button type="button"
                            class="btn btn-danger btn-sm position-absolute top-0 end-0"
                            onclick="removeImage(this)">
                        <i class="bi bi-x"></i>
                    </button>

                </div>
            `;

            previewContainer.insertBefore(col, addBox);

            updateImageLayout();
        };

        reader.readAsDataURL(file);
    });

    this.value = "";
});

/* ================= REMOVE IMAGE ================= */
function removeImage(btn){
    btn.closest(".img-item").remove();
    selectedImages.pop();
    updateImageLayout();
}

/* ================= UPDATE UI ================= */
function updateImageLayout(){

    const items = document.querySelectorAll(".img-item");

    /* ẨN + BOX KHI ĐỦ 6 */
    if (selectedImages.length >= 6) {
        addBox.style.display = "none";
    } else {
        addBox.style.display = "block";
    }

    /* RESET */
    previewContainer.classList.remove("single-mode");

    /* 1 ẢNH -> CENTER + TO */
    if (selectedImages.length === 1) {
        previewContainer.classList.add("single-mode");
    }
}

/* ================= AUDIO ================= */
const audioInput = document.getElementById("audioInput");
const audioPreview = document.getElementById("audioPreview");

audioInput.addEventListener("change", function () {

    audioFile = this.files[0];

    if (audioFile) {
        audioPreview.src = URL.createObjectURL(audioFile);
        audioPreview.load();
    }
});

/* ================= SUBMIT ================= */
document.getElementById("giftForm").addEventListener("submit", function(e){

    e.preventDefault();

    const formData = new FormData(this);

    selectedImages.forEach(file=>{
        formData.append("images", file);
    });

    if(audioFile){
        formData.append("audio", audioFile);
    }

    fetch("/api/gift/save", {
    method: "POST",
    body: formData
})
.then(res => {
    if (!res.ok) {
        throw new Error("Lưu thất bại");
    }
    return res.text(); // Nhận ID vừa tạo
})
.then(id => {
    // Chuyển sang trang xem quà
    window.location.href = "/gift/view/" + id;
})
.catch(err => {
    console.error(err);
    alert("Không thể lưu dữ liệu!");
});

});

</script>

</body>
</html>

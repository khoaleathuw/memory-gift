<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Gift</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{background:#f5f5f5;}
.card-box{max-width:700px;margin:40px auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 5px 20px rgba(0,0,0,.1);}
.section-title{display:flex;justify-content:space-between;margin-bottom:20px;}
.image-box{height:120px;border:2px dashed #ccc;border-radius:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
textarea{resize:none;border-radius:15px;}
.voice{display:flex;gap:10px;flex-wrap:wrap;}
audio{width:100%;}
.img-item img{height:120px;width:100%;object-fit:cover;border-radius:14px;}
.single-mode{display:flex !important;justify-content:center;}
.single-mode .img-item{width:100%;}
.single-mode img{height:300px !important;}
</style>
</head>

<body>

<div class="card-box">

<form id="giftForm" enctype="multipart/form-data">

<!-- IMAGE -->
<input type="file" id="imageInput" name="images" accept="image/*" multiple hidden>

<div class="section-title"><h3>Album</h3></div>

<div class="row g-3" id="previewContainer">
    <div class="col-4" id="addBox">
        <div class="image-box" onclick="imageInput.click()">
            <div>
                <i class="bi bi-plus-lg fs-1"></i>
                <div style="font-size:12px;">Thêm ảnh</div>
            </div>
        </div>
    </div>
</div>

<!-- TEXT -->
<div class="section-title mt-4"><h3>Message</h3></div>
<textarea class="form-control" name="message" rows="5"></textarea>

<hr>

<!-- AUDIO -->
<div class="section-title">
    <h3>Voice</h3>
</div>

<div class="voice">

    <!-- RECORD -->
    <button type="button" id="recordBtn" class="btn btn-danger">
        🎤 Record
    </button>

    <span id="recordStatus"></span>

    <!-- UPLOAD FILE -->
    <input 
        type="file" 
        id="audioInput" 
        name="audio"
        accept="audio/*"
        class="form-control"
        style="max-width:200px"
    >

</div>

<audio id="audioPreview" controls></audio>

<!-- SAVE -->
<div class="text-center mt-4">
    <button class="btn btn-success">Save</button>
</div>

</form>

</div>

<script>

let selectedImages = [];
let audioFile = null;
let mediaRecorder;
let chunks = [];
let stream;

// ================= IMAGE =================
const imageInput = document.getElementById("imageInput");
const previewContainer = document.getElementById("previewContainer");
const addBox = document.getElementById("addBox");

imageInput.addEventListener("change", function () {
    Array.from(this.files).forEach(file => {

        if (selectedImages.length >= 6) return;

        selectedImages.push(file);

        const reader = new FileReader();
        reader.onload = e => {

            const div = document.createElement("div");
            div.className = "col-4 img-item";

            div.innerHTML = `
                <div style="position:relative">
                    <img src="${e.target.result}">
                    <button type="button"
                        onclick="removeImage(this)"
                        class="btn btn-danger btn-sm position-absolute top-0 end-0">X</button>
                </div>
            `;

            previewContainer.insertBefore(div, addBox);
            updateLayout();
        };

        reader.readAsDataURL(file);
    });

    this.value = "";
});

function removeImage(btn){
    const items = document.querySelectorAll(".img-item");
    const index = Array.from(items).indexOf(btn.closest(".img-item"));
    if(index > -1) selectedImages.splice(index,1);

    btn.closest(".img-item").remove();
    updateLayout();
}

function updateLayout(){
    addBox.style.display = selectedImages.length >= 6 ? "none" : "block";
    previewContainer.classList.toggle("single-mode", selectedImages.length === 1);
}

// ================= AUDIO UPLOAD =================
const audioInput = document.getElementById("audioInput");
const audioPreview = document.getElementById("audioPreview");

audioInput.addEventListener("change", function(){
    if(this.files.length){
        audioFile = this.files[0];
        audioPreview.src = URL.createObjectURL(audioFile);
        stopMic();
    }
});

// ================= RECORD FIX MOBILE =================
function stopMic(){
    if(stream){
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
}

document.getElementById("recordBtn").addEventListener("click", async () => {

    if (!navigator.mediaDevices?.getUserMedia) {
        alert("Trình duyệt không hỗ trợ record");
        return;
    }

    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        document.getElementById("recordBtn").innerText = "🎤 Record";
        document.getElementById("recordStatus").innerText = "Stopped";
        return;
    }

    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        mediaRecorder = new MediaRecorder(stream);
        chunks = [];

        mediaRecorder.ondataavailable = e => chunks.push(e.data);

        mediaRecorder.onstop = () => {

            const mimeType = MediaRecorder.isTypeSupported("audio/webm")
                ? "audio/webm"
                : "audio/mp4";

            const blob = new Blob(chunks, { type: mimeType });

            audioFile = new File([blob], "voice.webm", { type: mimeType });

            audioPreview.src = URL.createObjectURL(audioFile);

            stopMic();
        };

        mediaRecorder.start();

        document.getElementById("recordBtn").innerText = "⏹ Stop";
        document.getElementById("recordStatus").innerText = "Recording...";

    } catch (err) {
        alert("Mic error: " + err.message);
    }
});

// ================= SUBMIT =================
document.getElementById("giftForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData();

    formData.append("message", document.querySelector("textarea[name='message']").value);

    selectedImages.forEach(i => formData.append("images", i));

    if(audioFile){
        formData.append("audio", audioFile);
    }

    const res = await fetch("/api/gift/save", {
        method: "POST",
        body: formData
    });

    const id = await res.text();
    window.location.href = "/gift/view/" + id;
});

</script>

</body>
</html>

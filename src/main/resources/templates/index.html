<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Booth</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/index.css}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --night-deep:#070b1f;
  --night-navy:#0f1638;
  --night-mid:#1b2452;
  --night-indigo:#2a3570;
  --star-white:#f4f6ff;
  --star-soft:#c9d2ff;
  --moon-glow:#fdf6e3;
  --silver:#cfd6f0;
  --lilac:#9f8fe0;
  --ink:#e8ebff;
  --ink-soft:#a6acd9;
  --flash-white:#eef1ff;
}

*{box-sizing:border-box;margin:0;padding:0;}

html,body{height:100%;}

body{
  background:
    radial-gradient(ellipse 70% 40% at 78% 6%, rgba(253,246,227,0.10), transparent 60%),
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(159,143,224,0.14), transparent 60%),
    radial-gradient(ellipse 90% 50% at 50% 110%, rgba(42,53,112,0.35), transparent 60%),
    linear-gradient(180deg, var(--night-deep), var(--night-navy) 60%, var(--night-mid));
  min-height:100vh;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  overflow-x:hidden;
  position:relative;
}

body.locked{overflow:hidden;height:100vh;}

/* ============ STAR FIELD ============ */
.star-field{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.star-dot{
  position:absolute;border-radius:50%;background:var(--star-white);
  box-shadow:0 0 5px 1px rgba(244,246,255,0.6);
  animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7);}50%{opacity:.9;transform:scale(1.1);}}
.shooting-star{
  position:absolute;width:2px;height:2px;background:var(--star-white);border-radius:50%;
  box-shadow:0 0 8px 2px rgba(244,246,255,0.9);
  opacity:0;animation:shootAcross 6s ease-in infinite;
}
.shooting-star::before{
  content:'';position:absolute;top:50%;right:0;width:90px;height:1px;
  background:linear-gradient(90deg, rgba(244,246,255,0.9), transparent);
  transform:translateY(-50%);
}
@keyframes shootAcross{
  0%{opacity:0;transform:translate(0,0);}
  2%{opacity:1;}
  14%{opacity:0;transform:translate(-260px,180px);}
  100%{opacity:0;}
}
@media (prefers-reduced-motion: reduce){ .star-dot,.shooting-star{animation:none;} }

/* ============ CURTAIN INTRO (night silk) ============ */
.curtain-stage{position:fixed;inset:0;z-index:9999;display:flex;pointer-events:none;}
.curtain-panel{
  flex:1;
  background:linear-gradient(160deg, var(--night-mid) 0%, var(--night-navy) 55%, var(--night-deep) 100%);
  box-shadow:inset 0 0 140px rgba(0,0,0,0.4);
  transition:transform 1.15s cubic-bezier(.76,0,.15,1);
  position:relative;
  overflow:hidden;
}
.curtain-panel::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(244,246,255,0.5) 1px, transparent 1.4px);
  background-size:38px 46px;
  opacity:.35;
}
.curtain-panel::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.3), transparent 12%, transparent 88%, rgba(0,0,0,.35));
}
.curtain-left{transform-origin:left center;}
.curtain-right{transform-origin:right center;}
body.opened .curtain-left{transform:translateX(-101%);}
body.opened .curtain-right{transform:translateX(101%);}

.curtain-mark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Cormorant Garamond',serif;
  font-weight:700;font-style:italic;
  font-size:10.5vw;
  letter-spacing:3px;
  color:var(--moon-glow);
  text-shadow:0 0 40px rgba(253,246,227,0.55);
  white-space:nowrap;
  z-index:2;
  opacity:1;
  transition:opacity .5s ease .05s;
}
body.opened .curtain-mark{opacity:0;}

.flash-overlay{
  position:fixed;inset:0;z-index:10000;
  background:var(--flash-white);
  opacity:0;pointer-events:none;
}
body.opened .flash-overlay{animation:flashPulse .7s ease-out .95s forwards;}
@keyframes flashPulse{0%{opacity:0}12%{opacity:.75}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){
  .curtain-panel,.curtain-mark{transition:none !important;}
  body.opened .flash-overlay{animation:none !important;}
}

/* ============ SHELL ============ */
.booth-shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  border-left:1px solid rgba(159,143,224,0.15);
  border-right:1px solid rgba(159,143,224,0.15);
  opacity:0;
  transform:translateY(10px);
  transition:opacity .7s ease .95s, transform .7s ease .95s;
  position:relative;
  z-index:2;
}
body.opened .booth-shell{opacity:1;transform:translateY(0);}

/* ============ MARQUEE TOPBAR ============ */
.booth-marquee{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg, var(--night-navy), var(--night-deep) 95%);
  border-bottom:1px solid rgba(159,143,224,0.25);
  padding:14px 16px 10px;
  text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,0.35);
}
.booth-marquee .bulbs{
  display:flex;justify-content:center;gap:7px;margin-bottom:6px;
}
.booth-marquee .bulb{
  width:5px;height:5px;border-radius:50%;
  background:var(--moon-glow);
  box-shadow:0 0 6px 1px rgba(253,246,227,0.7);
  opacity:.85;
  animation:bulbFlicker 2.4s ease-in-out infinite;
}
.booth-marquee .bulb:nth-child(odd){animation-delay:.3s;}
.booth-marquee .bulb:nth-child(3n){animation-delay:.6s;}
@keyframes bulbFlicker{0%,100%{opacity:.9}50%{opacity:.35}}

.booth-marquee-row{display:flex;align-items:center;justify-content:space-between;}
.booth-back{background:none;border:none;color:var(--ink);font-size:20px;cursor:pointer;opacity:.9;}
.booth-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;font-style:italic;
  font-size:23px;letter-spacing:1px;
  color:var(--ink);
}
.booth-title span{color:var(--moon-glow);}
.booth-share-top{
  background:none;border:none;font-family:'Inter',sans-serif;
  font-weight:700;font-size:13px;color:var(--moon-glow);cursor:pointer;
  letter-spacing:.3px;
}
.booth-share-top:hover{color:#fff;}

.booth-tagline{
  font-family:'Inter',sans-serif;
  font-weight:500;
  font-size:11.5px;color:rgba(232,235,255,0.6);
  margin-top:4px;letter-spacing:.4px;
}

/* ============ SECTION LABEL ============ */
.booth-label{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:16px;letter-spacing:.5px;
  color:var(--lilac);
  padding:20px 18px 8px;
}

/* ============ FILMSTRIP GRID ============ */
.filmstrip{
  margin:0 12px;
  padding:14px 22px;
  background:rgba(27,36,82,0.5);
  border:1px solid rgba(159,143,224,0.25);
  border-radius:14px;
  position:relative;
  backdrop-filter:blur(2px);
}

#previewContainer{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

#addBox{
  aspect-ratio:1;
  background:rgba(232,235,255,0.04);
  border:1.5px dashed rgba(159,143,224,0.45);
  border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;cursor:pointer;color:var(--lilac);
  font-family:'Inter',sans-serif;font-weight:700;
  font-size:11px;letter-spacing:1px;
  transition:background .15s,border-color .15s;
}
#addBox:hover{background:rgba(159,143,224,0.1);border-color:var(--star-soft);}
#addBox .bi{font-size:24px;color:var(--star-soft);}
#previewContainer > .col-4{all:unset;display:contents;}

.img-item-wrap{
  aspect-ratio:1;
  position:relative;
  background:var(--night-deep);
  padding:5px 5px 9px;
  border-radius:6px;
  box-shadow:0 3px 8px rgba(0,0,0,.5);
  border:1px solid rgba(207,214,240,0.25);
}
.img-item-wrap img{
  width:100%;height:100%;object-fit:cover;display:block;
  border-radius:3px;
  filter:saturate(1.02) contrast(1.03) brightness(.98);
}
.img-item-wrap .btn-remove{
  position:absolute;top:-6px;right:-6px;
  width:22px;height:22px;border-radius:50%;
  background:var(--lilac);border:2px solid var(--night-deep);
  color:#fff;font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  opacity:0;transition:opacity .15s;
}
.img-item-wrap:hover .btn-remove{opacity:1;}
.img-item-wrap.rot1{transform:rotate(-3deg);}
.img-item-wrap.rot2{transform:rotate(2deg);}
.img-item-wrap.rot3{transform:rotate(-1.5deg);}
.img-item-wrap.rot4{transform:rotate(3deg);}
.img-item-wrap.rot5{transform:rotate(0deg);}

.filmstrip-hint{
  font-family:'Inter',sans-serif;
  font-size:11px;color:var(--ink-soft);
  text-align:center;padding:10px 18px 4px;
}

/* ============ CAPTION CARD ============ */
.caption-card{
  margin:18px 16px 0;
  background:rgba(27,36,82,0.55);
  border-radius:12px;
  padding:16px 18px 10px 20px;
  box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(159,143,224,0.2);
  position:relative;
  border-left:4px solid var(--lilac);
  backdrop-filter:blur(2px);
}
.caption-card textarea{
  width:100%;background:transparent;border:none;outline:none;
  color:var(--ink);font-family:'Caveat',cursive;font-weight:600;
  font-size:19px;line-height:28px;resize:none;min-height:112px;
}
.caption-card textarea::placeholder{color:rgba(232,235,255,0.4);font-family:'Inter',sans-serif;font-size:14px;font-weight:400;}
.booth-charcount{
  font-family:'Inter',sans-serif;font-size:10.5px;color:var(--ink-soft);
  text-align:right;padding:6px 20px 4px;
}

/* ============ VOICE / TAPE ============ */
.tape-unit{
  margin:20px 16px 0;
  background:linear-gradient(160deg,rgba(42,53,112,0.55),rgba(15,22,56,0.7));
  border:1px solid rgba(159,143,224,0.25);
  border-radius:14px;
  padding:16px;
  display:flex;align-items:center;gap:16px;
  backdrop-filter:blur(2px);
}
.tape-reels{display:flex;gap:10px;}
.reel{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--star-soft), var(--lilac) 55%, var(--night-indigo) 100%);
  border:2px solid rgba(207,214,240,0.3);
}
.reel.spin{animation:reelSpin 1.1s linear infinite;}
@keyframes reelSpin{to{transform:rotate(360deg);}}

.tape-controls{flex:1;display:flex;flex-direction:column;gap:8px;}
.tape-controls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

#recordBtn{
  display:flex;align-items:center;gap:6px;
  background:var(--lilac);border:none;border-radius:18px;
  padding:8px 15px;font-size:12.5px;font-weight:700;color:#fff;
  cursor:pointer;font-family:'Inter',sans-serif;
  transition:background .15s,transform .1s;
}
#recordBtn:hover{background:#8677cc;}
#recordBtn:active{transform:scale(.96);}
#recordBtn.recording{
  background:#e02020;animation:rpulse 1.3s ease infinite;
}
@keyframes rpulse{0%,100%{box-shadow:0 0 0 0 rgba(224,32,32,.5)}50%{box-shadow:0 0 0 7px rgba(224,32,32,0)}}

#recordStatus{font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-soft);}
#recordStatus.active{color:#ff8a8a;}

.ig-file-label{
  display:flex;align-items:center;gap:6px;
  background:transparent;border:1px solid rgba(159,143,224,0.4);
  border-radius:18px;padding:8px 15px;font-size:12.5px;
  color:var(--star-soft);cursor:pointer;
  transition:border-color .15s,color .15s;
}
.ig-file-label:hover{border-color:var(--star-soft);color:#fff;}
#audioInput{display:none !important;}

#audioPreview{
  width:100%;margin-top:2px;border-radius:6px;display:none;height:32px;
}

/* ============ SHUTTER SUBMIT ============ */
.shutter-wrap{
  display:flex;flex-direction:column;align-items:center;
  gap:10px;padding:34px 16px 40px;
}
.shutter-btn{
  width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--star-soft), var(--lilac) 55%, var(--night-indigo) 100%);
  border:4px solid rgba(253,246,227,0.5);
  box-shadow:0 0 0 6px rgba(159,143,224,0.1), 0 8px 26px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;color:var(--night-deep);font-family:'Inter',sans-serif;
  transition:transform .12s, box-shadow .2s;
}
.shutter-btn:hover{box-shadow:0 0 0 9px rgba(159,143,224,0.16), 0 8px 26px rgba(0,0,0,.5);}
.shutter-btn:active{transform:scale(.94);}
.shutter-btn .bi{font-size:24px;}
.shutter-btn span{font-size:9.5px;font-weight:700;letter-spacing:1px;}
.shutter-btn.done{background:radial-gradient(circle at 35% 30%,#8fe3c4,#2a9c7a 60%,#0e5c47 100%);color:#fff;}
.shutter-caption{
  font-family:'Cormorant Garamond',serif;font-weight:700;font-style:italic;
  font-size:14px;letter-spacing:.5px;
  color:rgba(232,235,255,0.6);
}
</style>
</head>

<body class="locked">

<!-- STAR FIELD -->
<div class="star-field" id="starField" aria-hidden="true"></div>

<!-- CURTAIN INTRO -->
<div class="curtain-stage" aria-hidden="true">
  <div class="curtain-panel curtain-left"></div>
  <div class="curtain-mark">MEMORY BOOTH</div>
  <div class="curtain-panel curtain-right"></div>
</div>
<div class="flash-overlay" aria-hidden="true"></div>

<div class="booth-shell">
<form id="giftForm" enctype="multipart/form-data">

  <!-- MARQUEE TOPBAR -->
  <div class="booth-marquee">
    <div class="bulbs">
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span>
    </div>
    <div class="booth-marquee-row">
      <button class="booth-back" type="button" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
      <span class="booth-title">MEMORY <span>BOOTH</span></span>
      <button class="booth-share-top" type="submit" form="giftForm">In ảnh</button>
    </div>
    <div class="booth-tagline">— bước vào, cười lên, lưu lại khoảnh khắc —</div>
  </div>

  <input type="file" id="imageInput" name="images" accept="image/*" multiple hidden>

  <div class="booth-label">Cuộn phim của bạn</div>
  <div class="filmstrip">
    <div id="previewContainer">
      <div id="addBox" onclick="imageInput.click()">
        <i class="bi bi-plus-lg"></i>
        <span>THÊM ẢNH</span>
      </div>
    </div>
  </div>
  <div class="filmstrip-hint">tối đa 9 tấm — chạm để gỡ ảnh</div>

  <div class="booth-label">Viết sau tấm ảnh</div>
  <div class="caption-card">
    <textarea name="message" placeholder="Viết vài dòng lưu niệm…" maxlength="2200" oninput="updateCount(this)"></textarea>
  </div>
  <div class="booth-charcount"><span id="cCount">0</span> / 2.200</div>

  <div class="booth-label">Ghi âm một lời nhắn</div>
  <div class="tape-unit">
    <div class="tape-reels">
      <div class="reel" id="reelL"></div>
      <div class="reel" id="reelR"></div>
    </div>
    <div class="tape-controls">
      <div class="tape-controls-row">
        <button type="button" id="recordBtn">
          <i class="bi bi-mic"></i>
          <span id="recordLabel">Ghi âm</span>
        </button>
        <label class="ig-file-label" for="audioInput">
          <i class="bi bi-upload"></i> Tải lên
        </label>
        <span id="recordStatus"></span>
      </div>
      <input type="file" id="audioInput" name="audio" accept="audio/*">
      <audio id="audioPreview" controls></audio>
    </div>
  </div>

  <div class="shutter-wrap">
    <button type="submit" class="shutter-btn" id="shareBtn">
      <i class="bi bi-camera-fill" id="shareIco"></i>
      <span id="shareLbl">IN ẢNH</span>
    </button>
    <div class="shutter-caption">nhấn nút để lưu khoảnh khắc</div>
  </div>

</form>
</div>

<script>

let selectedImages = [];
let audioFile = null;
let mediaRecorder;
let chunks = [];
let stream;
const rotClasses = ['rot1','rot2','rot3','rot4','rot5'];

// ================= STAR FIELD =================
(function initStars(){
  const field = document.getElementById('starField');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const count = 55;
  for(let i=0;i<count;i++){
    const s = document.createElement('span');
    s.className = 'star-dot';
    const size = (Math.random()*2 + 1).toFixed(1);
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (Math.random()*100)+'vh';
    if(!reduce){
      s.style.animationDuration = (2 + Math.random()*3).toFixed(1)+'s';
      s.style.animationDelay = (Math.random()*4).toFixed(1)+'s';
    }
    field.appendChild(s);
  }
  if(!reduce){
    for(let i=0;i<2;i++){
      const sh = document.createElement('span');
      sh.className = 'shooting-star';
      sh.style.top = (10 + Math.random()*30)+'vh';
      sh.style.right = '-10vw';
      sh.style.animationDelay = (i*3 + Math.random()*4)+'s';
      field.appendChild(sh);
    }
  }
})();

// ================= INTRO CURTAIN =================
(function initCurtain(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const openNow = () => {
    document.body.classList.add('opened');
    document.body.classList.remove('locked');
  };
  if (reduce){
    document.querySelectorAll('.curtain-panel,.curtain-mark').forEach(el=>el.style.transition='none');
    openNow();
    return;
  }
  window.addEventListener('load', () => {
    setTimeout(openNow, 350);
    setTimeout(() => {
      document.body.classList.remove('locked');
    }, 1700);
  });
})();

// LẤY UID TỪ URL
const urlParams = new URLSearchParams(window.location.search);
const uid = urlParams.get("uid");
if (!uid) {
    alert("Không tìm thấy UID NFC");
}

// ================= IMAGE =================
const imageInput = document.getElementById("imageInput");
const previewContainer = document.getElementById("previewContainer");
const addBox = document.getElementById("addBox");

imageInput.addEventListener("change", function () {
    Array.from(this.files).forEach(file => {
        if (selectedImages.length >= 9) return;
        selectedImages.push(file);
        const reader = new FileReader();
        reader.onload = e => {
            const wrap = document.createElement("div");
            const rot = rotClasses[Math.floor(Math.random()*rotClasses.length)];
            wrap.className = "img-item-wrap img-item " + rot;
            wrap.innerHTML = `
                <img src="${e.target.result}" alt="">
                <button type="button" class="btn-remove" onclick="removeImage(this)">
                    <i class="bi bi-x"></i>
                </button>
            `;
            previewContainer.insertBefore(wrap, addBox);
            updateLayout();
        };
        reader.readAsDataURL(file);
    });
    this.value = "";
});

function removeImage(btn) {
    const items = document.querySelectorAll(".img-item");
    const index = Array.from(items).indexOf(btn.closest(".img-item"));
    if (index > -1) selectedImages.splice(index, 1);
    btn.closest(".img-item").remove();
    updateLayout();
}

function updateLayout() {
    addBox.style.display = selectedImages.length >= 9 ? "none" : "flex";
}

// ================= CAPTION COUNT =================
function updateCount(el) {
    document.getElementById("cCount").textContent = el.value.length;
}

// ================= AUDIO UPLOAD =================
const audioInput = document.getElementById("audioInput");
const audioPreview = document.getElementById("audioPreview");

audioInput.addEventListener("change", function () {
    if (this.files.length) {
        audioFile = this.files[0];
        audioPreview.src = URL.createObjectURL(audioFile);
        audioPreview.style.display = "block";
        stopMic();
    }
});

// ================= RECORD =================
function stopMic() {
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
    document.getElementById("reelL").classList.remove("spin");
    document.getElementById("reelR").classList.remove("spin");
}

const recordBtn = document.getElementById("recordBtn");
const recordLabel = document.getElementById("recordLabel");
const recordStatus = document.getElementById("recordStatus");

recordBtn.addEventListener("click", async () => {

    if (!navigator.mediaDevices?.getUserMedia) {
        alert("Thiết bị không hỗ trợ micro");
        return;
    }

    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();

        recordBtn.classList.remove("recording");
        recordLabel.textContent = "Ghi âm";
        recordBtn.querySelector(".bi").className = "bi bi-mic";
        recordStatus.textContent = "Đã xong";
        recordStatus.className = "";

        return;
    }

    try {

        stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        // Ưu tiên định dạng tương thích nhất
        let mimeType = "";

        if (MediaRecorder.isTypeSupported("audio/mp4")) {
            mimeType = "audio/mp4";
        } else if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
            mimeType = "audio/webm;codecs=opus";
        } else if (MediaRecorder.isTypeSupported("audio/webm")) {
            mimeType = "audio/webm";
        }

        mediaRecorder = mimeType
            ? new MediaRecorder(stream, { mimeType })
            : new MediaRecorder(stream);

        chunks = [];

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
                chunks.push(e.data);
            }
        };

        mediaRecorder.onstop = () => {

            const realType = mediaRecorder.mimeType || mimeType;

            const blob = new Blob(chunks, {
                type: realType
            });

            const extension = realType.includes("mp4")
                ? "m4a"
                : "webm";

            audioFile = new File(
                [blob],
                `voice.${extension}`,
                {
                    type: realType
                }
            );

            audioPreview.src = URL.createObjectURL(audioFile);
            audioPreview.style.display = "block";

            stopMic();
        };

        mediaRecorder.start();

        recordBtn.classList.add("recording");
        recordLabel.textContent = "Dừng";
        recordBtn.querySelector(".bi").className = "bi bi-stop-fill";
        recordStatus.textContent = "Đang ghi…";
        recordStatus.className = "active";

        document.getElementById("reelL").classList.add("spin");
        document.getElementById("reelR").classList.add("spin");

    } catch (err) {
        alert(err.message);
        console.error(err);
    }
});

// ================= SUBMIT =================
document.getElementById("giftForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const btn = document.getElementById("shareBtn");
    btn.disabled = true;
    document.getElementById("shareLbl").textContent = "Đang in…";

    // shutter flash on submit
    const flash = document.createElement('div');
    flash.className = 'flash-overlay';
    flash.style.zIndex = 10001;
    document.body.appendChild(flash);
    requestAnimationFrame(() => { flash.style.animation = 'flashPulse .5s ease-out forwards'; });
    setTimeout(() => flash.remove(), 600);

    const formData = new FormData();
    formData.append("message", document.querySelector("textarea[name='message']").value);
    selectedImages.forEach(i => formData.append("images", i));
    if (audioFile) formData.append("audio", audioFile);

    const url = window.location.origin
        + "/api/gift/save/"
        + uid;

    try {
        const res = await fetch(url, { method: "POST", body: formData });

        if (!res.ok) {
            const err = await res.text();
            alert("ERROR: " + err);
            btn.disabled = false;
            document.getElementById("shareLbl").textContent = "IN ẢNH";
            return;
        }

        btn.classList.add("done");
        document.getElementById("shareLbl").textContent = "Đã lưu!";
        document.getElementById("shareIco").className = "bi bi-check-lg";

        setTimeout(() => {
            window.location.href = "/gift/view/" + uid;
        }, 800);

    } catch (err) {
        alert("Lỗi kết nối mạng");
        console.log(err);
        btn.disabled = false;
        document.getElementById("shareLbl").textContent = "IN ẢNH";
    }
});

</script>

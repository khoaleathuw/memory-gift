<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Gift</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    background:#f5f5f5;
}

.card-box{
    max-width:700px;
    margin:40px auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.image-box{
    height:120px;
    border:2px dashed #ccc;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

textarea{
    resize:none;
    border-radius:15px;
}

.voice{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

audio{
    width:100%;
}

.single-mode{
    display:flex !important;
    justify-content:center;
}

.single-mode .img-item{
    width:100%;
}

.single-mode img{
    height:300px !important;
    object-fit:cover;
    border-radius:16px;
}

.img-item img{
    height:120px;
    width:100%;
    object-fit:cover;
    border-radius:14px;
}
</style>
</head>

<body>

<div class="card-box">

<form id="giftForm">

<!-- ================= IMAGES ================= -->
<input type="file" id="imageInput" accept="image/*" multiple hidden>

<div class="section-title">
    <h3>Album</h3>
</div>

<div class="row g-3" id="previewContainer">

    <div class="col-4" id="addBox">
        <div class="image-box" onclick="imageInput.click()">
            <div style="text-align:center">
                <i class="bi bi-plus-lg fs-1"></i>
                <div style="font-size:12px;color:#888">Thêm ảnh</div>
            </div>
        </div>
    </div>

</div>

<!-- ================= TEXT ================= -->
<div class="section-title mt-4">
    <h3>Text Message</h3>
</div>

<textarea class="form-control" name="message" rows="5"></textarea>

<hr class="my-4">

<!-- ================= VOICE ================= -->
<div class="section-title">
    <h3>Voice Message</h3>
</div>

<div class="voice">

    <button type="button" id="recordBtn" class="btn btn-danger">
        🎤 Record
    </button>

    <span id="recordStatus"></span>

    <input type="file" id="audioInput" accept="audio/*" capture class="form-control" style="max-width:200px">

</div>

<audio id="audioPreview" controls class="mt-2"></audio>

<!-- SAVE -->
<div class="text-center mt-4">
    <button class="btn btn-success">
        <i class="bi bi-floppy"></i> Save
    </button>
</div>

</form>

</div>

<script>

/* ================= IMAGE ================= */
const imageInput = document.getElementById("imageInput");
const previewContainer = document.getElementById("previewContainer");
const addBox = document.getElementById("addBox");

let selectedImages = [];
let audioFile = null;

/* ================= AUDIO ================= */
const audioInput = document.getElementById("audioInput");
const audioPreview = document.getElementById("audioPreview");

let mediaRecorder;
let chunks = [];
let stream = null;

/* ================= IMAGE UPLOAD ================= */
imageInput.addEventListener("change", function () {

    const files = Array.from(this.files);

    files.forEach(file => {

        if (selectedImages.length >= 6) return;

        selectedImages.push(file);

        const reader = new FileReader();

        reader.onload = function (e) {

            const col = document.createElement("div");
            col.className = "col-4 img-item";

            col.innerHTML = `
                <div class="position-relative">
                    <img src="${e.target.result}">
                    <button type="button"
                            class="btn btn-danger btn-sm position-absolute top-0 end-0"
                            onclick="removeImage(this)">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
            `;

            previewContainer.insertBefore(col, addBox);
            updateLayout();
        };

        reader.readAsDataURL(file);
    });

    this.value = "";
});

function removeImage(btn){
    const items = document.querySelectorAll(".img-item");
    const index = Array.from(items).indexOf(btn.closest(".img-item"));

    if (index > -1) selectedImages.splice(index, 1);

    btn.closest(".img-item").remove();
    updateLayout();
}

function updateLayout(){
    addBox.style.display = selectedImages.length >= 6 ? "none" : "block";

    previewContainer.classList.toggle(
        "single-mode",
        selectedImages.length === 1
    );
}

/* ================= AUDIO INPUT ================= */
audioInput.addEventListener("change", function () {
    if (this.files.length > 0) {
        audioFile = this.files[0];
        audioPreview.src = URL.createObjectURL(audioFile);

        stopStream();
    }
});

/* ================= RECORD ================= */
const recordBtn = document.getElementById("recordBtn");
const recordStatus = document.getElementById("recordStatus");

function stopStream(){
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
}

recordBtn.addEventListener("click", async () => {

    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        recordBtn.innerText = "🎤 Record";
        recordStatus.innerText = "Stopped";
        return;
    }

    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        mediaRecorder = new MediaRecorder(stream);

        chunks = [];

        mediaRecorder.ondataavailable = e => chunks.push(e.data);

        mediaRecorder.onstop = () => {

            const blob = new Blob(chunks, { type: "audio/webm" });

            audioFile = new File([blob], "voice.webm", {
                type: "audio/webm"
            });

            audioPreview.src = URL.createObjectURL(audioFile);

            stopStream();
        };

        mediaRecorder.start();

        recordBtn.innerText = "⏹ Stop";
        recordStatus.innerText = "Recording...";

    } catch (err) {
        alert("Mic error: " + err.message);
    }
});

/* ================= SUBMIT ================= */
document.getElementById("giftForm").addEventListener("submit", function(e){
    e.preventDefault();

    const formData = new FormData();

    formData.append("message",
        document.querySelector("textarea[name='message']").value
    );

    selectedImages.forEach(file => {
        formData.append("images", file);
    });

    if (audioFile) {
        formData.append("audio", audioFile);
    }

    fetch("/api/gift/save", {
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(id => {
        window.location.href = "/gift/view/" + id;
    })
    .catch(err => {
        console.log(err);
        alert("Save failed!");
    });
});

</script>

</body>
</html>

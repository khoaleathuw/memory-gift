<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chỉnh sửa Matcha Memory</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{
  --milk:#fffef9;
  --cream:#f8faf3;
  --foam:#edf5e5;
  --matcha-soft:#d8e9c5;
  --matcha:#a4c87a;
  --matcha-deep:#66884f;
  --matcha-dark:#415a35;
  --ink:#2e352b;
  --muted:#7b8574;
  --glass:rgba(255,255,255,.72);
  --line:rgba(102,136,79,.18);
  --shadow:0 22px 60px rgba(69,92,53,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html,body,body *,button,input,textarea,select,option,label{
  font-family:Arial,Helvetica,sans-serif!important;
}
body{
  min-height:100vh;min-height:100dvh;color:var(--ink);overflow-x:hidden;
  background:
    radial-gradient(circle at 14% 6%,rgba(255,255,255,.94) 0 7%,transparent 26%),
    radial-gradient(circle at 86% 12%,rgba(216,233,197,.78) 0 9%,transparent 31%),
    radial-gradient(circle at 50% 106%,rgba(164,200,122,.24),transparent 35%),
    linear-gradient(155deg,var(--milk),var(--cream) 46%,var(--foam));
  background-attachment:fixed;
}
.matcha-field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.matcha-particle{
  position:absolute;top:-48px;opacity:0;
  filter:drop-shadow(0 5px 8px rgba(70,95,52,.15));
  animation:matchaFall linear infinite;
}
@keyframes matchaFall{
  0%{opacity:0;transform:translate3d(0,-7vh,0) rotate(0)}
  10%{opacity:.72}90%{opacity:.5}
  100%{opacity:0;transform:translate3d(var(--drift,55px),112vh,0) rotate(280deg)}
}
body::before,body::after{
  content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;
  filter:blur(12px);opacity:.7;
}
body::before{
  width:300px;height:300px;left:-135px;top:18%;
  background:radial-gradient(circle at 35% 30%,#fff 0 18%,rgba(204,226,182,.5) 45%,transparent 72%);
  animation:orbA 11s ease-in-out infinite alternate;
}
body::after{
  width:350px;height:350px;right:-170px;bottom:2%;
  background:radial-gradient(circle at 42% 36%,#fff 0 16%,rgba(164,200,122,.35) 44%,transparent 72%);
  animation:orbB 13s ease-in-out infinite alternate;
}
@keyframes orbA{to{transform:translate(48px,55px) scale(1.08)}}
@keyframes orbB{to{transform:translate(-44px,-38px) scale(.95)}}

.app-shell{
  position:relative;z-index:2;width:min(100%,520px);margin:auto;min-height:100vh;
  padding:18px 14px 90px;
}
.top-actions{
  position:sticky;top:10px;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px;border-radius:22px;background:rgba(255,255,255,.67);
  border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 12px 34px rgba(74,98,56,.12);
}
.icon-btn,.save-top{border:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn{
  width:42px;height:42px;border-radius:50%;background:#fff;color:var(--matcha-deep);
  box-shadow:0 7px 18px rgba(72,94,56,.1);font-size:17px;
}
.save-top{
  min-width:88px;height:42px;padding:0 16px;border-radius:999px;
  background:linear-gradient(145deg,var(--matcha),var(--matcha-deep));
  color:#fff;font-weight:800;font-size:13px;box-shadow:0 8px 18px rgba(102,136,79,.22);
}
.save-top:disabled{opacity:.55;cursor:not-allowed}
.mini-title{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--matcha-dark)}

.hero{text-align:center;padding:28px 10px 18px}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);
  color:var(--matcha-deep);font-size:10px;font-weight:800;letter-spacing:2px;
}
.hero h1{
  margin-top:15px;color:var(--matcha-deep);font-size:clamp(38px,10vw,58px);
  line-height:.94;letter-spacing:-3px;font-weight:900;
}
.hero p{margin-top:11px;color:var(--muted);font-size:12px;line-height:1.5}

.section{margin-top:24px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 7px 10px}
.section-title{display:flex;align-items:center;gap:9px;color:var(--matcha-deep);font-size:15px;font-weight:900}
.section-note{font-size:10px;color:var(--muted)}
.glass-card{
  background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:28px;
  box-shadow:var(--shadow),inset 0 1px 0 #fff;backdrop-filter:blur(20px) saturate(135%);
}

.photo-card{padding:14px}
.ig-photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ig-photo-item{
  aspect-ratio:1;position:relative;overflow:hidden;border-radius:18px;background:#fff;
  border:1px solid var(--line);box-shadow:0 10px 24px rgba(76,99,59,.1);
}
.ig-photo-item:nth-child(n){transform:none}
.ig-photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.del-btn{
  position:absolute;top:7px;right:7px;width:27px;height:27px;border:0;border-radius:50%;
  background:rgba(32,41,28,.76);color:#fff;display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(6px);
}
.ig-add-slot{
  aspect-ratio:1;border:1.5px dashed rgba(102,136,79,.4);border-radius:18px;
  background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(227,239,214,.62));
  color:var(--matcha-deep);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;cursor:pointer;font-size:10px;font-weight:900;
}
.ig-add-slot i{font-size:25px}
.upload-hint{text-align:center;color:var(--muted);font-size:10.5px;padding:11px 4px 2px}

.note-card{position:relative;padding:22px 20px}
.note-card::before{
  content:"";position:absolute;top:-8px;left:50%;width:84px;height:22px;
  transform:translateX(-50%) rotate(1.5deg);background:rgba(216,233,197,.86);
  box-shadow:0 3px 10px rgba(79,102,61,.08);
}
.note-card textarea{
  width:100%;min-height:150px;border:0;outline:0;resize:none;background:transparent;
  color:var(--ink);font-size:17px;font-weight:600;line-height:1.62;
}
.note-card textarea::placeholder{color:rgba(76,88,70,.42);font-size:14px;font-weight:400}
.charcount{text-align:right;margin:7px 8px 0;color:var(--muted);font-size:10px}

.audio-card{padding:18px;display:flex;gap:15px;align-items:center}
.matcha-cup{
  width:72px;height:72px;border-radius:50%;flex:0 0 72px;display:grid;place-items:center;
  background:radial-gradient(circle at 33% 30%,#fff 0 10%,#dcecc9 22%,#a7cc7b 58%,#66884f 100%);
  box-shadow:inset 0 0 0 7px rgba(255,255,255,.72),0 12px 28px rgba(82,109,61,.2);
  color:#fff;font-size:24px;position:relative;
}
.matcha-cup::after{
  content:"";position:absolute;width:22px;height:22px;border:4px solid rgba(102,136,79,.6);
  border-left:0;border-radius:0 14px 14px 0;right:-15px;top:25px;
}
.audio-main{flex:1;min-width:0}
.tape-play-row{display:flex;align-items:center;gap:11px}
.tape-play-btn{
  width:42px;height:42px;border:0;border-radius:50%;
  background:linear-gradient(145deg,var(--matcha),var(--matcha-deep));
  color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 42px;
}
.tape-progress-wrap{flex:1;min-width:0}
.tape-progress{height:7px;border-radius:999px;background:rgba(102,136,79,.16);cursor:pointer;overflow:hidden}
.tape-progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--matcha),var(--matcha-deep));border-radius:999px}
.tape-times{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:10px}
.tape-remove{border:0;background:rgba(255,255,255,.75);color:#8b5d5d;width:38px;height:38px;border-radius:50%;cursor:pointer}
#hiddenOldAudio,#audioPreview{display:none}

.voice-card{padding:18px}
.voice-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.pill-btn,.pill-upload{
  display:flex;align-items:center;gap:7px;border:1px solid rgba(102,136,79,.22);
  border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.76);
  color:var(--matcha-dark);font-size:11px;font-weight:800;cursor:pointer;
}
.pill-btn.recording{color:#c54c58;border-color:#dd6a73;animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.55}}
#recStatus{display:block;margin-top:10px;color:var(--muted);font-size:10px}
#recStatus.active{color:#c54c58}
#newAudioWrap{margin-top:12px}

.bottom-bar{
  position:sticky;bottom:0;z-index:25;margin-top:30px;padding:14px 0 4px;
  background:linear-gradient(180deg,transparent,rgba(248,250,243,.95) 34%);
}
.save-btn{
  width:100%;border:0;border-radius:18px;padding:16px;
  background:linear-gradient(145deg,var(--matcha),var(--matcha-deep));
  color:#fff;font-size:15px;font-weight:900;cursor:pointer;
  box-shadow:0 14px 30px rgba(82,109,61,.24);
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.save-btn:disabled{opacity:.65;cursor:not-allowed}
.save-btn.saving{background:#8d9d83;box-shadow:none}
.save-btn.done{background:linear-gradient(145deg,#66c99f,#2f9472)}

.reel{width:0;height:0;display:none}
@media(max-width:380px){
  .app-shell{padding-left:9px;padding-right:9px}
  .ig-photo-grid{gap:7px}
  .audio-card{align-items:flex-start}
  .matcha-cup{width:62px;height:62px;flex-basis:62px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="matcha-field" id="matchaField" aria-hidden="true"></div>

<main class="app-shell">
<form id="giftForm">
  <input type="hidden" id="uid" th:value="${nfcUid}">
  <input type="hidden" id="theme" th:value="${gift.theme}">

  <div class="top-actions">
    <button class="icon-btn" type="button" onclick="history.back()" aria-label="Đóng">
      <i class="bi bi-x-lg"></i>
    </button>
    <div class="mini-title">CHỈNH SỬA MATCHA</div>
    <button class="save-top" type="button" id="topSaveBtn">Lưu</button>
  </div>

  <header class="hero">
    <div class="hero-badge"><i class="bi bi-cup-hot"></i> MATCHA MEMORY EDIT</div>
    <h1>Chỉnh sửa<br>ký ức</h1>
    <p>Thêm ảnh, thay lời nhắn hoặc cập nhật giọng nói của món quà.</p>
  </header>

  <section class="section">
    <div class="section-head">
      <div class="section-title"><i class="bi bi-images"></i> Ảnh của bạn</div>
      <div class="section-note">Tối đa 9 ảnh</div>
    </div>
    <div class="glass-card photo-card">
      <div class="ig-photo-grid" id="previewContainer">
        <div class="ig-photo-item" th:each="img : ${gift.images}">
          <img th:src="@{'/files/images/' + ${img.imageUrl}}" alt="Ảnh Gift">
          <button type="button" class="del-btn old-image"
                  th:data-url="${img.imageUrl}" aria-label="Xóa ảnh">
            <i class="bi bi-x"></i>
          </button>
        </div>
        <div class="ig-add-slot" id="addSlot" role="button" tabindex="0">
          <i class="bi bi-plus-lg"></i>
          <span>THÊM ẢNH</span>
        </div>
      </div>
      <div class="upload-hint">Chạm dấu × trên ảnh để xóa ảnh không cần giữ</div>
    </div>
    <input type="file" id="imageInput"
           accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif"
           multiple hidden>
  </section>

  <section class="section">
    <div class="section-head">
      <div class="section-title"><i class="bi bi-envelope-paper-heart"></i> Lời nhắn</div>
    </div>
    <div class="glass-card note-card">
      <textarea id="message" placeholder="Viết một lời nhắn dịu dàng…"
                maxlength="2200" th:text="${gift.message}"></textarea>
    </div>
    <div class="charcount"><span id="cCount">0</span> / 2.200</div>
  </section>

  <section class="section" id="oldAudioBox"
           th:if="${gift.voiceUrl != null and gift.voiceUrl != ''}">
    <div class="section-head">
      <div class="section-title"><i class="bi bi-play-circle"></i> Ghi âm hiện tại</div>
    </div>
    <div class="glass-card audio-card">
      <div class="matcha-cup"><i class="bi bi-music-note-beamed"></i></div>
      <div class="audio-main">
        <div class="tape-play-row">
          <button type="button" class="tape-play-btn" id="oldPlayBtn">
            <i class="bi bi-play-fill" id="oldPlayIco"></i>
          </button>
          <div class="tape-progress-wrap">
            <div class="tape-progress" id="oldProgressBar">
              <div class="tape-progress-bar" id="oldBar"></div>
            </div>
            <div class="tape-times"><span id="oldCur">0:00</span><span id="oldDur">0:00</span></div>
          </div>
        </div>
      </div>
      <button type="button" class="tape-remove" id="removeOldAudioBtn" aria-label="Xóa audio cũ">
        <i class="bi bi-trash"></i>
      </button>
      <div hidden><div id="oldReelL"></div><div id="oldReelR"></div></div>
    </div>
    <audio id="hiddenOldAudio" preload="metadata">
      <source th:src="@{'/files/audio/' + ${gift.voiceUrl}}">
    </audio>
  </section>

  <section class="section">
    <div class="section-head">
      <div class="section-title"><i class="bi bi-soundwave"></i> Giọng nói mới</div>
    </div>
    <div class="glass-card voice-card">
      <div class="voice-row">
        <button type="button" class="pill-btn" id="recordBtn">
          <i class="bi bi-mic" id="recIco"></i>
          <span id="recLabel">Ghi âm</span>
        </button>
        <label class="pill-upload" for="audioInput">
          <i class="bi bi-upload"></i> Tải lên
        </label>
        <span id="recStatus"></span>
        <input type="file" id="audioInput" accept="audio/*" hidden>
      </div>

      <div class="glass-card audio-card" id="newAudioWrap" style="display:none;">
        <div class="matcha-cup"><i class="bi bi-mic-fill"></i></div>
        <div class="audio-main">
          <div class="tape-play-row">
            <button type="button" class="tape-play-btn" id="newPlayBtn">
              <i class="bi bi-play-fill" id="newPlayIco"></i>
            </button>
            <div class="tape-progress-wrap">
              <div class="tape-progress" id="newProgressBar">
                <div class="tape-progress-bar" id="newBar"></div>
              </div>
              <div class="tape-times"><span id="newCur">0:00</span><span id="newDur">0:00</span></div>
            </div>
          </div>
        </div>
        <button type="button" class="tape-remove" id="removeNewAudioBtn" aria-label="Xóa audio mới">
          <i class="bi bi-trash"></i>
        </button>
        <div hidden><div id="newReelL"></div><div id="newReelR"></div></div>
      </div>
      <audio id="audioPreview" preload="metadata"></audio>
    </div>
  </section>

  <div class="bottom-bar">
    <button class="save-btn" type="submit" id="saveBtn">
      <i class="bi bi-check-lg" id="saveIco"></i>
      <span id="saveLbl">Lưu thay đổi</span>
    </button>
  </div>
</form>
</main>

<script>

    /* =========================================
       STATE
    ========================================= */

    let newImages = [];

    let deletedImages = [];

    let newAudio = null;

    let removeOldAudio = false;

    let isSaving = false;

    let recorder = null;

    let recordedChunks = [];

    let microphoneStream = null;

    let newAudioObjectUrl = null;


    /* =========================================
       ELEMENTS
    ========================================= */

    const giftForm =
        document.getElementById("giftForm");

    const uidInput =
        document.getElementById("uid");

    const themeInput =
        document.getElementById("theme");

    const previewContainer =
        document.getElementById("previewContainer");

    const addSlot =
        document.getElementById("addSlot");

    const imageInput =
        document.getElementById("imageInput");

    const messageInput =
        document.getElementById("message");

    const countElement =
        document.getElementById("cCount");

    const oldAudio =
        document.getElementById("hiddenOldAudio");

    const oldAudioBox =
        document.getElementById("oldAudioBox");

    const newAudioElement =
        document.getElementById("audioPreview");

    const newAudioWrap =
        document.getElementById("newAudioWrap");

    const audioInput =
        document.getElementById("audioInput");

    const recordBtn =
        document.getElementById("recordBtn");

    const recordLabel =
        document.getElementById("recLabel");

    const recordIcon =
        document.getElementById("recIco");

    const recordStatus =
        document.getElementById("recStatus");

    const saveBtn =
        document.getElementById("saveBtn");

    const topSaveBtn =
        document.getElementById("topSaveBtn");

    const saveLabel =
        document.getElementById("saveLbl");

    const saveIcon =
        document.getElementById("saveIco");


    /* =========================================
       MATCHA LEAVES
    ========================================= */

    (function createMatchaLeaves() {

        const field =
            document.getElementById("matchaField");


        const reducedMotion =
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;


        const totalPetals =
            reducedMotion ? 12 : 32;


        for (
            let index = 0;
            index < totalPetals;
            index++
        ) {

            const petal =
                document.createElement("span");


            petal.className =
                "matcha-particle";


            petal.textContent =
                Math.random() > 0.35
                    ? "🍃"
                    : "·";


            petal.style.left =
                Math.random() * 100 + "vw";


            petal.style.fontSize =
                8 + Math.random() * 11 + "px";


            petal.style.setProperty(
                "--drift",
                -80 + Math.random() * 160 + "px"
            );


            petal.style.animationDuration =
                7 + Math.random() * 9 + "s";


            petal.style.animationDelay =
                Math.random() * 10 + "s";


            field.appendChild(petal);
        }

    })();


    /* =========================================
       UID
    ========================================= */

    function getUid() {

        const modelUid =
            uidInput?.value?.trim();


        if (modelUid) {

            return modelUid;
        }


        return new URLSearchParams(
            window.location.search
        )
            .get("uid")
            ?.trim() || "";
    }


    const uid =
        getUid();


    if (!uid) {

        alert(
            "Không tìm thấy UID NFC."
        );

        saveBtn.disabled =
            true;

        topSaveBtn.disabled =
            true;
    }


    /* =========================================
       MESSAGE COUNT
    ========================================= */

    function updateMessageCount() {

        countElement.textContent =
            messageInput.value.length;
    }


    messageInput.addEventListener(
        "input",
        updateMessageCount
    );


    updateMessageCount();


    /* =========================================
       OLD IMAGES
    ========================================= */

    document
        .querySelectorAll(".old-image")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const imageUrl =
                        button.dataset.url;


                    if (
                        imageUrl &&
                        !deletedImages.includes(
                            imageUrl
                        )
                    ) {

                        deletedImages.push(
                            imageUrl
                        );
                    }


                    button
                        .closest(".ig-photo-item")
                        ?.remove();


                    updateAddSlot();
                }
            );

        });


    /* =========================================
       NEW IMAGES
    ========================================= */

    addSlot.addEventListener(
        "click",
        () => {

            imageInput.click();
        }
    );


    addSlot.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                imageInput.click();
            }

        }
    );


    imageInput.addEventListener(
        "change",
        function () {

            const currentCount =
                previewContainer
                    .querySelectorAll(
                        ".ig-photo-item"
                    )
                    .length;


            const remainingSlots =
                9 - currentCount;


            const files =
                Array.from(this.files);


            if (
                files.length >
                remainingSlots
            ) {

                alert(
                    "Bạn chỉ được giữ tối đa 9 ảnh."
                );
            }


            files
                .slice(0, remainingSlots)
                .forEach(addNewImage);


            this.value = "";
        }
    );


    function addNewImage(file) {

        if (
            !file.type.startsWith("image/")
        ) {

            return;
        }


        newImages.push(file);


        const reader =
            new FileReader();


        reader.addEventListener(
            "load",
            event => {

                const wrapper =
                    document.createElement("div");


                wrapper.className =
                    "ig-photo-item";


                const image =
                    document.createElement("img");


                image.src =
                    event.target.result;


                image.alt =
                    "Ảnh mới";


                const removeButton =
                    document.createElement("button");


                removeButton.type =
                    "button";


                removeButton.className =
                    "del-btn";


                removeButton.innerHTML =
                    '<i class="bi bi-x"></i>';


                removeButton.addEventListener(
                    "click",
                    () => {

                        const index =
                            newImages
                                .indexOf(file);


                        if (
                            index !== -1
                        ) {

                            newImages.splice(
                                index,
                                1
                            );
                        }


                        wrapper.remove();

                        updateAddSlot();
                    }
                );


                wrapper.appendChild(image);

                wrapper.appendChild(
                    removeButton
                );


                previewContainer.insertBefore(
                    wrapper,
                    addSlot
                );


                updateAddSlot();
            }
        );


        reader.addEventListener(
            "error",
            () => {

                const index =
                    newImages
                        .indexOf(file);


                if (
                    index !== -1
                ) {

                    newImages.splice(
                        index,
                        1
                    );
                }


                alert(
                    "Không thể đọc ảnh: " +
                    file.name
                );
            }
        );


        reader.readAsDataURL(file);
    }


    function updateAddSlot() {

        const count =
            previewContainer
                .querySelectorAll(
                    ".ig-photo-item"
                )
                .length;


        addSlot.style.display =
            count >= 9
                ? "none"
                : "flex";
    }


    updateAddSlot();


    /* =========================================
       TIME FORMAT
    ========================================= */

    function formatTime(seconds) {

        if (
            !Number.isFinite(seconds)
        ) {

            return "0:00";
        }


        const minutes =
            Math.floor(seconds / 60);


        const remainingSeconds =
            Math.floor(seconds % 60)
                .toString()
                .padStart(2, "0");


        return (
            minutes +
            ":" +
            remainingSeconds
        );
    }


    /* =========================================
       OLD AUDIO PLAYER
    ========================================= */

    if (oldAudio) {

        oldAudio.addEventListener(
            "loadedmetadata",
            () => {

                document
                    .getElementById("oldDur")
                    .textContent =
                    formatTime(
                        oldAudio.duration
                    );
            }
        );


        oldAudio.addEventListener(
            "timeupdate",
            () => {

                const percentage =
                    oldAudio.duration
                        ? (
                            oldAudio.currentTime /
                            oldAudio.duration
                        ) * 100
                        : 0;


                document
                    .getElementById("oldBar")
                    .style
                    .width =
                    percentage + "%";


                document
                    .getElementById("oldCur")
                    .textContent =
                    formatTime(
                        oldAudio.currentTime
                    );
            }
        );


        oldAudio.addEventListener(
            "play",
            () => {

                document
                    .getElementById("oldPlayIco")
                    .className =
                    "bi bi-pause-fill";


                document
                    .getElementById("oldReelL")
                    ?.classList
                    .add("spin");


                document
                    .getElementById("oldReelR")
                    ?.classList
                    .add("spin");
            }
        );


        oldAudio.addEventListener(
            "pause",
            resetOldAudioVisual
        );


        oldAudio.addEventListener(
            "ended",
            resetOldAudioVisual
        );


        document
            .getElementById("oldPlayBtn")
            ?.addEventListener(
                "click",
                async () => {

                    if (
                        oldAudio.paused
                    ) {

                        pauseNewAudio();

                        try {

                            await oldAudio.play();

                        } catch (error) {

                            console.error(error);
                        }

                    } else {

                        oldAudio.pause();
                    }

                }
            );


        document
            .getElementById("oldProgressBar")
            ?.addEventListener(
                "click",
                event => {

                    if (
                        !oldAudio.duration
                    ) {

                        return;
                    }


                    const rect =
                        event.currentTarget
                            .getBoundingClientRect();


                    const ratio =
                        Math.min(
                            1,
                            Math.max(
                                0,
                                (
                                    event.clientX -
                                    rect.left
                                ) /
                                rect.width
                            )
                        );


                    oldAudio.currentTime =
                        ratio *
                        oldAudio.duration;
                }
            );


        document
            .getElementById("removeOldAudioBtn")
            ?.addEventListener(
                "click",
                () => {

                    removeOldAudio =
                        true;


                    oldAudio.pause();


                    oldAudioBox.style.display =
                        "none";
                }
            );
    }


    function resetOldAudioVisual() {

        document
            .getElementById("oldPlayIco")
            ?.setAttribute(
                "class",
                "bi bi-play-fill"
            );


        document
            .getElementById("oldReelL")
            ?.classList
            .remove("spin");


        document
            .getElementById("oldReelR")
            ?.classList
            .remove("spin");
    }


    /* =========================================
       NEW AUDIO PLAYER
    ========================================= */

    function revokeNewAudioUrl() {

        if (
            newAudioObjectUrl
        ) {

            URL.revokeObjectURL(
                newAudioObjectUrl
            );


            newAudioObjectUrl =
                null;
        }
    }


    function showNewAudio(file) {

        revokeNewAudioUrl();


        newAudioObjectUrl =
            URL.createObjectURL(file);


        newAudioElement.src =
            newAudioObjectUrl;


        newAudioWrap.style.display =
            "flex";


        newAudioElement.load();
    }


    newAudioElement.addEventListener(
        "loadedmetadata",
        () => {

            document
                .getElementById("newDur")
                .textContent =
                formatTime(
                    newAudioElement.duration
                );
        }
    );


    newAudioElement.addEventListener(
        "timeupdate",
        () => {

            const percentage =
                newAudioElement.duration
                    ? (
                        newAudioElement.currentTime /
                        newAudioElement.duration
                    ) * 100
                    : 0;


            document
                .getElementById("newBar")
                .style
                .width =
                percentage + "%";


            document
                .getElementById("newCur")
                .textContent =
                formatTime(
                    newAudioElement.currentTime
                );
        }
    );


    newAudioElement.addEventListener(
        "play",
        () => {

            document
                .getElementById("newPlayIco")
                .className =
                "bi bi-pause-fill";


            document
                .getElementById("newReelL")
                .classList
                .add("spin");


            document
                .getElementById("newReelR")
                .classList
                .add("spin");
        }
    );


    newAudioElement.addEventListener(
        "pause",
        resetNewAudioVisual
    );


    newAudioElement.addEventListener(
        "ended",
        resetNewAudioVisual
    );


    document
        .getElementById("newPlayBtn")
        .addEventListener(
            "click",
            async () => {

                if (
                    newAudioElement.paused
                ) {

                    if (oldAudio) {

                        oldAudio.pause();
                    }


                    try {

                        await newAudioElement.play();

                    } catch (error) {

                        console.error(error);
                    }

                } else {

                    newAudioElement.pause();
                }

            }
        );


    document
        .getElementById("newProgressBar")
        .addEventListener(
            "click",
            event => {

                if (
                    !newAudioElement.duration
                ) {

                    return;
                }


                const rect =
                    event.currentTarget
                        .getBoundingClientRect();


                const ratio =
                    Math.min(
                        1,
                        Math.max(
                            0,
                            (
                                event.clientX -
                                rect.left
                            ) /
                            rect.width
                        )
                    );


                newAudioElement.currentTime =
                    ratio *
                    newAudioElement.duration;
            }
        );


    document
        .getElementById("removeNewAudioBtn")
        .addEventListener(
            "click",
            () => {

                pauseNewAudio();


                newAudio =
                    null;


                audioInput.value =
                    "";


                newAudioElement.removeAttribute(
                    "src"
                );


                newAudioElement.load();


                revokeNewAudioUrl();


                newAudioWrap.style.display =
                    "none";


                /*
                 * Không tự khôi phục audio cũ.
                 * Nếu trước đó đã chọn thay audio,
                 * removeOldAudio vẫn giữ true.
                 */
            }
        );


    function pauseNewAudio() {

        if (
            !newAudioElement.paused
        ) {

            newAudioElement.pause();
        }


        resetNewAudioVisual();
    }


    function resetNewAudioVisual() {

        document
            .getElementById("newPlayIco")
            .className =
            "bi bi-play-fill";


        document
            .getElementById("newReelL")
            .classList
            .remove("spin");


        document
            .getElementById("newReelR")
            .classList
            .remove("spin");
    }


    /* =========================================
       AUDIO UPLOAD
    ========================================= */

    audioInput.addEventListener(
        "change",
        function () {

            if (
                !this.files.length
            ) {

                return;
            }


            if (
                recorder &&
                recorder.state ===
                "recording"
            ) {

                recorder.stop();
            }


            stopMicrophone();


            newAudio =
                this.files[0];


            showNewAudio(
                newAudio
            );


            removeOldAudio =
                true;


            if (
                oldAudioBox
            ) {

                oldAudio?.pause();

                oldAudioBox.style.display =
                    "none";
            }


            setRecordIdle(
                "Đã chọn file"
            );
        }
    );


    /* =========================================
       RECORD AUDIO
    ========================================= */

    recordBtn.addEventListener(
        "click",
        async () => {

            if (
                !navigator.mediaDevices
                ?.getUserMedia
            ) {

                alert(
                    "Thiết bị không hỗ trợ microphone."
                );

                return;
            }


            if (
                recorder &&
                recorder.state ===
                "recording"
            ) {

                recorder.stop();

                return;
            }


            try {

                microphoneStream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            audio: true
                        });


                recordedChunks =
                    [];


                const mimeType =
                    getSupportedAudioType();


                recorder =
                    mimeType
                        ? new MediaRecorder(
                            microphoneStream,
                            {
                                mimeType
                            }
                        )
                        : new MediaRecorder(
                            microphoneStream
                        );


                recorder.addEventListener(
                    "dataavailable",
                    event => {

                        if (
                            event.data &&
                            event.data.size > 0
                        ) {

                            recordedChunks.push(
                                event.data
                            );
                        }

                    }
                );


                recorder.addEventListener(
                    "stop",
                    () => {

                        const realType =
                            recorder.mimeType ||
                            mimeType ||
                            "audio/webm";


                        const blob =
                            new Blob(
                                recordedChunks,
                                {
                                    type:
                                        realType
                                }
                            );


                        const extension =
                            realType.includes("mp4")
                                ? "m4a"
                                : realType.includes("ogg")
                                    ? "ogg"
                                    : "webm";


                        newAudio =
                            new File(
                                [blob],
                                "record." +
                                extension,
                                {
                                    type:
                                        realType
                                }
                            );


                        showNewAudio(
                            newAudio
                        );


                        removeOldAudio =
                            true;


                        if (
                            oldAudioBox
                        ) {

                            oldAudio?.pause();

                            oldAudioBox.style.display =
                                "none";
                        }


                        stopMicrophone();


                        setRecordIdle(
                            "Đã ghi xong"
                        );
                    }
                );


                recorder.start();


                recordBtn.classList.add(
                    "recording"
                );


                recordIcon.className =
                    "bi bi-stop-fill";


                recordLabel.textContent =
                    "Dừng";


                recordStatus.textContent =
                    "Đang ghi…";


                recordStatus.className =
                    "active";


                document
                    .getElementById("newReelL")
                    .classList
                    .add("spin");


                document
                    .getElementById("newReelR")
                    .classList
                    .add("spin");

            } catch (error) {

                stopMicrophone();


                console.error(error);


                alert(
                    "Không mở được microphone. Hãy cấp quyền micro cho trình duyệt."
                );
            }

        }
    );


    function getSupportedAudioType() {

        const mimeTypes = [
            "audio/mp4",
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/ogg;codecs=opus"
        ];


        for (
            const mimeType of mimeTypes
        ) {

            if (
                MediaRecorder.isTypeSupported(
                    mimeType
                )
            ) {

                return mimeType;
            }
        }


        return "";
    }


    function stopMicrophone() {

        if (
            microphoneStream
        ) {

            microphoneStream
                .getTracks()
                .forEach(track => {

                    track.stop();
                });


            microphoneStream =
                null;
        }


        document
            .getElementById("newReelL")
            .classList
            .remove("spin");


        document
            .getElementById("newReelR")
            .classList
            .remove("spin");
    }


    function setRecordIdle(text) {

        recordBtn.classList.remove(
            "recording"
        );


        recordIcon.className =
            "bi bi-mic";


        recordLabel.textContent =
            "Ghi âm";


        recordStatus.textContent =
            text || "";


        recordStatus.className =
            "";
    }


    /* =========================================
       SUBMIT
    ========================================= */

    topSaveBtn.addEventListener(
        "click",
        () => {

            giftForm.requestSubmit();
        }
    );


    giftForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            if (
                isSaving ||
                !uid
            ) {

                return;
            }


            if (
                recorder &&
                recorder.state ===
                "recording"
            ) {

                alert(
                    "Hãy dừng ghi âm trước khi lưu."
                );

                return;
            }


            isSaving =
                true;


            setSavingState();


            const formData =
                new FormData();


            formData.append(
                "message",
                messageInput.value
            );


            const theme =
                themeInput?.value?.trim()
                || "matcha";


            formData.append(
                "theme",
                theme
            );


            newImages.forEach(
                image => {

                    formData.append(
                        "images",
                        image
                    );
                }
            );


            if (
                newAudio
            ) {

                formData.append(
                    "audio",
                    newAudio
                );
            }


            formData.append(
                "removeOldAudio",
                String(removeOldAudio)
            );


            deletedImages.forEach(
                imageUrl => {

                    formData.append(
                        "deleteImages",
                        imageUrl
                    );
                }
            );


            const apiUrl =
                    "/api/gift/update/" +
                    encodeURIComponent(uid);


            try {

                const response =
                    await fetch(
                        apiUrl,
                        {
                            method:
                                "POST",

                            body:
                                formData
                        }
                    );


                const responseText =
                    await response.text();


                if (
                    !response.ok
                ) {

                    throw new Error(
                        responseText ||
                        "Không thể cập nhật Gift."
                    );
                }


                setSuccessState();


                setTimeout(
                    () => {

                        window.location.href =
                                "/gift/view/" +
                                encodeURIComponent(uid);

                    },
                    700
                );

            } catch (error) {

                console.error(error);


                alert(
                    "Lỗi: " +
                    error.message
                );


                resetSavingState();
            }

        }
    );


    function setSavingState() {

        saveBtn.disabled =
            true;


        topSaveBtn.disabled =
            true;


        saveBtn.classList.add(
            "saving"
        );


        saveLabel.textContent =
            "Đang lưu…";


        saveIcon.className =
            "bi bi-hourglass-split";
    }


    function setSuccessState() {

        saveBtn.classList.remove(
            "saving"
        );


        saveBtn.classList.add(
            "done"
        );


        saveLabel.textContent =
            "Đã lưu!";


        saveIcon.className =
            "bi bi-check-lg";
    }


    function resetSavingState() {

        isSaving =
            false;


        saveBtn.disabled =
            false;


        topSaveBtn.disabled =
            false;


        saveBtn.classList.remove(
            "saving",
            "done"
        );


        saveLabel.textContent =
            "Lưu thay đổi";


        saveIcon.className =
            "bi bi-check-lg";
    }


    window.addEventListener(
        "beforeunload",
        () => {

            stopMicrophone();

            revokeNewAudioUrl();
        }
    );

</script>
